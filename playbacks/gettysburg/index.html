t position).","location":{"source":"map_read","basis":"Read from the Bachelder 1876 first-day map (S18), georeferenced; good to about 20-40 m.","confidence":"medium","precision_m":40},"sources":["S18"],"review":"Needs review","battle":"GETT-D1","via":[[-77.20295,39.87244],[-77.20471,39.86957],[-77.20752,39.86483],[-77.20957,39.862],[-77.21929,39.8526]]},{"id":"P107","start":[null,"1863-07-01T15:45"],"end":[null,null],"show":["1863-07-01T15:45","1863-07-01T16:00"],"at":[[-77.22853,39.83836],[-77.22711,39.83745],[-77.22569,39.83654],[-77.2247,39.83598]],"activity":"Line of battle, advancing on the town","place":"North-east of the town, north of Stevens Run","quote":"Map label: \"HAYS LA. 3.45 P.M.\"","method":"stated","confidence":"medium","time_basis":"Map label \"3.45 P.M.\" (S18)","location":{"source":"map_read","basis":"Read from the Bachelder 1876 first-day map (S18), georeferenced; good to about 20-40 m.","confidence":"medium","precision_m":40},"sources":["S18"],"review":"Accepted","battle":"GETT-D1"},{"id":"P117","start":["1863-07-01T16:30",null],"end":[null,"1863-07-01T23:59"],"show":["1863-07-01T16:40","1863-07-01T19:30"],"at":[[-77.230225,39.82715],[-77.224022,39.82739]],"activity":"Halted in the town","place":"One of the southern streets of the town, east of Baltimore Street","quote":"S51: \"rested my line on one of the upper southern streets\", held until about midnight","method":"stated","confidence":"medium","time_basis":"Inferred: the Union retreat through the town was over by about 4.30 p.m. (S16, S49). Hays's report gives the line without a time.","location":{"source":"map_read","basis":"Read from Bachelder's second-day sheet (S53): Hays's line just south-east of the town, from Baltimore Street east, facing Cemetery Hill (\"one of the upper southern streets\" in his report, S51).","confidence":"medium","precision_m":40},"sources":["S51","S53","S16"],"notes":"The second-day sheet shows the brigade's first position of 2 July; the playback takes it as where the brigade stood from the evening of 1 July.","review":"Needs review","battle":"GETT-D1"}]},{"id":"CS-AVERY","unit":"CS-AVERY","steps":[{"id":"P133","start":[null,"1863-07-01T13:30"],"end":["1863-07-01T13:30",null],"show":["1863-07-01T13:40","1863-07-01T13:40"],"at":[[-77.20295,39.87244]],"activity":"With Early's column","place":"Heidlersburg road (today Old Harrisburg Road), about 3 km north-east of the knoll on Rock Creek","quote":"S58, p. 468: \"on the direct road from Heidlersburg\"","method":"interpolated","confidence":"low","time_basis":"Estimate: no source read gives a clock time for the approach. Set so the column reaches the open bars Bachelder draws for Early's first line, and Gordon's line labelled 3 P.M., in time.","location":{"source":"estimate","basis":"On the road the reports name, at the north-east edge of the road data used here.","confidence":"low","precision_m":500},"sources":["S58","S57","S55"],"notes":"Shown leaving its division's last recorded position. Where the unit itself was at this moment is not in the sources read.","review":"Accepted","battle":"GETT-D1","virtual":true},{"id":"P108","start":[null,null],"end":[null,null],"show":["1863-07-01T14:30","1863-07-01T15:10"],"at":[[-77.21474,39.85016],[-77.21046,39.84838]],"activity":"Deployed","place":"East of the Harrisburg road","method":"stated","confidence":"low","time_basis":"No time is printed beside these bars. Open bars (a first position).","location":{"source":"map_read","basis":"Read from the Bachelder 1876 first-day map (S18), georeferenced; good to about 20-40 m.","confidence":"medium","precision_m":40},"sources":["S18"],"review":"Needs review","battle":"GETT-D1","via":[[-77.20295,39.87244],[-77.20471,39.86957],[-77.20752,39.86483],[-77.20957,39.862],[-77.21474,39.85016]]},{"id":"P109","start":[null,"1863-07-01T15:45"],"end":[null,null],"show":["1863-07-01T15:45","1863-07-01T16:00"],"at":[[-77.2247,39.83592],[-77.22356,39.83518],[-77.22229,39.83428]],"activity":"Line of battle, advancing on the town","place":"North-east of the town, from Stevens Run to the railroad","quote":"Map label: \"HOKE N.C.\" in the line labelled 3.45 P.M.","method":"stated","confidence":"medium","time_basis":"Map label \"3.45 P.M.\" (S18)","location":{"source":"map_read","basis":"Read from the Bachelder 1876 first-day map (S18), georeferenced; good to about 20-40 m.","confidence":"medium","precision_m":40},"sources":["S18"],"review":"Accepted","battle":"GETT-D1"},{"id":"P118","start":["1863-07-01T16:30",null],"end":[null,null],"show":["1863-07-01T16:40","1863-07-01T19:30"],"at":[[-77.224022,39.82739],[-77.220004,39.827433]],"activity":"Halted on Hays's left","place":"East of Hays, out beyond the eastern edge of the town","quote":"S51: Hoke's brigade (Avery) on Hays's left, \"extending beyond the eastern suburbs\"","method":"stated","confidence":"medium","time_basis":"Inferred: the Union retreat through the town was over by about 4.30 p.m. (S16, S49). Hays's report gives the line without a time.","location":{"source":"map_read","basis":"Read from Bachelder's second-day sheet (S53): Hoke's brigade (Avery) continuing Hays's line east, \"beyond the eastern suburbs\" (S51).","confidence":"medium","precision_m":40},"sources":["S51","S53","S16"],"notes":"The second-day sheet shows the brigade's first position of 2 July; the playback takes it as where the brigade stood from the evening of 1 July.","review":"Needs review","battle":"GETT-D1"}]}],"events":[{"id":"GE01","start":"1863-07-01T07:00","end":"1863-07-01T07:30","at":"1863-07-01T07:30","name":"First shot","text":"A picket of the 8th Illinois Cavalry fires on the head of Archer's column on the Chambersburg Pike at Knoxlyn Road. The marker on the spot says 7:30; the Army's campaign history says about 7:00.","steps":["P02","P14"],"sources":["S14","S55"],"battle":"GETT-D1-AM"},{"id":"GE02","start":"1863-07-01T08:00","end":"1863-07-01T08:00","at":"1863-07-01T08:00","name":"Buford forms","text":"Gamble and Devin form line of battle and Calef's guns go into battery on the pike.","steps":["P04","P06","P10","P11","P12"],"sources":["S01","S02","S03"],"battle":"GETT-D1-AM"},{"id":"GE03","start":"1863-07-01T09:00","end":"1863-07-01T09:00","at":"1863-07-01T09:00","name":"Guns open","text":"Marye's battery opens from Herr Ridge while Archer's brigade halts on the pike.","steps":["P15","P16"],"sources":["S04","S13"],"battle":"GETT-D1-AM"},{"id":"GE04","start":"1863-07-01T09:00","end":"1863-07-01T09:30","at":"1863-07-01T09:30","name":"Heth deploys","text":"Archer forms south of the pike and Davis north of it. The spreadsheet says 09:30; Bachelder's map says 09:00.","steps":["P17","P20"],"sources":["S04","S05","S18"],"battle":"GETT-D1-AM"},{"id":"GE05","start":"1863-07-01T10:00","end":"1863-07-01T10:00","at":"1863-07-01T10:00","name":"Across the run","text":"Both Confederate brigades cross Willoughby Run.","steps":["P18","P24"],"sources":["S11","S12"],"battle":"GETT-D1-AM"},{"id":"GE06","start":"1863-07-01T10:15","end":"1863-07-01T10:15","at":"1863-07-01T10:15","name":"Infantry arrives","text":"Davis is in line against Cutler's brigade of the First Corps north of the pike, Meredith's brigade meets Archer at Willoughby Run, and the cavalry is relieved.","steps":["P37","P05","P42","P45"],"sources":["S18","S02"],"battle":"GETT-D1-AM"},{"id":"GE08","start":"1863-07-01T10:15","end":"1863-07-01T10:50","at":"1863-07-01T10:25","name":"Reynolds killed","text":"Reynolds is killed by a bullet as he sends the Iron Brigade into Herbst Woods, and Doubleday takes over the First Corps. No source read gives a firm time: it was moments after the brigade came up at about 10:15, and before the charge on the railroad cut; a modern timeline says 10:50.","steps":["P42"],"sources":["S16","S55"],"battle":"GETT-D1"},{"id":"GE07","start":"1863-07-01T10:30","end":"1863-07-01T12:00","at":"1863-07-01T10:30","name":"Railroad cut","text":"The 6th Wisconsin, 95th New York and 14th Brooklyn charge Davis's men in the unfinished railroad cut and take hundreds of prisoners. The map times the charge 10:30; the Army's campaign history has the fight there end about noon.","steps":["P47"],"sources":["S18","S55"],"battle":"GETT-D1"},{"id":"GE09","start":"1863-07-01T11:30","end":"1863-07-01T12:00","at":"1863-07-01T11:30","name":"Morning attack fails","text":"Heth's two brigades are driven back, Archer is a prisoner, and by about noon the firing dies down. The rest of the First Corps comes up.","steps":["P78","P56","P59"],"sources":["S16","S49","S55"],"battle":"GETT-D1"},{"id":"GE10","start":"1863-07-01T13:00","end":"1863-07-01T13:00","at":"1863-07-01T13:00","name":"Rodes on Oak Hill","text":"Rodes's division is in line on Oak Hill, north of the First Corps, as two divisions of the Eleventh Corps form north of the town.","steps":["P92","P94","P96","P53","P63"],"sources":["S18","S16"],"battle":"GETT-D1"},{"id":"GE11","start":"1863-07-01T14:30","end":"1863-07-01T14:30","at":"1863-07-01T14:30","name":"Rodes attacks","text":"O'Neal attacks Oak Ridge alone and is thrown back; Iverson follows without skirmishers and is shot down from behind a stone wall by Baxter's brigade, losing about 800 men.","steps":["P93","P95","P53"],"sources":["S16","S49","S55"],"battle":"GETT-D1"},{"id":"GE12","start":"1863-07-01T14:00","end":"1863-07-01T15:00","at":"1863-07-01T15:00","name":"Heth attacks again","text":"Pettigrew and Brockenbrough cross Willoughby Run against Meredith, Biddle and Stone. The sources give 14:00, 14:30 and 15:00; the map shows the Union line here until 15:00.","steps":["P82","P84","P42","P60"],"sources":["S49","S16","S18","S55"],"battle":"GETT-D1"},{"id":"GE13","start":"1863-07-01T15:00","end":"1863-07-01T15:30","at":"1863-07-01T15:05","name":"Early strikes","text":"Gordon's brigade hits the knoll on Rock Creek that anchors the Eleventh Corps's right. The map times Gordon's line 15:00; a modern timeline says 15:30.","steps":["P105","P69","P70"],"sources":["S18","S16","S55"],"battle":"GETT-D1"},{"id":"GE14","start":"1863-07-01T15:30","end":"1863-07-01T15:30","at":"1863-07-01T15:30","name":"McPherson Ridge lost","text":"Stone gives up the McPherson farm as Daniel and Davis close on it, and Doles drives in the Eleventh Corps's left.","steps":["P56","P101","P80","P99","P64"],"sources":["S18"],"battle":"GETT-D1"},{"id":"GE15","start":"1863-07-01T15:45","end":"1863-07-01T15:45","at":"1863-07-01T15:45","name":"North of town breaks","text":"Hays and Avery sweep past Coster's brigade at the brickyard and the Eleventh Corps falls back into the streets.","steps":["P107","P109","P75","P65"],"sources":["S18","S55"],"battle":"GETT-D1"},{"id":"GE16","start":"1863-07-01T16:00","end":"1863-07-01T16:00","at":"1863-07-01T16:00","name":"Seminary Ridge","text":"Pender's brigades attack the last First Corps line, behind a rail barricade at the seminary. About now Lee orders a general assault and Howard orders both corps back to Cemetery Hill.","steps":["P86","P88","P90","P43","P57","P61","P39"],"sources":["S18","S49","S55"],"battle":"GETT-D1"},{"id":"GE17","start":"1863-07-01T16:30","end":"1863-07-01T16:45","at":"1863-07-01T16:45","name":"Cemetery Hill","text":"The two corps rally on Cemetery Hill around Steinwehr's division as Hancock arrives and sends the First Corps to Culp's Hill. At 4:45 Lee tells Ewell to take the hill if practicable; Ewell does not attack.","steps":["P77","P41","P44","P66"],"sources":["S16","S49","S55"],"battle":"GETT-D1"},{"id":"GE19","start":"1863-07-01T17:00","end":"1863-07-01T17:00","at":"1863-07-01T17:00","name":"The town taken","text":"At about 17:00 men of Perrin's 1st South Carolina raise their flag in the town square. The Confederates hold Gettysburg.","steps":["P119"],"sources":["S55"],"battle":"GETT-D1"},{"id":"GE18","start":"1863-07-01T18:00","end":"1863-07-01T19:00","at":"1863-07-01T18:30","name":"The evening line","label":"Evening line","text":"The Union line runs from Culp's Hill, where Wadsworth's division digs in, over East Cemetery Hill and the cemetery to the head of Cemetery Ridge. Ewell does not attack the hill. Rodes holds the town, Early its eastern edge, Pender Seminary Ridge.","steps":["P121","P122","P123","P124","P125","P112","P117","P119"],"sources":["S53","S49","S50","S51","S52"],"battle":"GETT-D1"}],"sources":{"S01":{"title":"Report of Brig. Gen. John Buford, 1st Division, Cavalry Corps","author":"Buford","date":"1863-08-27","citation":"Official Records, ser. I, vol. 27, pt. 1","type":"Primary: official report","url":"https://ironbrigader.com/2015/06/22/general-john-bufords-report-cavalrys-action-gettysburg/2/","rights":"Public domain (US government publication, 1889)"},"S02":{"title":"Report of Col. William Gamble, 1st Brigade","author":"Gamble","date":"1863","citation":"Official Records, ser. I, vol. 27, pt. 1, p. 934","type":"Primary: official report","url":"https://civilwar.com/official-record/930-gettysburg-campaign-part-i/189556-934-series-i-volume-xxvii-i-serial-43-gettysburg-campaign-part-i.html","rights":"Public domain (US government publication, 1889)"},"S03":{"title":"Report of Col. Thomas C. Devin, 2nd Brigade","author":"Devin","date":"1863-08-06","citation":"Official Records, ser. I, vol. 27, pt. 1, pp. 938-939","type":"Primary: official report","url":"https://www.civilwar.com/official-record/930-gettysburg-campaign-part-i/189560-938-series-i-volume-xxvii-i-serial-43-gettysburg-campaign-part-i.html","rights":"Public domain (US government publication, 1889)"},"S04":{"title":"Report of Maj. Gen. Henry Heth","author":"Heth","date":"1863-09-13","citation":"Official Records, ser. I, vol. 27, pt. 2, p. 637 ff.","type":"Primary: official report","url":"https://www.nps.gov/gett/learn/historyculture/official-report-of-maj-general-henry-heth.htm","rights":"Public domain (US government publication, 1889)"},"S05":{"title":"Reports of Brig. Gen. Joseph R. Davis","author":"Davis","date":"1863-08-26","citation":"Official Records, ser. I, vol. 27, pt. 2, pp. 648-650","type":"Primary: official r
