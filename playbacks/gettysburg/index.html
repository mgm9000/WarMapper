html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* header */
.bar{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ttl{min-width:0;flex:1 1 220px}
.ttl h1{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;margin:0;text-wrap:balance}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.clock{text-align:right;flex:0 0 auto}
.clock .t{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .d{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* stage */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px}
.mapwrap{position:relative;overflow:hidden;background:var(--m-paper);touch-action:none;cursor:grab;min-height:0;user-select:none;-webkit-user-select:none}
.mapwrap.drag{cursor:grabbing}
#mapimg,#mapwide{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;filter:var(--map-filter);-webkit-user-drag:none;pointer-events:none}
#oldmaps{position:absolute;inset:0;pointer-events:none}
.mapwrap.fade #oldmaps{opacity:.5}
#base,#ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#base{pointer-events:none}
.mapwrap.mod{background:var(--bg)}
#base .land{fill:var(--land)} #base .wood{fill:var(--wood)} #base .lake{fill:var(--water)}
#base path.ln{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#base .strm{stroke:var(--water)} #base .edge{stroke:var(--road-edge)} #base .rd{stroke:var(--road)} #base .rdM{stroke:var(--road-major)}
#base .rail{stroke:var(--rail);stroke-dasharray:7 4;stroke-linecap:butt}
#base .far .min{display:none}
.sl{font-size:11px;fill:var(--map-text);stroke:var(--map-halo)!important;stroke-width:3px}
.sl.w{fill:var(--water-text);font-style:italic}
.sl .old{font-style:italic}
.al{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;fill:var(--map-text);stroke:var(--map-halo)!important;stroke-width:3px;opacity:.8}
.al.town{font-size:15px;letter-spacing:.04em;text-transform:none;opacity:.9}
.mapwrap.mod .lm{fill:var(--map-text);stroke:var(--map-halo)!important}
.mapwrap.mod .ulab,.mapwrap.mod .ech{fill:var(--map-ink);stroke:var(--map-halo)!important}
.mapwrap.mod .scale{color:var(--map-text);text-shadow:0 0 3px var(--map-halo),0 0 3px var(--map-halo)} .mapwrap.mod .scale i{border-color:var(--map-text)}
#ov text{font-family:var(--body);paint-order:stroke;stroke:var(--m-halo);stroke-linejoin:round}
#ov .u{cursor:pointer}
.lm{font-size:11px;font-style:italic;fill:var(--m-ink);stroke-width:3px;opacity:.85}
.ulab{font-size:12.5px;font-weight:600;fill:var(--m-ink);stroke-width:3.5px}
.ech{font-size:9px;font-weight:700;fill:var(--m-ink);stroke-width:2.5px;letter-spacing:.06em}

.ctl{position:absolute;display:flex;gap:6px;z-index:3}
.ctl.c-l{top:10px;left:max(10px,env(safe-area-inset-left,0px));flex-wrap:wrap;max-width:calc(100% - 70px)}
.ctl.c-r{top:10px;right:max(10px,env(safe-area-inset-right,0px));flex-direction:column}
.chipbtn,.sq{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer}
.chipbtn{padding:6px 10px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chipbtn .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.chipbtn[aria-pressed="true"]{border-color:var(--accent)}
.chipbtn[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}
.sq{width:34px;height:34px;font-size:18px;line-height:1;display:grid;place-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg .sm{display:none}
.credit{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:6px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:10.5px;color:var(--muted);max-width:70%}
.credit a{color:inherit}
.scale{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;z-index:3;font-size:11px;color:var(--m-ink);pointer-events:none;text-shadow:0 0 3px var(--m-halo),0 0 3px var(--m-halo)}
.scale i{display:block;height:6px;border:1.5px solid var(--m-ink);border-top:0;margin-top:2px}
.hint{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:34px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11.5px;color:var(--muted);pointer-events:none;max-width:60%}

/* panel */
.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;min-height:0;min-width:0;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.panel h2{font-family:var(--display);font-size:18px;font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
.panel h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 6px}
.panel p{margin:0 0 8px}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.phase{font-size:14.5px}
.ulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ulist button{width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:5px 6px;display:flex;gap:8px;align-items:baseline;cursor:pointer;min-width:0}
.ulist button:hover{background:var(--surface-2)}
.ulist .nm{font-weight:600;flex:none}
.ulist .ac{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:9px;height:9px;border-radius:2px;flex:none;align-self:center}
.sd.US{background:var(--us)} .sd.CS{background:var(--cs)}
.nd{color:var(--muted);font-size:12.5px;margin:0;padding-left:16px}
.nd li{margin-bottom:4px}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:12.5px;margin-bottom:10px}
.who{display:flex;gap:10px;align-items:flex-start}
.who .side{font-size:12px;font-weight:600}
.who .side.US{color:var(--us)} .who .side.CS{color:var(--cs)}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.state{margin:12px 0 0;padding:9px 11px;border-radius:6px;font-size:13px;border:1px solid var(--line);background:var(--surface-2)}
.state b{display:block;font-size:13px}
.state.stated{border-color:var(--good);background:var(--good-soft)}
.state.inferred{border-color:var(--warn);background:var(--warn-soft)}
.state.moving,.state.after,.state.unplaced{border-style:dashed;border-color:var(--muted)}
blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-family:var(--display);font-size:15px;line-height:1.4;border-radius:0 6px 6px 0}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.chip.high{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.chip.medium{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.na{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.srcs{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.srcs code,.rid{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
a{color:var(--accent)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--fg)}
details p{margin:8px 0 0}

/* timeline */
.tlbar{background:var(--surface);border-top:1px solid var(--line);padding-block:8px 10px;display:flex;gap:12px;align-items:center}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:grid;place-items:center}
.play svg{width:16px;height:16px;fill:currentColor}
.tl{flex:1;min-width:0;position:relative;height:54px}
.tl .win{position:absolute;top:22px;height:10px;background:var(--accent-soft);border:1px solid var(--line);border-radius:5px}
.tl .rail{position:absolute;left:0;right:0;top:22px;height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}
.tl .done{position:absolute;left:0;top:22px;height:10px;border-radius:5px 0 0 5px;background:var(--accent);opacity:.55}
.tl .tick{position:absolute;top:34px;width:1px;height:5px;background:var(--muted)}
.tl .tk{position:absolute;top:40px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .ev{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;font-weight:600;white-space:nowrap;color:var(--muted);background:none;border:0;padding:0 2px;cursor:pointer}
.tl .ev::after{content:"";position:absolute;left:50%;top:15px;width:1.5px;height:9px;background:var(--muted)}
.tl .ev.on{color:var(--fg)}
.tl input{position:absolute;left:-10px;width:calc(100% + 20px);top:14px;height:26px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.tl input::-webkit-slider-runnable-track{height:26px;background:transparent}
.tl input::-moz-range-track{height:26px;background:transparent}
.tl input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:26px;border-radius:5px;background:var(--fg);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tl input::-moz-range-thumb{width:16px;height:22px;border-radius:5px;background:var(--fg);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}

@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .ttl h1{font-size:16.5px} .ttl p{display:none} .clock .t{font-size:24px} .bar{padding-block:8px;gap:10px}
  .ttl{flex:1 1 150px}
  .hint{display:none}
  .tl .ev{font-size:0;width:14px;height:22px} .tl .ev::after{top:12px;height:12px;width:2px}
  .tl .tk.minor{display:none}
  .chipbtn,.seg button{padding:5px 8px;font-size:12px}
  .seg .lg{display:none} .seg .sm{display:inline}
  .chipbtn .long{display:none}
  .sq{width:32px;height:32px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

  B.wood.forEach(function(d){h+='<path class="wood" d="'+d+'"/>'});
  B.lake.forEach(function(d){h+='<path class="lake" d="'+d+'"/>'});
  B.water.forEach(function(w){h+='<path class="ln strm" d="'+w[1]+'" stroke-width="'+(w[0]==='r'?3.2:1.6)+'"/>'});
  B.rail.forEach(function(d){h+='<path class="ln rail" d="'+d+'" stroke-width="1.6"/>'});
  B.road.forEach(function(r){var c=r[0],k=W[c],mn=(c==='r'||c==='v')?' min':'';
    edge+='<path class="ln edge'+mn+'" d="'+r[1]+'" stroke-width="'+k[0]+'"/>';fill+='<path class="ln '+(c==='m'||c==='p'?'rdM':'rd')+mn+'" d="'+r[1]+'" stroke-width="'+k[1]+'"/>'});
  baseg.innerHTML=h+edge+fill;})();
function setBase(b){base=b;var mod=b==='mod';$('bOld').setAttribute('aria-pressed',mod?'false':'true');$('bMod').setAttribute('aria-pressed',mod?'true':'false');
  $('oldmaps').hidden=mod;baseSvg.style.display=mod?'':'none';wrap.classList.toggle('mod',mod);$('bFade').hidden=mod;
  $('credit').innerHTML=mod?'Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors':'Bachelder, 1876 &middot; Boston Public Library';
  panelKey='';kick()}
function baseLabels(L){ // names on the current map: skipped where they would sit on a unit or on each other
  var z=size(),lvl=view.s>=0.42?1:0,h='';
  D.areas.forEach(function(l){ if(l.l>lvl) return; var q=S(l.p); if(q[0]<-60||q[1]<-20||q[0]>z.w+60||q[1]>z.h+20) return;
    if(l.k==='town'&&view.s>0.75) return;
    var tw=l.t.length*(l.k==='town'?8.6:8.2)/2,r=[q[0]-tw,q[1]-9,q[0]+tw,q[1]+7]; if(L.hit(r)) return; L.keep(r);
    h+='<text class="al'+(l.k==='town'?' town':'')+'" text-anchor="middle" x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'">'+esc(l.t)+'</text>'});
  D.labels.forEach(function(l){ if(l.l>lvl) return; var q=S(l.p); if(q[0]<-60||q[1]<-20||q[0]>z.w+60||q[1]>z.h+20) return;
    var tw=(l.t.length+(l.s?l.s.length+3:0))*5.7,ca=Math.abs(Math.cos(l.a*Math.PI/180)),sa=Math.abs(Math.sin(l.a*Math.PI/180)),bw=(tw*ca+13*sa)/2,bh=(tw*sa+13*ca)/2,r=[q[0]-bw,q[1]-bh,q[0]+bw,q[1]+bh];
    if(r[0]<2||r[1]<2||r[2]>z.w-2||r[3]>z.h-2||L.hit(r)) return; L.keep(r);
    h+='<text class="sl'+(l.k==='w'?' w':'')+'" text-anchor="middle" transform="translate('+q[0].toFixed(1)+' '+q[1].toFixed(1)+') rotate('+l.a+')" y="3.5">'+esc(l.t)+(l.s?' <tspan class="old">('+esc(l.s)+')</tspan>':'')+'</text>'});
  return h}
function draw(){
  clampView();
  var mod=base==='mod';
  if(mod){baseg.setAttribute('transform','translate('+view.x.toFixed(2)+' '+view.y.toFixed(2)+') scale('+view.s.toFixed(5)+')');baseg.setAttribute('class',view.s<0.24?'far':'')}
  else{ // the whole sheet at reduced detail, with the sharper image of the first morning's ground on top
    wide.style.transform='translate('+view.x.toFixed(2)+'px,'+view.y.toFixed(2)+'px) scale('+(view.s*D.w/D.wide.w).toFixed(5)+')';
    img.style.transform='translate('+(view.x+D.det.x*view.s).toFixed(2)+'px,'+(view.y+D.det.y*view.s).toFixed(2)+'px) scale('+view.s.toFixed(5)+')'}
  var sc=scene(),h='',L=layout(sc);
  LM.forEach(function(l){var p=D.landmarks[l[0]];if(!p||(mod&&l[3])||view.s<0.3)return;var q=S(p);if(mod)L.keep([q[0]-l[0].length*3.2,q[1]+l[2]-10,q[0]+l[0].length*3.2,q[1]+l[2]+4]);h+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2" fill="var(--m-ink)" opacity=".7"/><text class="lm" x="'+(q[0]+l[1]+(l[1]?0:0)).toFixed(1)+'" y="'+(q[1]+l[2]).toFixed(1)+'" text-anchor="'+(l[1]?'start':'middle')+'">'+l[0]+'</text>'});
  // lines first, selected last so it sits on top
  if(mod) h+=baseLabels(L);
  L.sort(function(a,b){return (a.o.tr.id===sel)-(b.o.tr.id===sel)});
  L.forEach(function(u){h+=unitSvg(u)});
  ov.innerHTML=h;
  // scale bar in yards, as on the 1876 sheet
  var mpp=D.mpp/view.s,opts=[100,250,500,1000,1760],pick=opts[0];opts.forEach(function(y){if(y*0.9144/mpp<=150)pick=y});
  $('scale').innerHTML=(pick===1760?'1 mile':pick+' yards')+'<i style="width:'+(pick*0.9144/mpp).toFixed(0)+'px"></i>';
  return sc;
}

/* ---------- panel ---------- */
function chip(v){var c=(v==='high'||v==='medium'||v==='low')?v:'na';return '<span class="chip '+c+'">'+esc(v||'n/a')+'</span>'}
function phase(){var p=null;EVENTS.forEach(function(e){if(t>=e[0])p=e});return p}
function srcList(ids){var out='';String(ids||'').split(';').forEach(function(id){id=id.trim();var s=D.sources[id];if(!s)return;
  out+='<li><code>'+id+'</code> '+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>':esc(s.title))+'</li>'});return out}
var KIND={stated:['Placed by a source','A report, tablet or the 1876 map puts the unit here.'],inferred:['Inferred position','Worked out from the sequence of events, not stated by a source.'],
  moving:['Moving: interpolated','No source records this stretch. The unit is drawn on a straight line between two recorded positions.'],
  after:['Last recorded position','The data has nothing later for this unit.'],unplaced:['No position recorded','The sources read so far do not say where the unit was at this time.'],offmap:['Off this map','']};
function rowHtml(k,head){
  var osm=(k.lat!==null&&k.lat!==''&&k.lat!==undefined)?'https://www.openstreetmap.org/?mlat='+k.lat+'&mlon='+k.lon+'#map=16/'+k.lat+'/'+k.lon:'';
  var h='<h3>'+esc(head)+' <span class="rid">row '+k.id+'</span></h3>';
  h+='<p><b>'+esc(k.act)+'.</b> '+esc(k.place)+'</p>';
  if(k.say) h+='<blockquote>'+esc(k.say)+'</blockquote>';
  h+='<h3>How sure</h3><dl><dt>Time</dt><dd>'+esc(k.ts)+(k.te&&k.te!==k.ts?' to '+esc(k.te):'')+' <span class="meta">('+esc(k.tb)+')</span></dd>';
  h+='<dt>Location</dt><dd>'+chip(k.cc)+' '+esc(k.cb)+'</dd><dt>Overall</dt><dd>'+chip(k.oc)+'</dd><dt>Review</dt><dd>'+esc(k.status)+'</dd></dl>';
  if(k.notes) h+='<h3>Notes</h3><p>'+esc(k.notes)+'</p>';
  var sl=srcList(k.src); if(sl) h+='<h3>Sources</h3><ul class="srcs">'+sl+'</ul>';
  if(osm) h+='<p style="margin-top:10px"><a href="'+osm+'" target="_blank" rel="noopener">Open this spot on a modern map</a></p>';
  return h;
}
function about(){return '<details><summary>About this prototype</summary>'+
 '<p>Unit positions come from the data pilot spreadsheet (38 rows) built from the Official Records, War Department tablets and Bachelder\'s map. Nothing here has been checked by a historian.</p>'+
 '<p>Solid symbols are positions a source gives. Dashed symbols are interpolated, inferred or the last position on record. A question mark means the location is a loose estimate.</p>'+
 '<p>Base map: John B. Bachelder, <i>Map of the battle field of Gettysburg: First day\'s battle</i> (1876), Boston Public Library copy. The whole sheet is shown; the ground of the first morning, west and north-west of the town, is drawn at twice the detail of the rest. Its printed red and blue bars show the whole day; the labelled symbols on top are this playback.</p>'+
 '<p>Current map: today\'s roads, streams, woods and names from OpenStreetMap, drawn in the frame of the 1876 sheet. It is turned about 1&deg; from true north, and at the three buildings used to fit the sheet the two maps differ by 15 to 18 metres. Road names are today\'s; the 1863 name follows in brackets where it differs. Satellite and terrain views are not in this prototype.</p></details>'}
var panelKey='';
function renderPanel(sc,force){
  var key=sel?sel+'|'+(function(){var o=sc.filter(function(o){return o.tr.id===sel})[0];return o?o.s.k.id+o.s.kind:'x'})():'now|'+((phase()||[0])[0])+'|'+sc.map(function(o){return o.tr.id+(o.drawn?1:0)+o.s.kind+o.s.k.id}).join(',');
  if(key===panelKey&&!force) return; panelKey=key; var h='';
  if(sel){
    var tr=byId(sel),o=sc.filter(function(o){return o.tr.id===sel})[0];
    h+='<button class="back" id="back">&larr; All units</button><div class="who"><div><div class="side '+tr.side+'">'+(tr.side==='US'?'Union':'Confederate')+'</div><h2>'+esc(tr.name)+'</h2>';
    h+='<div class="meta">'+[tr.cmd,tr.str].filter(Boolean).map(esc).join(' &middot; ')+'</div></div></div>';
    if(!o){h+='<div class="state unplaced"><b>Not in the data at '+fmt(t)+'</b>Move the time to see this unit.</div>'}
    else{var K=KIND[o.s.kind];
      h+='<div class="state '+o.s.kind+'"><b>'+K[0]+'</b>'+(o.s.kind==='offmap'?esc(tr.offmap):K[1])+'</div>';
      if(o.s.kind==='moving'){h+=rowHtml(o.s.k,'Heading to');h+=rowHtml(o.s.from,'Coming from')}
      else h+=rowHtml(o.s.k,o.s.kind==='after'?'Last record':'Current record');}
  } else {
    var p=phase(); h+='<div class="eyebrow">'+(p?'Now: '+esc(p[1]):'Before 7:30')+'</div><p class="phase">'+esc(p?p[2]:BEFORE)+'</p>';
    ['US','CS'].forEach(function(side){var L=sc.filter(function(o){return o.tr.side===side&&o.drawn});if(!L.length)return;
      h+='<h3>'+(side==='US'?'Union':'Confederate')+' on the map</h3><ul class="ulist">';
      L.forEach(function(o){h+='<li><button data-pick="'+o.tr.id+'"><span class="sd '+side+'"></span><span class="nm">'+esc(o.tr.label)+'</span><span class="ac">'+esc(o.s.kind==='moving'?'Moving (interpolated)':o.s.kind==='after'?'Last recorded position':o.s.k.act)+'</span></button></li>'});h+='</ul>'});
    var nd=sc.filter(function(o){return !o.drawn&&!o.hidden||o.s.kind==='unplaced'});
    if(nd.length){h+='<h3>Not placed right now</h3><ul class="nd">';nd.forEach(function(o){h+='<li><b>'+esc(o.tr.label)+'</b>: '+esc(o.s.kind==='offmap'?o.tr.offmap:o.s.k.act+'. '+(o.s.k.g?'':'No position on record.'))+'</li>'});h+='</ul>'}
    h+='<p class="meta" style="margin-top:14px">Tap a unit for its source and how sure the position is.</p>'+about();
  }
  panel.innerHTML=h; if(sel) panel.scrollTop=0;
}

/* ---------- time ---------- */
function setTime(v,fromRange){t=Math.max(T0,Math.min(T1,v));if(!fromRange)range.value=t;$('clock').textContent=fmt(t);
  $('done').style.width=((t-T0)/(T1-T0)*100)+'%';
  var p=phase();Array.prototype.forEach.call(document.querySelectorAll('.tl .ev'),function(e){e.classList.toggle('on',p&&+e.dataset.t===p[0])});
  kick()}
function frame(ts){raf=0;var more=false;
  if(playing){var dt=lastTs?Math.min(0.1,(ts-lastTs)/1000):0;lastTs=ts;var nt=t+dt*3;if(nt>=T1){nt=T1;setPlaying(false)}t=nt;range.value=t;$('clock').textContent=fmt(t);$('done').style.width=((t-T0)/(T1-T0)*100)+'%';
    var p=phase();Array.prototype.forEach.call(document.querySelectorAll('.tl .ev'),function(e){e.classList.toggle('on',p&&+e.dataset.t===p[0])});more=playing}
  if(chase()) more=true;
  renderPanel(draw());
  if(more) raf=requestAnimationFrame(frame);}
function kick(){if(!raf)raf=requestAnimationFrame(frame)}
function setPlaying(v){playing=v;lastTs=0;$('play').setAttribute('aria-label',v?'Pause':'Play');
  $('playico').innerHTML=v?'<path d="M3 1.5h3.5v13H3zM9.5 1.5H13v13H9.5z"/>':'<path d="M3 1.5v13l11-6.5z"/>';
  if(v){if(t>=T1-0.01)setTime(T0);kick()}}

/* ---------- timeline furniture ---------- */
(function(){var tl=$('tl'),pc=function(m){return ((m-T0)/(T1-T0)*100)+'%'},h='';
  $('win').style.left=pc(WIN0);$('win').style.width=((WIN1-WIN0)/(T1-T0)*100)+'%';
  for(var m=450;m<=630;m+=15){h+='<span class="tick" style="left:'+pc(m)+'"></span>';if(m%30===0)h+='<span class="tk'+(m%60?' minor':'')+'" style="left:'+pc(m)+'">'+fmt(m).replace(' a.m.','')+'</span>'}
  EVENTS.forEach(function(e){h+='<button class="ev" data-t="'+e[0]+'" style="left:'+pc(e[0])+'" title="'+esc(fmt(e[0])+': '+e[1])+'">'+esc(e[1])+'</button>'});
  tl.insertAdjacentHTML('afterbegin',h);
  tl.addEventListener('click',function(ev){var b=ev.target.closest('.ev');if(b){setPlaying(false);setTime(+b.dataset.t)}});
})();

/* ---------- input ---------- */
range.addEventListener('input',function(){setPlaying(false);setTime(+range.value,true)});
$('play').addEventListener('click',function(){setPlaying(!playing)});
$('bFollow').addEventListener('click',function(){setFollow(!follow)});
$('bReg').addEventListener('click',function(){regOn=!regOn;this.setAttribute('aria-pressed',regOn?'true':'false');kick()});
$('bOld').addEventListener('click',function(){setBase('old')});
$('bMod').addEventListener('click',function(){setBase('mod')});
$('bFade').addEventListener('click',function(){var on=wrap.classList.toggle('fade');this.setAttribute('aria-pressed',on?'true':'false')});
$('zin').addEventListener('click',function(){var z=size();setFollow(false);zoomAt(1.4,z.w/2,z.h/2);kick()});
$('zout').addEventListener('click',function(){var z=size();setFollow(false);zoomAt(1/1.4,z.w/2,z.h/2);kick()});
/* Over the map, scrolling or pinching zooms. Over the timeline bar, scrolling moves time. */
function wheelY(e){return e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?400:1)}
wrap.addEventListener('wheel',function(e){e.preventDefault();var r=wrap.getBoundingClientRect(),dy=wheelY(e),a=Math.abs(dy),pinch=e.ctrlKey||e.metaKey;
  setFollow(false);zoomAt(Math.exp(-dy*(pinch?(a<40?0.01:0.002):(a<40?0.006:0.003))),e.clientX-r.left,e.clientY-r.top);kick()},{passive:false});
document.querySelector('.tlbar').addEventListener('wheel',function(e){e.preventDefault();var dy=wheelY(e),dd=Math.abs(e.deltaX)>Math.abs(dy)?e.deltaX:dy;
  setPlaying(false);setTime(t+dd*0.035)},{passive:false});
var ptrs={},pn=0,downId=null,moved=false,pinch0=0;
function pts2(){var a=Object.keys(ptrs).map(function(k){return ptrs[k]});return a}
wrap.addEventListener('pointerdown',function(e){if(e.target.closest('.ctl')||e.target.closest('.credit'))return;var u=e.target.closest('[data-id]');
  if(pn===0){downId=u?u.getAttribute('data-id'):null;moved=false}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};pn=Object.keys(ptrs).length;try{wrap.setPointerCapture(e.pointerId)}catch(_){ }
  if(pn===2){var a=pts2();pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);moved=true}
  wrap.classList.add('drag')});
wrap.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(pn===1){if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;if(follow)setFollow(false);view.x+=dx;view.y+=dy;p.x=e.clientX;p.y=e.clientY;kick()}
  else if(pn===2){p.x=e.clientX;p.y=e.clientY;var a=pts2(),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=wrap.getBoundingClientRect();
    if(pinch0>0){if(follow)setFollow(false);zoomAt(d/pinch0,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top);view.x+=dx/2;view.y+=dy/2;kick()}pinch0=d}});
function up(e){if(!ptrs[e.pointerId])return;delete ptrs[e.pointerId];pn=Object.keys(ptrs).length;
  if(pn===0){wrap.classList.remove('drag');if(!moved){sel=downId;panelKey='';kick()}}}
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('dblclick',function(e){if(e.target.closest('.ctl'))return;var r=wrap.getBoundingClientRect();setFollow(false);zoomAt(1.6,e.clientX-r.left,e.clientY-r.top);kick()});
panel.addEventListener('click',function(e){var b=e.target.closest('[data-pick]');if(b){sel=b.getAttribute('data-pick');panelKey='';kick();return}
  if(e.target.id==='back'){sel=null;panelKey='';kick()}});
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.tagName==='SUMMARY')return;
  if(e.key==='ArrowRight'){setPlaying(false);setTime(t+1);e.preventDefault()} else if(e.key==='ArrowLeft'){setPlaying(false);setTime(t-1);e.preventDefault()}
  else if(e.key===' '){setPlaying(!playing);e.preventDefault()} else if(e.key==='Escape'){sel=null;panelKey='';kick()} else if(e.key==='m'||e.key==='M'){setBase(base==='mod'?'old':'mod')}});
if(window.ResizeObserver) new ResizeObserver(function(){if(follow){view=fitBox(actionBox(),size().w<520?46:70)}kick()}).observe(wrap);
if(matchMedia('(pointer:coarse)').matches) $('hint').hidden=true;

/* ---------- start ---------- */
img.width=D.det.w;img.height=D.det.h;wide.width=D.wide.w;wide.height=D.wide.h;
view=fitBox(actionBox(),size().w<520?46:70);
setBase('old');
setTime(T0);
window.__gb={setTime:setTime,get view(){return view},select:function(id){sel=id;panelKey='';kick()},setFollow:setFollow,setBase:setBase,get base(){return base}};
})();
</script>
</body></html>
