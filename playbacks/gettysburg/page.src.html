:root{ --us:#1d5c9e; --cs:#b5382a; --m-us:#124f93; --m-us-fill:#e3eefb; --m-cs:#b02a1c; --m-cs-fill:#fde6e1; }

<div class="app">
  <header class="bar gut">
    <div class="ttl">
      <h1>Gettysburg, the first morning</h1>

    </div>
  </header>

  <main class="stage">
    <div class="mapwrap" id="mapwrap" tabindex="0" aria-label="Battle map. Scroll or pinch to zoom, drag to pan. To move time, scroll over the timeline or use the arrow keys.">

      <div class="ctl c-l">
        <div class="seg" role="group" aria-label="Base map">
          <button id="bOld" aria-pressed="true" title="Bachelder's 1876 map of the first day (M switches maps)"><span class="lg">1876 map</span><span class="sm">1876</span></button>
          <button id="bMod" aria-pressed="false" title="The same ground today, from OpenStreetMap (M switches maps)"><span class="lg">Current map</span><span class="sm">Today</span></button>
        </div>
        <button class="chipbtn" id="bFollow" aria-pressed="true"><span class="dot"></span><span>Follow<span class="long"> the action</span></span></button>
        <button class="chipbtn" id="bReg" aria-pressed="true"><span class="dot"></span>Regiments</button>
        <button class="chipbtn" id="bFade" aria-pressed="false"><span class="dot"></span>Fade map</button>
      </div>
      <div class="ctl c-r">
        <button class="sq" id="zin" aria-label="Zoom in">+</button>
        <button class="sq" id="zout" aria-label="Zoom out">&minus;</button>

      <div class="scale" id="scale"></div>
      <div class="hint" id="hint">Scroll or pinch to zoom &middot; drag to pan &middot; scroll over the timeline to move time</div>
      <div class="credit" id="credit"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="tlbar gut">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 16 16" id="playico"><path d="M3 1.5v13l11-6.5z"/></svg></button>
    <div class="tl" id="tl">
      <div class="rail"></div><div class="win" id="win"></div><div class="done" id="done"></div>
      <input type="range" id="time" min="435" max="630" step="0.25" value="435" aria-label="Time of day">
    </div>
  </footer>
</div>

<script>
/* Gettysburg, the first morning. The shared core (core.js) runs the map, the clock and the controls; this script holds what is particular to this battle:
   its events, where each unit is at a given time, how units are laid out and drawn, and the side panel. */
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var $=WM.$,esc=WM.esc,fmt=WM.fmtClock,lerpG=WM.lerpG,chip=WM.chip;
var T0=435,T1=630,WIN0=450,WIN1=615;
var EVENTS=[
 [450,'First shot',"A picket of the 8th Illinois Cavalry fires on the head of Archer's column on the Chambersburg Pike at Knoxlyn Road."],
 [480,'Buford forms',"Gamble and Devin form line of battle and Calef's guns go into battery on the pike."],
 [540,'Guns open',"Marye's battery opens from Herr Ridge while Archer's brigade halts on the pike."],
 [570,'Heth deploys',"Archer forms south of the pike and Davis north of it. The spreadsheet says 9:30; Bachelder's map says 9 a.m."],
 [600,'Across the run',"Both Confederate brigades cross Willoughby Run."],
 [615,'Infantry arrives',"Davis is in line against Cutler's brigade of the First Corps, and the cavalry is relieved."]
];
var BEFORE="Before the first shot. Gamble's brigade is in camp at the seminary and Calef's battery is on the pike.";
var wrap=$('mapwrap'),ov=$('ov'),panel=$('panel');
var base='old'; // 'old' = the 1876 sheet, 'mod' = today's map; both sit on the same ground, so the view carries over
var t=T0,sel=null,follow=true,regOn=true,faded=false,sNow=0.3;
var LOD=0.36; // screen px per frame unit above which regiments replace brigades
function byId(id){for(var i=0;i<D.tracks.length;i++)if(D.tracks[i].id===id)return D.tracks[i]}

/* The data is in the frame of the 1876 sheet (one unit is about 1.5 m). This turns a frame point into longitude and latitude:
   frame -> scan pixel -> metres east and north of the fit's origin -> degrees. */
var F=D.frame;
function toLL(p){var x=p[0]/F.SC+F.X0,y=p[1]/F.SC+F.Y0,e=F.a*x-F.b*y+F.tx,n=-F.a*y-F.b*x+F.ty;return [F.LON0+e/F.MLON,F.LAT0+n/F.MLAT]}

/* ---------- where is a unit at time t ---------- */
function stateAt(tr,tt){
  var ks=tr.k,n=ks.length; if(tt<ks[0].t0) return null;
  if(tr.offmap) return (tt<=ks[n-1].t1)?{k:ks[0],g:null,kind:'offmap'}:null;
  for(var i=0;i<n;i++){
    var k=ks[i],nx=ks[i+1],end=k.t1; if(i===n-1&&tr.hold) end=Math.max(end,tr.hold);
    if(tt>=k.t0&&tt<=end){
      if(!k.g){var pg=null;for(var j=i-1;j>=0;j--)if(ks[j].g){pg=ks[j].g;break} return {k:k,g:pg,kind:'unplaced'}}
      if(nx&&nx.g&&nx.t0-end<0.01){var M=Math.min(4,(end-k.t0)/2); if(M>0&&tt>end-M) return {k:nx,from:k,g:lerpG(k.g,nx.g,(tt-(end-M))/M),kind:'moving'}}
      return {k:k,g:k.g,kind:k.method==='inferred'?'inferred':'stated'};
    }
    if(nx&&tt>end&&tt<nx.t0){
      if(k.g&&nx.g) return {k:nx,from:k,g:lerpG(k.g,nx.g,(tt-end)/(nx.t0-end)),kind:'moving'};
      if(k.g) return {k:nx,g:k.g,kind:'unplaced'};
      return {k:k,g:null,kind:'unplaced'};
    }
  }
  if(tr.hideAfter) return null;
  var last=ks[n-1],g=last.g; if(!g) for(var q=n-2;q>=0;q--) if(ks[q].g){g=ks[q].g;break}
  return {k:last,g:g,kind:last.g?'after':'unplaced'};
}
function scene(){
  var st={},showKids=regOn&&sNow>=LOD,hide={};
  D.tracks.forEach(function(tr){st[tr.id]=stateAt(tr,t)});
  D.tracks.forEach(function(tr){ if(tr.parent){ if(!showKids||!st[tr.id]||!st[tr.id].g) hide[tr.id]=1; else hide[tr.parent]=1; } });
  var out=[];
  D.tracks.forEach(function(tr){var s=st[tr.id]; if(s) out.push({tr:tr,s:s,drawn:!!s.g&&!hide[tr.id],hidden:!!hide[tr.id]})});
  return out;
}

/* ---------- view ---------- */
function actionBox(){var b=[1e9,1e9,-1e9,-1e9],any=false;
  D.tracks.forEach(function(tr){if(tr.parent||tr.loose)return;var s=stateAt(tr,t);if(!s||!s.g)return;any=true;s.g.forEach(function(p){b[0]=Math.min(b[0],p[0]);b[1]=Math.min(b[1],p[1]);b[2]=Math.max(b[2],p[0]);b[3]=Math.max(b[3],p[1])})});
  if(!any) return [0,0,D.w,D.h];
  var mx=Math.max(90,(900-(b[2]-b[0]))/2),my=Math.max(90,(600-(b[3]-b[1]))/2);
  return [b[0]-mx,b[1]-my,b[2]+mx,b[3]+my]}
function target(){var n=mv.size().w<520?42:64;return mv.cameraFor(actionBox(),{t:n,b:n,l:n,r:n},1.6)}
function setFollow(v){follow=v;$('bFollow').setAttribute('aria-pressed',v?'true':'false');if(v)mv.kick()}

/* ---------- drawing ---------- */
var S; // frame point -> screen point, set once the map exists
var ECH={division:'XX',brigade:'X',regiment:'III',battalion:'II',battery:'I',company:'I',section:'••',squadrons:'••'};
function layout(sc){
  // pass 1: screen geometry and symbol position for every drawn unit
  var L=[];
  sc.forEach(function(o){ if(!o.drawn) return; var tr=o.tr,pts=o.s.g.map(S),len=WM.plen(pts);
    var c=WM.along(pts,0.5).p,nx=tr.nudge?tr.nudge[0]:0,ny=tr.nudge?tr.nudge[1]:0,x=c[0]+nx,y=c[1]+ny;
    if(len>7){var a=pts[0],b=pts[pts.length-1],vx=b[0]-a[0],vy=b[1]-a[1],LL=Math.hypot(vx,vy)||1,px=-vy/LL,py=vx/LL;if(px<0){px=-px;py=-py}x+=px*20;y+=py*13}
    var low=(o.s.k.cc==='low'&&o.s.kind!=='moving'),txt=tr.label+(low?' ?':'');
    var pr=(tr.id===sel?0:tr.loose?4:tr.parent?3:tr.branch==='art'?2:1);
    L.push({o:o,pts:pts,len:len,c:c,x:x,y:y,low:low,txt:txt,w:txt.length*7.1+6,pr:pr,nudged:!!(nx||ny)})});
  var R=[]; function hit(r){for(var i=0;i<R.length;i++){var q=R[i];if(r[0]<q[2]&&r[2]>q[0]&&r[1]<q[3]&&r[3]>q[1])return true}return false}
  var Z=mv.size();
  L.forEach(function(u){R.push([u.x-14,u.y-19,u.x+14,u.y+10]);
    for(var i=1;i<u.pts.length&&u.len>7;i++){var a=u.pts[i-1],b=u.pts[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(d/11));
      for(var j=0;j<=n;j++){var qx=a[0]+(b[0]-a[0])*j/n,qy=a[1]+(b[1]-a[1])*j/n;R.push([qx-4,qy-4,qx+4,qy+4])}}});
  // pass 2: labels, most important units first; a crowded low-priority label is dropped (the unit stays tappable)
  L.slice().sort(function(a,b){return a.pr-b.pr}).forEach(function(u){
    var x=u.x,y=u.y,w=u.w,C=[[x+16,y-8,x+16+w,y+8,'start',x+17,y+4.5],[x-16-w,y-8,x-16,y+8,'end',x-17,y+4.5],[x-w/2,y+11,x+w/2,y+26,'middle',x,y+23],[x-w/2,y-35,x+w/2,y-20,'middle',x,y-23]];
    u.lab=null; for(var i=0;i<C.length;i++){ if(C[i][0]>=3&&C[i][2]<=Z.w-3&&!hit(C[i])){u.lab=C[i];break} }
    if(!u.lab&&(u.pr===0||(u.pr<=2&&sNow>=0.3))) u.lab=C[0]; // zoomed right out, a crowded label is dropped rather than forced
    if(u.lab) R.push(u.lab) });
  L.hit=hit; L.keep=function(r){R.push(r)};
  return L;
}
function unitSvg(u){
  var o=u.o,tr=o.tr,s=o.s,pts=u.pts,len=u.len,col=tr.side==='US'?'var(--m-us)':'var(--m-cs)',fill=tr.side==='US'?'var(--m-us-fill)':'var(--m-cs-fill)';
  var soft=(s.kind==='moving'||s.kind==='after'||s.kind==='unplaced'),low=u.low;
  var op=(s.kind==='after'||s.kind==='unplaced')?0.5:1, isSel=sel===tr.id, h='',x=u.x,y=u.y,c=u.c;
  h+='<g opacity="'+op+'">';
  if(len>7){var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(''),w=tr.parent?4.5:6;
    var dash=tr.loose?' stroke-dasharray="2 5" stroke-linecap="round"':(soft?' stroke-dasharray="7 5"':'');
    if(isSel) h+='<path d="'+d+'" fill="none" stroke="var(--m-sel)" stroke-width="'+(w+9)+'" stroke-linecap="round" opacity=".75"/>';
    h+='<path d="'+d+'" fill="none" stroke="var(--u-halo)" stroke-width="'+(w+4)+'"/>';
    h+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'"'+dash+'/>';
    mv.hits.push({id:tr.id,pts:pts,tol:w/2+4});}
  if(u.nudged) h+='<line x1="'+c[0].toFixed(1)+'" y1="'+c[1].toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--u-ink)" stroke-width="1"/><circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="2.5" fill="'+col+'"/>';
  h+='<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+')">';
  if(isSel) h+='<rect x="-18" y="-14" width="36" height="28" rx="4" fill="none" stroke="var(--m-sel)" stroke-width="4"/>';
  h+='<rect x="-13" y="-9" width="26" height="18" fill="'+fill+'" stroke="'+col+'" stroke-width="1.8"'+((soft||low)?' stroke-dasharray="3 2.5"':'')+'/>';
  if(tr.branch==='inf') h+='<path d="M-13 -9L13 9M-13 9L13 -9" stroke="'+col+'" stroke-width="1.4"/>';
  else if(tr.branch==='cav') h+='<path d="M-13 9L13 -9" stroke="'+col+'" stroke-width="1.4"/>';
  else h+='<circle r="3.4" fill="'+col+'"/>';
  h+='<text class="ech" text-anchor="middle" y="-12">'+(ECH[tr.ech]||'')+'</text></g>';
  mv.hits.push({id:tr.id,r:[x-17,y-20,x+17,y+13]});
  if(u.lab){h+='<text class="ulab" text-anchor="'+u.lab[4]+'" x="'+u.lab[5].toFixed(1)+'" y="'+u.lab[6].toFixed(1)+'">'+esc(u.txt)+'</text>';
    mv.hits.push({id:tr.id,r:[u.lab[0],u.lab[1],u.lab[0]+u.w,u.lab[1]+16]})}
  h+='</g>'; return h;
}
var LM=[['Herr Tavern',0,-12],['Lutheran Seminary',0,16],['Willoughby Run',8,0,1],['Chambersburg Pike',0,-10,1],['McPherson farm',0,16],['Pennsylvania College',0,16]]; // 4th value: only on the 1876 map (the current map labels these itself)

function baseLabels(L){ // names on the current map: skipped where they would sit on a unit or on each other
  var z=mv.size(),lvl=sNow>=0.42?1:0,h='';
  D.areas.forEach(function(l){ if(l.l>lvl) return; var q=S(l.p); if(q[0]<-60||q[1]<-20||q[0]>z.w+60||q[1]>z.h+20) return;
    if(l.k==='town'&&sNow>0.75) return;
    var tw=l.t.length*(l.k==='town'?8.6:8.2)/2,r=[q[0]-tw,q[1]-9,q[0]+tw,q[1]+7]; if(L.hit(r)) return; L.keep(r);
    h+='<text class="al'+(l.k==='town'?' town':'')+'" text-anchor="middle" x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'">'+esc(l.t)+'</text>'});
  D.labels.forEach(function(l){ if(l.l>lvl) return; var q=S(l.p); if(q[0]<-60||q[1]<-20||q[0]>z.w+60||q[1]>z.h+20) return;
    var tw=(l.t.length+(l.s?l.s.length+3:0))*5.7,ca=Math.abs(Math.cos(l.a*Math.PI/180)),sa=Math.abs(Math.sin(l.a*Math.PI/180)),bw=(tw*ca+13*sa)/2,bh=(tw*sa+13*ca)/2,r=[q[0]-bw,q[1]-bh,q[0]+bw,q[1]+bh];
    if(r[0]<2||r[1]<2||r[2]>z.w-2||r[3]>z.h-2||L.hit(r)) return; L.keep(r);
    h+='<text class="sl'+(l.k==='w'?' w':'')+'" text-anchor="middle" transform="translate('+q[0].toFixed(1)+' '+q[1].toFixed(1)+') rotate('+l.a+')" y="3.5">'+esc(l.t)+(l.s?' <tspan class="old">('+esc(l.s)+')</tspan>':'')+'</text>'});
  return h}
function draw(){
  sNow=mv.scale(); mv.hits.length=0;
  var mod=base==='mod',sc=scene(),h='',L=layout(sc);
  LM.forEach(function(l){var p=D.landmarks[l[0]];if(!p||(mod&&l[3])||sNow<0.3)return;var q=S(p);if(mod)L.keep([q[0]-l[0].length*3.2,q[1]+l[2]-10,q[0]+l[0].length*3.2,q[1]+l[2]+4]);h+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2" fill="var(--u-ink)" opacity=".7"/><text class="lm" x="'+(q[0]+l[1]).toFixed(1)+'" y="'+(q[1]+l[2]).toFixed(1)+'" text-anchor="'+(l[1]?'start':'middle')+'">'+l[0]+'</text>'});
  if(mod) h+=baseLabels(L);

  L.sort(function(a,b){return (a.o.tr.id===sel)-(b.o.tr.id===sel)});
  L.forEach(function(u){h+=unitSvg(u)});
  ov.innerHTML=h;

  renderPanel(sc);

/* ---------- the two base maps ---------- */
var MOD=['b-wood','b-lake','b-water','b-rail','b-edge-minor','b-edge','b-road-minor','b-road','b-mask'],OLD=['old-wide','old-det'];
function buildBase(){
  var B=D.base,f=[],W={m:[5,3.6],p:[4.4,3],s:[3.8,2.5],t:[3.2,2],u:[2.8,1.7],r:[2.3,1.3],v:[1.5,0.8]};
  B.wood.forEach(function(d){f.push(mv.poly(d,{k:'wood'}))});
  B.lake.forEach(function(d){f.push(mv.poly(d,{k:'lake'}))});
  B.water.forEach(function(w){f.push(mv.line(w[1],{k:'water',c:w[0]}))});
  B.rail.forEach(function(d){f.push(mv.line(d,{k:'rail'}))});
  B.road.forEach(function(r){f.push(mv.line(r[1],{k:'road',c:r[0],e:W[r[0]][0],w:W[r[0]][1],minor:(r[0]==='r'||r[0]==='v')?1:0}))});
  // everything outside the sheet is covered, so the current map ends where the 1876 map does
  var o=[[-9*D.w,-9*D.h],[10*D.w,-9*D.h],[10*D.w,10*D.h],[-9*D.w,10*D.h],[-9*D.w,-9*D.h]].map(toLL),inn=[[0,0],[0,D.h],[D.w,D.h],[D.w,0],[0,0]].map(toLL);

  mv.geo('base',f);
  var is=function(k){return ['==',['get','k'],k]},round={'line-cap':'round','line-join':'round'},far=mv.zoomFor(0.24);
  mv.layer({id:'b-wood',type:'fill',source:'base',filter:is('wood'),paint:{'fill-color':'var(--wood)'}});
  mv.layer({id:'b-lake',type:'fill',source:'base',filter:is('lake'),paint:{'fill-color':'var(--water)'}});
  mv.layer({id:'b-water',type:'line',source:'base',filter:is('water'),layout:round,paint:{'line-color':'var(--water)','line-width':['match',['get','c'],'r',3.2,1.6]}});
  mv.layer({id:'b-rail',type:'line',source:'base',filter:is('rail'),paint:{'line-color':'var(--rail)','line-width':1.6,'line-dasharray':[4.4,2.5]}});
  // side streets and service roads are left out when zoomed right out
  mv.layer({id:'b-edge-minor',type:'line',source:'base',minzoom:far,filter:['all',is('road'),['==',['get','minor'],1]],layout:round,paint:{'line-color':'var(--road-edge)','line-width':['get','e']}});
  mv.layer({id:'b-edge',type:'line',source:'base',filter:['all',is('road'),['==',['get','minor'],0]],layout:round,paint:{'line-color':'var(--road-edge)','line-width':['get','e']}});
  mv.layer({id:'b-road-minor',type:'line',source:'base',minzoom:far,filter:['all',is('road'),['==',['get','minor'],1]],layout:round,paint:{'line-color':'var(--road)','line-width':['get','w']}});
  mv.layer({id:'b-road',type:'line',source:'base',filter:['all',is('road'),['==',['get','minor'],0]],layout:round,
    paint:{'line-color':function(c){return ['match',['get','c'],['m','p'],c('--road-major'),c('--road')]},'line-width':['get','w']}});
  mv.layer({id:'b-mask',type:'fill',source:'base',filter:is('mask'),paint:{'fill-color':'var(--bg)'}});

}
function paintFade(){mv.opacity('old-wide',faded?0.5:1);mv.opacity('old-det',faded?0:1)} // faded, only the whole-sheet picture is shown, so the two do not add up
function setBase(b){base=b;var mod=b==='mod';$('bOld').setAttribute('aria-pressed',mod?'false':'true');$('bMod').setAttribute('aria-pressed',mod?'true':'false');
  MOD.forEach(function(id){mv.show(id,mod)});OLD.forEach(function(id){mv.show(id,!mod)});
  wrap.classList.toggle('paper',!mod);mv.bg(mod?'--land':'--m-paper');$('bFade').hidden=mod;
  $('credit').innerHTML=mod?WM.OSM_CREDIT:'Bachelder, 1876 &middot; Boston Public Library';
  panelKey='';mv.retheme();mv.kick()}

/* ---------- panel ---------- */
function phase(){var p=null;EVENTS.forEach(function(e){if(t>=e[0])p=e});return p}
var KIND={stated:['Placed by a source','A report, tablet or the 1876 map puts the unit here.'],inferred:['Inferred position','Worked out from the sequence of events, not stated by a source.'],
  moving:['Moving: interpolated','No source records this stretch. The unit is drawn on a straight line between two recorded positions.'],
  after:['Last recorded position','The data has nothing later for this unit.'],unplaced:['No position recorded','The sources read so far do not say where the unit was at this time.'],offmap:['Off this map','']};
function rowHtml(k,head){
  var osm=(k.lat!==null&&k.lat!==''&&k.lat!==undefined)?'https://www.openstreetmap.org/?mlat='+k.lat+'&mlon='+k.lon+'#map=16/'+k.lat+'/'+k.lon:'';
  var h='<h3>'+esc(head)+' <span class="rid">row '+k.id+'</span></h3>';
  h+='<p><b>'+esc(k.act)+'.</b> '+esc(k.place)+'</p>';
  if(k.say) h+='<blockquote>'+esc(k.say)+'</blockquote>';
  h+='<h3>How sure</h3><dl><dt>Time</dt><dd>'+esc(k.ts)+(k.te&&k.te!==k.ts?' to '+esc(k.te):'')+' <span class="meta">('+esc(k.tb)+')</span></dd>';
  h+='<dt>Location</dt><dd>'+chip(k.cc)+' '+esc(k.cb)+'</dd><dt>Overall</dt><dd>'+chip(k.oc)+'</dd><dt>Review</dt><dd>'+esc(k.status)+'</dd></dl>';
  if(k.notes) h+='<h3>Notes</h3><p>'+esc(k.notes)+'</p>';
  var sl=WM.srcList(D.sources,k.src); if(sl) h+='<h3>Sources</h3><ul class="srcs">'+sl+'</ul>';
  if(osm) h+='<p style="margin-top:10px"><a href="'+osm+'" target="_blank" rel="noopener">Open this spot on a modern map</a></p>';
  return h;
}
function about(){return '<details><summary>About this prototype</summary>'+
 '<p>Unit positions come from the data pilot spreadsheet (38 rows) built from the Official Records, War Department tablets and Bachelder\'s map. Nothing here has been checked by a historian.</p>'+
 '<p>Solid symbols are positions a source gives. Dashed symbols are interpolated, inferred or the last position on record. A question mark means the location is a loose estimate.</p>'+
 '<p>Base map: John B. Bachelder, <i>Map of the battle field of Gettysburg: First day\'s battle</i> (1876), Boston Public Library copy. The whole sheet is shown; the ground of the first morning, west and north-west of the town, is drawn at twice the detail of the rest. Its printed red and blue bars show the whole day; the labelled symbols on top are this playback.</p>'+
 '<p>Current map: today\'s roads, streams, woods and names from OpenStreetMap, as far as the 1876 sheet reaches. North is up on both maps, so the 1876 sheet sits about 1&deg; askew. At the three buildings used to fit the sheet the two maps differ by 15 to 18 metres. Road names are today\'s; the 1863 name follows in brackets where it differs. Satellite and terrain views are not in this prototype.</p>'+
 '<p>The map is drawn with MapLibre GL JS.</p></details>'}
var panelKey='';
function renderPanel(sc){
  var key=sel?sel+'|'+(function(){var o=sc.filter(function(o){return o.tr.id===sel})[0];return o?o.s.k.id+o.s.kind:'x'})():'now|'+((phase()||[0])[0])+'|'+sc.map(function(o){return o.tr.id+(o.drawn?1:0)+o.s.kind+o.s.k.id}).join(',');
  if(key===panelKey) return; panelKey=key; var h='';
  if(sel){
    var tr=byId(sel),o=sc.filter(function(o){return o.tr.id===sel})[0];
    h+='<button class="back" id="back">&larr; All units</button><div class="who"><div><div class="side '+tr.side+'">'+(tr.side==='US'?'Union':'Confederate')+'</div><h2>'+esc(tr.name)+'</h2>';
    h+='<div class="meta">'+[tr.cmd,tr.str].filter(Boolean).map(esc).join(' &middot; ')+'</div></div></div>';
    if(!o){h+='<div class="state unplaced"><b>Not in the data at '+fmt(t)+'</b>Move the time to see this unit.</div>'}
    else{var K=KIND[o.s.kind];
      h+='<div class="state '+o.s.kind+'"><b>'+K[0]+'</b>'+(o.s.kind==='offmap'?esc(tr.offmap):K[1])+'</div>';
      if(o.s.kind==='moving'){h+=rowHtml(o.s.k,'Heading to');h+=rowHtml(o.s.from,'Coming from')}
      else h+=rowHtml(o.s.k,o.s.kind==='after'?'Last record':'Current record');}
  } else {
    var p=phase(); h+='<div class="eyebrow">'+(p?'Now: '+esc(p[1]):'Before 7:30')+'</div><p class="phase">'+esc(p?p[2]:BEFORE)+'</p>';
    ['US','CS'].forEach(function(side){var L=sc.filter(function(o){return o.tr.side===side&&o.drawn});if(!L.length)return;
      h+='<h3>'+(side==='US'?'Union':'Confederate')+' on the map</h3><ul class="ulist">';
      L.forEach(function(o){h+='<li><button data-pick="'+o.tr.id+'"><span class="sd '+side+'"></span><span class="nm">'+esc(o.tr.label)+'</span><span class="ac">'+esc(o.s.kind==='moving'?'Moving (interpolated)':o.s.kind==='after'?'Last recorded position':o.s.k.act)+'</span></button></li>'});h+='</ul>'});
    var nd=sc.filter(function(o){return !o.drawn&&!o.hidden||o.s.kind==='unplaced'});
    if(nd.length){h+='<h3>Not placed right now</h3><ul class="nd">';nd.forEach(function(o){h+='<li><b>'+esc(o.tr.label)+'</b>: '+esc(o.s.kind==='offmap'?o.tr.offmap:o.s.k.act+'. '+(o.s.k.g?'':'No position on record.'))+'</li>'});h+='</ul>'}
    h+='<p class="meta" style="margin-top:14px">Tap a unit for its source and how sure the position is.</p>'+about();
  }
  panel.innerHTML=h; if(sel) panel.scrollTop=0;
}
function select(id){sel=id||null;panelKey='';mv.kick()}

/* ---------- map, time, controls ---------- */
var mv,clk;
try{ mv=WM.mapView({container:'map',wrap:wrap,world:'sheet',
  worlds:{sheet:{toLL:toLL,ext:[0,0,D.w,D.h],mPerUnit:D.mpp,maxScale:3,minFactor:0.96}},
  onDraw:draw,onPick:select,onUserMove:function(){if(follow)setFollow(false)},onResize:function(){if(follow)mv.jump(target())},
  onStep:function(ts){var more=clk.step(ts);if(follow&&mv.chase(target(),0.16))more=true;return more}});
}catch(err){WM.noMap(wrap,err);return}
S=mv.S;
function paintTime(v){t=v;var c=WM.calOf(D.cal,t);$('clock').textContent=c.clock;$('clockdate').textContent=c.date;WM.paintDayNumber(c.n);
  $('done').style.width=((t-T0)/(T1-T0)*100)+'%';
  var p=phase();Array.prototype.forEach.call(document.querySelectorAll('.tl .ev'),function(e){e.classList.toggle('on',!!p&&+e.dataset.t===p[0])})}
clk=WM.clock({T0:T0,T1:T1,mv:mv,toRange:function(v){return v},fromRange:function(v){return v},rate:function(){return 3},onTime:paintTime,
  arrow:function(dir,v){return v+dir},wheel:function(dd,v){return v+dd*0.035},
  onKey:function(e){if(e.key==='Escape')select(null);else if(e.key==='m'||e.key==='M')setBase(base==='mod'?'old':'mod')}});

/* timeline furniture */
(function(){var tl=$('tl'),pc=function(m){return ((m-T0)/(T1-T0)*100)+'%'},h='';
  $('win').style.left=pc(WIN0);$('win').style.width=((WIN1-WIN0)/(T1-T0)*100)+'%';
  for(var m=450;m<=630;m+=15){h+='<span class="tick" style="left:'+pc(m)+'"></span>';if(m%30===0)h+='<span class="tk'+(m%60?' minor':'')+'" style="left:'+pc(m)+'">'+fmt(m).replace(' a.m.','')+'</span>'}
  EVENTS.forEach(function(e){h+='<button class="ev" data-t="'+e[0]+'" style="left:'+pc(e[0])+'" title="'+esc(fmt(e[0])+': '+e[1])+'">'+esc(e[1])+'</button>'});
  tl.insertAdjacentHTML('afterbegin',h);
  tl.addEventListener('click',function(ev){var b=ev.target.closest('.ev');if(b){clk.setPlaying(false);clk.setTime(+b.dataset.t)}});
})();
$('bFollow').addEventListener('click',function(){setFollow(!follow)});
$('bReg').addEventListener('click',function(){regOn=!regOn;this.setAttribute('aria-pressed',regOn?'true':'false');mv.kick()});
$('bOld').addEventListener('click',function(){setBase('old')});
$('bMod').addEventListener('click',function(){setBase('mod')});
$('bFade').addEventListener('click',function(){faded=!faded;this.setAttribute('aria-pressed',faded?'true':'false');paintFade()});
$('zin').addEventListener('click',function(){setFollow(false);mv.zoomBy(1.4)});
$('zout').addEventListener('click',function(){setFollow(false);mv.zoomBy(1/1.4)});
WM.panelClicks(panel,select);

/* ---------- start ---------- */
mv.start(function(){buildBase();setBase('old');mv.jump(target());clk.setTime(T0);WM.hint(mv)});
window.__gb={setTime:clk.setTime,get view(){return {s:mv.scale()}},select:select,setFollow:setFollow,setBase:setBase,get base(){return base},mv:mv};
})();
</script>
