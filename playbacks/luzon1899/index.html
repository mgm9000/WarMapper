"Needs review","battle":"PHW-YOUNG"}]}],"events":[{"id":"LE01","start":"1899-02-04","end":"1899-02-04","at":"1899-02-04","name":"War begins at Manila","label":"Manila","text":"The war begins at Manila on the evening of 4 February. The Manila playback follows these two days hour by hour.","steps":["LZ001"],"sources":["S65"],"battle":"PHW-MNL-AFTER"},{"id":"LE02","start":"1899-02-10","end":"1899-02-10","at":"1899-02-10","name":"Caloocan taken","label":"Caloocan","text":"MacArthur's division takes Caloocan, the railway town north of Manila.","steps":["LZ002","LZ096"],"sources":["S65"],"battle":"PHW-MNL-AFTER"},{"id":"LE03","start":"1899-03-17","end":"1899-03-17","at":"1899-03-17","name":"The line of the Pasig","label":"Pasig line","text":"Wheaton clears the Pasig River to the lake, cutting the Filipino forces north of Manila from those to the south. Lawton arrives and takes the First Division.","steps":["LZ045","LZ012"],"sources":["S65"],"battle":"PHW-MNL-AFTER"},{"id":"LE19","start":"1899-03-25","end":"1899-03-25","at":"1899-03-25","name":"The advance on Malolos begins","label":"Advance begins","text":"MacArthur's division marches at dawn to turn the Filipino left by Novaliches, while Wheaton's brigade attacks up the railway from Caloocan. Zoom in on Manila to see the brigades.","steps":["LZ085","LZ088","LZ091","LZ093"],"sources":["S65"],"battle":"PHW-MALOLOS"},{"id":"LE04","start":"1899-03-31","end":"1899-03-31","at":"1899-03-31","name":"Malolos falls","label":"Malolos","text":"After a week's advance up the railway MacArthur enters Malolos, the Republic's capital, burning and empty. The Filipino army falls back to Calumpit.","steps":["LZ004","LZ071"],"sources":["S65"],"battle":"PHW-MALOLOS"},{"id":"LE05","start":"1899-04-10","end":"1899-04-10","at":"1899-04-10","name":"Lawton takes Santa Cruz","label":"Santa Cruz","text":"Lawton crosses Laguna de Bay and takes Santa Cruz, then returns to Manila.","steps":["LZ013","LZ099"],"sources":["S65"],"battle":"PHW-LAWTON"},{"id":"LE06","start":"1899-04-28","end":"1899-04-28","at":"1899-04-28","name":"Calumpit: the Rio Grande crossed","label":"Calumpit","text":"MacArthur's men cross the Rio Grande at Calumpit under the fire of the Utah guns. Lawton's column is working round the Filipino left by Norzagaray.","steps":["LZ005","LZ015"],"sources":["S65"],"battle":"PHW-LAWTON"},{"id":"LE07","start":"1899-05-05","end":"1899-05-05","at":"1899-05-05","name":"San Fernando","label":"San Fernando","text":"MacArthur takes San Fernando and is ordered to stop there. His division will hold it through the rains.","steps":["LZ006","LZ016"],"sources":["S65"],"battle":"PHW-LAWTON"},{"id":"LE08","start":"1899-05-17","end":"1899-05-17","at":"1899-05-17","name":"San Isidro","label":"San Isidro","text":"Lawton seizes San Isidro. The Republic's government retires to Cabanatuan and its army to Tarlac. The rains end the spring campaign; San Isidro is given up.","steps":["LZ018","LZ059"],"sources":["S65"],"battle":"PHW-LAWTON"},{"id":"LE09","start":"1899-08-16","end":"1899-08-16","at":"1899-08-16","name":"Angeles","label":"Angeles","text":"During August MacArthur moves up the railway to Angeles, which becomes his headquarters.","steps":["LZ007"],"sources":["S74","S68"],"battle":"PHW-FALL99"},{"id":"LE10","start":"1899-10-20","end":"1899-10-20","at":"1899-10-20","name":"San Isidro retaken","label":"San Isidro again","text":"The fall campaign opens: Lawton's column, Young's cavalry leading, retakes San Isidro. The plan is three columns closing on the Filipino army: Lawton up the Rio Grande, MacArthur up the railway, Wheaton by sea to Lingayen Gulf.","steps":["LZ023","LZ033"],"sources":["S74"],"battle":"PHW-FALL99"},{"id":"LE11","start":"1899-11-07","end":"1899-11-07","at":"1899-11-07","name":"Wheaton lands at San Fabian","label":"San Fabian","text":"Wheaton lands at San Fabian on Lingayen Gulf, across the Filipino army's way north. MacArthur is advancing up the railway; Young's cavalry heads for the mountain trails.","steps":["LZ049"],"sources":["S74","S68"],"battle":"PHW-FALL99"},{"id":"LE12","start":"1899-11-11","end":"1899-11-11","at":"1899-11-11","name":"San Jacinto","label":"San Jacinto","text":"Wheaton's 33rd Infantry routs about 1,200 Filipino troops near San Jacinto, the force that was to have escorted Aguinaldo north.","steps":["LZ050","LZ078"],"sources":["S74"],"battle":"PHW-FALL99"},{"id":"LE13","start":"1899-11-13","end":"1899-11-13","at":"1899-11-13","name":"Tarlac falls; Aguinaldo goes north","label":"Tarlac; Bayambang","text":"MacArthur enters Tarlac, the Republic's capital, on the 12th. At Bayambang Aguinaldo and his generals decide to disband the army into guerrilla bands, and he sets out north with a small escort.","steps":["LZ009","LZ061"],"sources":["S74","S68"],"battle":"PHW-FALL99"},{"id":"LE14","start":"1899-11-20","end":"1899-11-20","at":"1899-11-20","name":"Young takes San Fernando de la Union","label":"San Fernando, La Union","text":"Young's handful of cavalry and Macabebe scouts reach the coast and take San Fernando de la Union. Aguinaldo is a day ahead of them on the coast road.","steps":["LZ041","LZ064","LZ105"],"sources":["S71","S68","S75"],"battle":"PHW-FALL99"},{"id":"LE15","start":"1899-11-26","end":"1899-11-26","at":"1899-11-26","name":"Navy lands at Vigan","label":"Vigan","text":"A Navy landing party takes Vigan, ahead of Young. (Otis's report says the 24th; an officer on the spot says the morning of the 26th.)","steps":["LZ110","LZ106","LZ117"],"sources":["S75","S74"],"battle":"PHW-FALL99"},{"id":"LE16","start":"1899-12-02","end":"1899-12-02","at":"1899-12-02","name":"Tirad Pass","label":"Tirad Pass","text":"March's battalion carries Tirad Pass, where Gregorio del Pilar and Aguinaldo's rear guard die holding it. Aguinaldo leaves Cervantes that night for the mountains.","steps":["LZ052","LZ082","LZ067"],"sources":["S68","S74","S71"],"battle":"PHW-FALL99"},{"id":"LE17","start":"1899-12-05","end":"1899-12-05","at":"1899-12-05","name":"Young at Vigan","label":"Vigan","text":"Young reaches Vigan after beating Tinio east of Narvacan. Aguinaldo has disappeared into the mountains; the sources read do not follow him further.","steps":["LZ044","LZ054"],"sources":["S74","S68"],"battle":"PHW-FALL99"},{"id":"LE20","start":"1899-12-10","end":"1899-12-11","at":"1899-12-11","name":"Laoag","label":"Laoag","text":"The Navy lands a force at Laoag, and Young follows from Vigan by sea in the gunboat Samar. His columns are in the mountains after Tinio, who holds the American prisoners.","steps":["LZ119","LZ120","LZ121","LZ108"],"sources":["S74"],"battle":"PHW-YOUNG"},{"id":"LE18","start":"1899-12-13","end":"1899-12-13","at":"1899-12-13","name":"Cagayan surrenders","label":"Cagayan","text":"The Cagayan valley surrenders to a Navy force at Aparri, as Batchelor's battalion comes down the river from Bayombong. The playback ends here.","steps":["LZ056","LZ118"],"sources":["S74"],"battle":"PHW-FALL99"}],"sources":{"S64":{"title":"Map of Manila and vicinity: showing positions of troops prior to the battle of February 5th and location of the military telegraph lines then in operation, also positions and locations after the capture of Caloocan, February 10, 1899","author":"J. H. Warking, Sergt., Vol. Signal Corps, under Lt. Col. R. E. Thompson, Chief Signal Officer","date":"1899-02","citation":"Manila, February 1899. Scale 1:25,000 (scale bar in yards). Blue-line photocopy, 48 x 69 cm, oriented with north to the left. Library of Congress, Geography and Map Division, G8064.M5 1899 .W3, digital id g8064m ct002453 (scan 11,533 x 7,657 px). Includes \"Index to troops engaged and their final positions\".","type":"Primary-era map: troop positions drawn by the Signal Corps, February 1899","url":"https://www.loc.gov/item/2009582402/","rights":"LoC map collections: published before 1922 and/or by the US government; LoC \"not aware of any U.S. copyright protection\". Credit: Library of Congress, Geography and Map Division."},"S65":{"title":"Rep led in Washington in 1899 from older Spanish mapping, on two sheets: Lingayen Gulf to Malolos, and Manila Bay to Lake Taal. It is the clearest of the three period maps and not the truest: fitted on 32 towns, places on the north sheet fall about 1.7 km from where they are (3.5 km at worst), and the Pacific coast is some 5 km out; the south sheet is within about half a kilometre at Manila and 1.4 km around Laguna de Bay (3.8 km at worst), and Cavite is 3 to 5 km out. The two sheets are fitted together so that they meet. Units are drawn at the true places. Zoomed in, the north sheet sharpens; the south sheet does not.","approx_m_per_px":17.6,"iiif":{"service":"https://cdm16022.contentdm.oclc.org/iiif/2/p16022coll230:4182","width":11998,"height":9451,"tile":1024,"scale_factors":[1,2,4,8,16],"region":[0,0,11998,9360],"reduced":0.20003},"images":[{"file":"theatre-1899-north.webp","reduced":0.20003,"corners":[[119.932177,16.221665],[121.89313,16.269501],[121.915506,14.834936],[119.954553,14.7871]]},{"file":"theatre-1899-south.webp","reduced":0.199,"corners":[[119.959986,14.793502],[121.903104,14.818446],[121.883902,13.882062],[119.940783,13.857117]]}]}],"base":{"lines":[["road","m","","12113136,1420977;-312,468"],["road","m","","12135305,1421133;1405,2810"],["road","m","","12112824,1421445;312,-468"],["road","m","","12112824,1421445;-156,156"],["road","m","","12112668,1421601;156,-156"],["road","m","","12112668,1421601;-313,625"],["road","m","","12112355,1422226;313,-469"],["road","m","","12112355,1422226;313,-625"],["road","m","","12112355,1422226;-936,1405"],["road","m","","12111419,1423631;936,-1405"],["road","m","","12111419,1423631;0,156"],["road","m","","12111419,1423787;0,-156"],["road","m","","12111419,1423787;-469,780"],["road","m","","12110950,1424411;469,-624"],["road","m","","12110950,1424567;0,-156"],["road","m","","12110950,1424567;-780,1405"],["road","m","","12110326,1425348;0,-156"],["road","m","","12110326,1425348;0,-156"],["road","m","","12110482,1425348; 0000;0,-10000;0,-10000;0,-10000"],["water","Laguna de Bay","12147422,1437480;324,-1590;29,-2355;-235,-1413;-589,-88;-2944,2590;-471,-176;-647,-2385;117,-1560;-353,-530;-589,30;-3620,-2708;-2002,-942;-1501,-1413;-2885,-3562;-795,-1354;-618,-530;-2237,-648;-1325,-117;-589,441;-1000,177;-4769,-971;-1707,441;-148,765;148,2650;-471,1030;-1354,1796;-471,1854;-2149,1854;-2414,3710;-3915,3414;-1619,1884;-677,2649;265,5947;471,1942;2443,3533;3473,618;3562,-1649;2856,-3179;2178,-4386;1266,-1148;-471,2708;265,972;1560,1854;1060,2826;382,589;824,324;1090,118;1000,-177;884,-1531;1089,-1266;1236,-1148;2178,-1295;589,-1825;559,-3414;-382,-1914;-1884,-3444;-412,-1943;-118,-2943;589,58;1560,1148;4798,2355;1678,1443;1177,1972;442,1501;765,736;2120,-441;1589,-795;795,-1089"]],"credit":"Made with Natural Earth","source":"S76","widths":{"Cagayan":300}},"summaries":[{"kind":"week","from":"1899-02-04","to":"1899-02-10","title":"War begins at Manila","text":"Fighting breaks out at Manila on the evening of the 4th. By the 5th the Eighth Army Corps holds the high ground and the waterworks around the city. On the 10th MacArthur takes Caloocan.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-02-11","to":"1899-02-17","title":"Around Manila","text":"The corps strengthens its lines around Manila. About the 12th an attack on the outpost on the Marikina road, by the waterworks, is beaten off.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-02-18","to":"1899-02-24","title":"Rising in Manila","text":"On the night of the 22nd armed men who have slipped into Tondo set fires in the city and attack; the provost guard drives them out the next day. The 20th Infantry lands.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-02-25","to":"1899-03-03","title":"Around the waterworks","text":"More attacks north of the Marikina road are driven off on the 25th and 27th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-03-04","to":"1899-03-10","title":"A brigade for the Pasig","text":"The 22nd Infantry lands. A provisional brigade under Wheaton is formed and opens its attack towards Pasig on the 10th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-03-11","to":"1899-03-17","title":"The Pasig line; Lawton arrives","text":"Wheaton clears Pasig, Pateros and Taguig by the 17th. Lawton takes over the First Division that day.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-03-18","to":"1899-03-24","title":"Preparing to advance","text":"Both divisions are regrouped into three brigades each. MacArthur's column gathers behind La Loma on the night of the 24th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-03-25","to":"1899-03-31","title":"Malolos","text":"MacArthur's division advances from 25 March, fights across the Tulihan and at Polo, and enters Malolos on the 31st. The Republic's government has left and its army falls back on Calumpit.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-04-01","to":"1899-04-07","title":"Malolos held","text":"MacArthur rests his division at Malolos while the railway behind it is repaired.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-04-08","to":"1899-04-14","title":"Santa Cruz","text":"Lawton crosses Laguna de Bay on the 9th and takes Santa Cruz on the 10th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-04-15","to":"1899-04-21","title":"Lawton turns north","text":"Lawton returns from the lake on the 17th and gathers a column of nearly 4,000 near Caloocan to march round the Filipino left.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-04-22","to":"1899-04-28","title":"Calumpit","text":"Lawton marches on the 22nd and reaches Norzagaray on the 25th. MacArthur advances on the 24th and forces the Rio Grande at Calumpit on the 28th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-04-29","to":"1899-05-05","title":"San Fernando","text":"MacArthur takes Santo Tomas and San Fernando and is halted there on 5 May. Lawton takes Baliuag.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-05-06","to":"1899-05-12","title":"Holding San Fernando and Baliuag","text":"MacArthur is kept at San Fernando; Lawton scouts from Baliuag and takes Maasin. Gunboats find the mouth of the Rio Grande and reach Calumpit on the 10th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-05-13","to":"1899-05-19","title":"San Isidro","text":"Lawton routs the Filipino force at San Ildefonso and San Miguel and seizes San Isidro on the 17th. The Republic's government retires to Cabanatuan and Luna's army to Tarlac. Kobbe's column comes up the Rio Grande to Candaba.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-05-20","to":"1899-05-26","title":"The rains","text":"Lawton and Kobbe meet at Arayat. The rains begin; San Isidro and San Miguel are given up and garrisons are left at Baliuag, Candaba and San Luis.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-05-27","to":"1899-06-02","title":"No change on record","text":"The sources read record no move on this map this week.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-06-03","to":"1899-06-09","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-06-10","to":"1899-06-16","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-06-17","to":"1899-06-23","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-06-24","to":"1899-06-30","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-07-01","to":"1899-07-07","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-07-08","to":"1899-07-14","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-07-15","to":"1899-07-21","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-07-22","to":"1899-07-28","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-07-29","to":"1899-08-04","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-08-05","to":"1899-08-11","title":"A quiet week","text":"The rainy season. MacArthur's division holds San Fernando; the Republic's government is at Tarlac. Nothing in the sources read moves on this map.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-08-12","to":"1899-08-18","title":"Angeles","text":"During August MacArthur pushes up the railway from San Fernando to Angeles. The day is not in the sources read.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-08-19","to":"1899-08-25","title":"A quiet week","text":"MacArthur holds Angeles and the railway behind it is rebuilt (first train on 20 September). New regiments arrive for the fall campaign.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-08-26","to":"1899-09-01","title":"A quiet week","text":"MacArthur holds Angeles and the railway behind it is rebuilt (first train on 20 September). New regiments arrive for the fall campaign.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-09-02","to":"1899-09-08","title":"A quiet week","text":"MacArthur holds Angeles and the railway behind it is rebuilt (first train on 20 September). New regiments arrive for the fall campaign.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-09-09","to":"1899-09-15","title":"A quiet week","text":"MacArthur holds Angeles and the railway behind it is rebuilt (first train on 20 September). New regiments arrive for the fall campaign.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-09-16","to":"1899-09-22","title":"A quiet week","text":"MacArthur holds Angeles and the railway behind it is rebuilt (first train on 20 September). New regiments arrive for the fall campaign.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-09-23","to":"1899-09-29","title":"A quiet week","text":"MacArthur holds Angeles and the railway behind it is rebuilt (first train on 20 September). New regiments arrive for the fall campaign.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-09-30","to":"1899-10-06","title":"A quiet week","text":"MacArthur holds Angeles and the railway behind it is rebuilt (first train on 20 September). New regiments arrive for the fall campaign.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-10-07","to":"1899-10-13","title":"A quiet week","text":"MacArthur holds Angeles and the railway behind it is rebuilt (first train on 20 September). New regiments arrive for the fall campaign.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-10-14","to":"1899-10-20","title":"The fall campaign opens","text":"Lawton leaves Manila on the 15th, crosses the Rio Grande at Arayat on the 17th and, with Young's cavalry leading, retakes San Isidro on the 20th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-10-21","to":"1899-10-27","title":"San Isidro","text":"Lawton gathers supplies at San Isidro. Young's cavalry fights at Santa Rosa on the 27th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-10-28","to":"1899-11-03","title":"Cabanatuan","text":"Young's men occupy Cabanatuan on the 30th and Aliaga on the 31st. Floods hold up Lawton's supplies on the river.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-11-04","to":"1899-11-10","title":"Three columns","text":"MacArthur advances from Angeles on the 5th. Wheaton lands at San Fabian on the 7th. Young leaves Cabanatuan for the north; Lawton is cut off behind him by floods.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-11-11","to":"1899-11-17","title":"The Republic's army breaks up","text":"The 33rd Infantry wins at San Jacinto on the 11th; MacArthur enters Tarlac on the 12th. At Bayambang Aguinaldo and his generals decide to fight on as guerrillas, and he slips north between Wheaton and Young. Young reaches Pozorrubio on the 17th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-11-18","to":"1899-11-24","title":"The pursuit","text":"Young follows Aguinaldo over the mountains to Tubao, forces the Aringay River on the 19th and takes San Fernando de la Union on the 20th. MacArthur reaches Bayambang and reports the Republic destroyed.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-11-25","to":"1899-12-01","title":"Into the mountains","text":"Aguinaldo leaves the coast at Candon for Lepanto. The Navy lands at Vigan on the 26th. On the 30th Young sends March's battalion after Aguinaldo. Batchelor sets out from Bayombong down the Cagayan valley.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-12-02","to":"1899-12-08","title":"Tirad Pass","text":"March carries Tirad Pass on the 2nd, where Gregorio del Pilar is killed, and reaches Cervantes on the 3rd; Aguinaldo has gone on into the mountains. Young beats Tinio east of Narvacan on the 4th and enters Vigan on the 5th.","sources":["S65","S74","S68"]},{"kind":"week","from":"1899-12-09","to":"1899-12-15","title":"Cagayan","text":"The province of Cagayan surrenders to a Navy force at Aparri as Batchelor's battalion nears the town. Lawton is ordered south. The sources read do not follow Aguinaldo further.","sources":["S65","S74","S68"]}]}</script>
