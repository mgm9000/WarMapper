<title>Trenton 1776 Playback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="__APP__/vendor/maplibre-gl.css">
<link rel="stylesheet" href="__APP__/core.css">
<style>
/* Trenton: side colours. The unit colours are the same in both themes so they read on either base. */
:root{ --us:#1d5c9e; --cs:#b5382a; --m-us:#124f93; --m-us-fill:#e3eefb; --m-cs:#b02a1c; --m-cs-fill:#fde6e1; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --us:#7fb2ea; --cs:#f0897c; } }
:root[data-theme="dark"]{ --us:#7fb2ea; --cs:#f0897c; }
.sd.US{background:var(--us)} .sd.CR{background:var(--cs)}
.who .side.US{color:var(--us)} .who .side.CR{color:var(--cs)}
.tl .win{border-radius:0 5px 5px 0}
</style>
<div class="app">
  <header class="bar gut">
    <div class="ttl">
      <h1>Trenton, 26 December 1776</h1>
      <p>Washington's march from the Delaware and the fight for the town</p>
    </div>
  </header>

  <main class="stage">
    <div class="mapwrap" id="mapwrap" tabindex="0" aria-label="Battle map. Scroll or pinch to zoom, drag to pan. To move time, scroll over the timeline or use the arrow keys.">
      <div id="map"></div>
      <svg id="ov" aria-hidden="true"></svg>
      <div class="ctl c-l">
        <div class="seg" role="group" aria-label="Base map">
          <button id="bMod" aria-pressed="true"><span class="lg">Current map</span><span class="sm">Today</span></button>
          <button id="bSk" aria-pressed="false"><span class="lg">1776 sketch</span><span class="sm">1776</span></button>
        </div>
        <button class="chipbtn" id="bFollow" aria-pressed="true"><span class="dot"></span><span>Follow</span></button>
        <button class="chipbtn" id="bNames" aria-pressed="true" title="Show or hide the names beside the unit symbols (N)"><span class="dot"></span><span>Names</span></button>
      </div>
      <div class="ctl c-r">
        <button class="sq" id="zin" aria-label="Zoom in">+</button>
        <button class="sq" id="zout" aria-label="Zoom out">&minus;</button>
      </div>
      <div class="offnote" id="offnote" hidden></div>
      <div class="when" id="when" aria-live="off"><div class="dayn" id="dayn" hidden></div><div class="t" id="clock">3:00 a.m.</div><div class="d" id="clockdate"></div><div class="n" id="clocknote" hidden>Times are estimates</div></div>
      <div class="scale" id="scale"></div>
      <div class="hint" id="hint">Scroll or pinch to zoom &middot; drag to pan &middot; scroll over the timeline to move time</div>
      <div class="credit" id="credit"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="tlbar gut">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 16 16" id="playico"><path d="M3 1.5v13l11-6.5z"/></svg></button>
    <div class="tl" id="tl">
      <div class="rail"></div><div class="win" id="win"></div><div class="done" id="done"></div>
      <input type="range" id="time" min="0" max="1000" step="1" value="0" aria-label="Time of day">
    </div>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script src="__APP__/vendor/maplibre-gl.js"></script>
<script src="__APP__/core.js"></script>
<script>
/* Trenton, 26 December 1776. The data comes from the battle file (battle.json, written into this page). The shared core (core.js) reads it
   and runs the map, the clock and the controls; this script holds what is particular to this playback:
   where each unit is at a given time, how units are laid out and drawn, and the side panel.
   Two bases: a current street map, and Wiederhold's 1776 sketch, which is not to scale and so is shown as a picture of its own with its own unit positions. */
(function(){

B.tracks.forEach(function(tr){tr.k.forEach(function(k){k.gs=(k.on&&k.on[SK.id])||null})});

var wrap=$('mapwrap'),ov=$('ov'),panel=$('panel');
var base='mod',t=T0,sel=null,follow=true,names=true,sNow=0.1;
function GK(){return base==='mod'?'g':'gs'}
var byId=B.track;

/* The ground frame is metres east and south of a point in Trenton. The sketch has no true scale, so it gets a frame of its own:
   its pixels, laid out as a small patch of pretend ground, which lets the same map engine pan and zoom it. */
var SKK=1e-5;
function skLL(p){return [p[0]*SKK,-p[1]*SKK]}

/* ---------- where is a unit at time t ---------- */
function alongPath(path,f){return WM.along(path,f).p}
function move(a,b,f,key){ // a,b keyframes
  if(key==='g'&&b.via&&b.via.length>1){ if(f>0.92&&b.g.length>1){var c0=alongPath(b.via,0.92),g0=[c0];return lerpG(g0,b.g,(f-0.92)/0.08)} return [alongPath(b.via,Math.min(f/0.92,1))]; }
  return lerpG(a[key],b[key],f)}
function stateAt(tr,tt,key){
  var ks=tr.k,n=ks.length; if(tt<ks[0].t0) return null;
  for(var i=0;i<n;i++){
    var k=ks[i],nx=ks[i+1],end=k.t1;
    if(tt>=k.t0&&tt<=end){
      if(k.virtual){ if(!nx) return null; if(end===k.t0&&tt>k.t0) {} else return {k:k,g:k[key],kind:'moving',from:k,hid:true}; }
      if(k.id==='T23'&&k[key]) return {k:k,g:[alongPath(k[key],(tt-k.t0)/Math.max(1,k.t1-k.t0))],kind:'stated'};
      if(!k[key]){var pg=null;for(var j=i-1;j>=0;j--)if(ks[j][key]){pg=ks[j][key];break} return {k:k,g:pg,kind:k.g?'offsketch':'unplaced'}}
      if(nx&&nx[key]&&nx.t0-end<0.01&&!nx.via){var M=Math.min(3,(end-k.t0)/2); if(M>0&&tt>end-M) return {k:nx,from:k,g:lerpG(k[key],nx[key],(tt-(end-M))/M),kind:'moving'}}
      return {k:k,g:k[key],kind:k.method==='inferred'?'inferred':'stated'};
    }
    if(nx&&tt>end&&tt<nx.t0){
      if(k[key]&&nx[key]){ var ca=cen(k[key]),cb=cen(nx[key]);
        if(!nx.via&&Math.hypot(ca[0]-cb[0],ca[1]-cb[1])<(key==='g'?15:8)) return {k:nx,g:nx[key],kind:nx.method==='inferred'?'inferred':'stated'};
        return {k:nx,from:k,g:move(k,nx,(tt-end)/(nx.t0-end),key),kind:'moving'}; }
      if(k[key]) return {k:nx,g:k[key],kind:nx.g?'offsketch':'unplaced'};

    }
  }

}
function scene(){var key=GK(),out=[];B.tracks.forEach(function(tr){var s=stateAt(tr,t,key);if(s&&!s.hid)out.push({tr:tr,s:s,drawn:!!s.g})});return out}

/* ---------- view ---------- */
function actionBox(){var key=GK(),b=[1e9,1e9,-1e9,-1e9],any=false;
  B.tracks.forEach(function(tr){var s=stateAt(tr,t,key);if(!s||!s.g||s.hid)return;
    if(tr.id==='T-HE-PKFER')return; any=true;s.g.forEach(function(p){b[0]=Math.min(b[0],p[0]);b[1]=Math.min(b[1],p[1]);b[2]=Math.max(b[2],p[0]);b[3]=Math.max(b[3],p[1])})});
  if(!any) return base==='mod'?B.presets.march:[0,0,SK.size[0]*0.75,SK.size[1]];
  var minW=base==='mod'?700:520,minH=base==='mod'?520:400,mg=base==='mod'?90:70;
  var mx=Math.max(mg,(minW-(b[2]-b[0]))/2),my=Math.max(mg,(minH-(b[3]-b[1]))/2);
  return [b[0]-mx,b[1]-my,b[2]+mx,b[3]+my]}
function target(){var n=mv.size().w<520?36:56;return mv.cameraFor(actionBox(),{t:n+34,b:n+26,l:n,r:n},base==='mod'?2.2:1.3)}
function setFollow(v){follow=v;$('bFollow').setAttribute('aria-pressed',v?'true':'false');if(v)mv.kick()}
function setNames(v){names=v;$('bNames').setAttribute('aria-pressed',v?'true':'false');try{localStorage.setItem('trenton.names',v?'1':'0')}catch(_){ }mv.kick()}

/* ---------- drawing ---------- */
var S;
var ECH={army:'XXXX',division:'XX',brigade:'X',regiment:'III',company:'I',battery:'I',section:'••',detachment:'•',headquarters:''};
function layout(sc){
  var L=[],Z=mv.size(),agg=(base==='mod'&&sNow<0.085),ag=[];
  sc.forEach(function(o){ if(!o.drawn) return; if(agg&&o.tr.side==='CR'&&o.tr.id!=='T-HE-PKFER'){ag.push(S(cen(o.s.g)));return} var tr=o.tr,pts=o.s.g.map(S),len=WM.plen(pts);
    var c=WM.along(pts,0.5).p,nx=tr.nudge?tr.nudge[0]:0,ny=tr.nudge?tr.nudge[1]:0,x=c[0]+nx,y=c[1]+ny;
    if(len>7){var a=pts[0],b=pts[pts.length-1],vx=b[0]-a[0],vy=b[1]-a[1],LL=Math.hypot(vx,vy)||1,px=-vy/LL,py=vx/LL;if(px<0){px=-px;py=-py}x+=px*20;y+=py*13}
    var low=(o.s.k.oc==='low'&&o.s.kind!=='moving'),txt=tr.label+(low?' ?':'');
    var pr=(tr.id===sel?0:(tr.ech==='detachment'||tr.ech==='section')?4:tr.branch==='art'?3:(tr.ech==='regiment'||tr.ech==='brigade')?1:2);
    L.push({o:o,pts:pts,len:len,c:c,x:x,y:y,low:low,txt:txt,w:txt.length*7.1+6,pr:pr,nudged:!!(nx||ny)})});
  if(ag.length){ // zoomed right out: the garrison is one symbol
    var gc=cen(ag),gt="Rall's brigade (garrison)";
    L.push({o:{tr:{id:'',label:gt,side:'CR',ech:'brigade',branch:'inf'},s:{kind:'stated',k:{oc:'high'}}},pts:[gc],len:0,c:gc,x:gc[0],y:gc[1],low:false,txt:gt,w:gt.length*7.1+6,pr:1,nudged:false}); }
  // spread symbols that land on the same spot
  for(var i=0;i<L.length;i++)for(var j=0;j<i;j++){var a=L[i],b=L[j];if(Math.abs(a.x-b.x)<24&&Math.abs(a.y-b.y)<18){a.y=b.y+ (a.y>=b.y?21:-21);a.nudged=true}}
  var R=[]; function hit(r){for(var i=0;i<R.length;i++){var q=R[i];if(r[0]<q[2]&&r[2]>q[0]&&r[1]<q[3]&&r[3]>q[1])return true}return false}
  L.forEach(function(u){R.push([u.x-14,u.y-19,u.x+14,u.y+10]);
    for(var i=1;i<u.pts.length&&u.len>7;i++){var a=u.pts[i-1],b=u.pts[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(d/11));
      for(var j=0;j<=n;j++){var qx=a[0]+(b[0]-a[0])*j/n,qy=a[1]+(b[1]-a[1])*j/n;R.push([qx-4,qy-4,qx+4,qy+4])}}});
  L.slice().sort(function(a,b){return a.pr-b.pr}).forEach(function(u){
    var x=u.x,y=u.y,w=u.w,C=[[x+16,y-8,x+16+w,y+8,'start',x+17,y+4.5],[x-16-w,y-8,x-16,y+8,'end',x-17,y+4.5],[x-w/2,y+11,x+w/2,y+26,'middle',x,y+23],[x-w/2,y-35,x+w/2,y-20,'middle',x,y-23]];
    u.lab=null; if(!names&&!(sel&&u.o.tr.id===sel)) return; // names off: only the selected unit keeps its name
    for(var i=0;i<C.length;i++){ if(C[i][0]>=3&&C[i][2]<=Z.w-3&&!hit(C[i])){u.lab=C[i];break} }
    if(!u.lab&&u.pr<=1) u.lab=C[0];
    if(u.lab) R.push(u.lab) });

}
function unitSvg(u){
  var o=u.o,tr=o.tr,s=o.s,pts=u.pts,len=u.len,col=tr.side==='US'?'var(--m-us)':'var(--m-cs)',fill=tr.side==='US'?'var(--m-us-fill)':'var(--m-cs-fill)';
  var soft=(s.kind==='moving'||s.kind==='after'),low=u.low,op=(s.kind==='after')?0.55:1,isSel=sel===tr.id,h='',x=u.x,y=u.y,c=u.c;
  h+='<g opacity="'+op+'">';
  if(len>7){var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(''),w=tr.ech==='brigade'||tr.ech==='division'?6:4.5;
    var dash=soft?' stroke-dasharray="7 5"':'';
    if(isSel) h+='<path d="'+d+'" fill="none" stroke="var(--m-sel)" stroke-width="'+(w+9)+'" stroke-linecap="round" opacity=".75"/>';
    h+='<path d="'+d+'" fill="none" stroke="var(--u-halo)" stroke-width="'+(w+4)+'"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'"'+dash+'/>';
    mv.hits.push({id:tr.id,pts:pts,tol:w/2+4});}
  if(u.nudged) h+='<line x1="'+c[0].toFixed(1)+'" y1="'+c[1].toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--u-ink)" stroke-width="1"/><circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="2.5" fill="'+col+'"/>';
  h+='<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+')">';
  if(isSel) h+='<rect x="-18" y="-14" width="36" height="28" rx="4" fill="none" stroke="var(--m-sel)" stroke-width="4"/>';
  h+='<rect x="-13" y="-9" width="26" height="18" fill="'+fill+'" stroke="'+col+'" stroke-width="1.8"'+((soft||low)?' stroke-dasharray="3 2.5"':'')+'/>';
  if(tr.ech==='headquarters') h+='<path d="M-13 -9V16" stroke="'+col+'" stroke-width="1.8"/><text class="ech in" text-anchor="middle" y="4" style="stroke:none">HQ</text>';
  else if(tr.branch==='inf') h+='<path d="M-13 -9L13 9M-13 9L13 -9" stroke="'+col+'" stroke-width="1.4"/>';
  else if(tr.branch==='cav') h+='<path d="M-13 9L13 -9" stroke="'+col+'" stroke-width="1.4"/>';
  else h+='<circle r="3.4" fill="'+col+'"/>';
  h+='<text class="ech" text-anchor="middle" y="-12">'+(ECH[tr.ech]||'')+'</text></g>';
  mv.hits.push({id:tr.id,r:[x-17,y-20,x+17,y+13]});
  if(u.lab){h+='<text class="ulab" text-anchor="'+u.lab[4]+'" x="'+u.lab[5].toFixed(1)+'" y="'+u.lab[6].toFixed(1)+'">'+esc(u.txt)+'</text>';mv.hits.push({id:tr.id,r:[u.lab[0],u.lab[1],u.lab[0]+u.w,u.lab[1]+16]})}
  return h+'</g>';
}
function draw(){
  sNow=mv.scale(); mv.hits.length=0; var z=mv.size(),h='';
  var sc=scene(),L=layout(sc);
  if(base==='mod'){
    var lvl=sNow>=0.12?1:0;
    ROADS.forEach(function(l){ if(l.l!==lvl) return; var q=S(l.p); if(q[0]<-60||q[1]<-20||q[0]>z.w+60||q[1]>z.h+20) return;
      var tw=(l.t.length+(l.s?l.s.length+3:0))*5.6,ca=Math.abs(Math.cos(l.a*Math.PI/180)),sa=Math.abs(Math.sin(l.a*Math.PI/180)),bw=(tw*ca+12*sa)/2,bh=(tw*sa+12*ca)/2;
      if(L.hit([q[0]-bw,q[1]-bh,q[0]+bw,q[1]+bh])) return;
      h+='<text class="sl" text-anchor="middle" transform="translate('+q[0].toFixed(1)+' '+q[1].toFixed(1)+') rotate('+l.a+')">'+esc(l.t)+(l.s?' <tspan class="old">('+esc(l.s)+')</tspan>':'')+'</text>'});
    MARKS.forEach(function(l){ if(l.l!==lvl&&!(l.l===0&&lvl===1)) return; var q=S(l.p); if(q[0]<-40||q[1]<-20||q[0]>z.w+40||q[1]>z.h+20) return;
      if(l.t==='Trenton'&&sNow>0.09) return;
      var hid=L.hit([q[0]+5,q[1]-17,q[0]+9+l.t.length*6.6,q[1]-2]);
      h+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3" fill="var(--map-text)"/>'; if(hid) return;
      h+='<text class="lm" x="'+(q[0]+7).toFixed(1)+'" y="'+(q[1]-6).toFixed(1)+'">'+esc(l.t)+'</text>'});
  }
  L.sort(function(a,b){return (a.o.tr.id===sel)-(b.o.tr.id===sel)});
  L.forEach(function(u){h+=unitSvg(u)}); ov.innerHTML=h;
  if(base==='mod') WM.scaleBar($('scale'),mv.mPerPx(),'yards');
  else $('scale').innerHTML='<span class="nts">Not to scale outside the town</span>';

  if(base==='sk'&&t<462){off.hidden=false;off.textContent='The march is off this sketch. Switch to the current map to follow it, or move on to 7:45.'} else off.hidden=true;

/* ---------- the two bases ---------- */
var MOD=['b-river','b-creek','b-edge','b-road'];
function buildBase(){
  var W={m:[4.6,3.2],p:[4.2,2.8],s:[3.6,2.3],t:[3.1,1.9],r:[2.3,1.3]},f=[];
  B.base.lines.forEach(function(l){
    if(l.kind==='water'){f.push(WM.feat('line',l.ll,{k:l.cls==='river'?'river':'creek'}));return}
    var k=W[l.cls]||W.r;f.push(WM.feat('line',l.ll,{k:'road',major:(l.cls==='m'||l.cls==='p')?1:0,e:k[0],w:k[1]}))});
  mv.geo('base',f);
  var is=function(k){return ['==',['get','k'],k]},round={'line-cap':'round','line-join':'round'};
  // the Delaware is drawn as a line 270 m wide on the ground, so its width in pixels doubles with each zoom level
  var px=function(zm){return 270*512*Math.pow(2,zm)/(40075016.686*Math.cos(B.raw.view.origin[1]*Math.PI/180))};
  mv.layer({id:'b-river',type:'line',source:'base',filter:is('river'),layout:round,paint:{'line-color':'var(--water)','line-width':['interpolate',['exponential',2],['zoom'],6,px(6),22,px(22)]}});
  mv.layer({id:'b-creek',type:'line',source:'base',filter:is('creek'),layout:round,paint:{'line-color':'var(--water)','line-width':3}});
  mv.layer({id:'b-edge',type:'line',source:'base',filter:is('road'),layout:round,paint:{'line-color':'var(--road-edge)','line-width':['get','e']}});
  mv.layer({id:'b-road',type:'line',source:'base',filter:is('road'),layout:round,paint:{'line-color':function(c){return ['match',['get','major'],1,c('--road-major'),c('--road')]},'line-width':['get','w']}});
  mv.image('sketch',WM.asset(SK.images[0].file),[0,0,SK.size[0],SK.size[1]],WORLDS.sk);
}
function setBase(b){base=b;var mod=b==='mod';$('bMod').setAttribute('aria-pressed',mod?'true':'false');$('bSk').setAttribute('aria-pressed',mod?'false':'true');
  mv.setWorld(b);MOD.forEach(function(id){mv.show(id,mod)});mv.show('sketch',!mod);
  wrap.classList.toggle('paper',!mod);mv.bg(mod?'--land':'--m-paper');
  $('credit').innerHTML=mod?WM.OSM_CREDIT:esc(SK.credit);
  mv.jump(target());panelKey='';mv.retheme();mv.kick()}

/* ---------- panel ---------- */
function phase(){return B.eventAt(t)}
var CS={map_read:'Read from a surveyed period map',sketch_read:"Read from Wiederhold's sketch",modern_map:'A named place on the current map',marker:'A marker at the spot',derived:'Worked out from other points',estimate:'Estimated from a description',none:'None'};
var KIND={stated:['Placed by a source','A report, a history, a marker or the 1776 sketch puts the unit here.'],inferred:['Inferred position','Worked out from the sequence of events; the sources do not name this unit here.'],
  moving:['Moving: interpolated','No source records this stretch. The unit is drawn along a road or a straight line between two recorded positions.'],
  after:['Last recorded position','The data has nothing later for this unit.'],unplaced:['No position recorded','The sources read so far do not say where the unit was at this time.'],offsketch:['Not on the sketch','This position lies outside what Wiederhold drew. Switch to the current map to see it.']};
function rowHtml(k,head){
  var osm=(k.lat!=null)?'https://www.openstreetmap.org/?mlat='+k.lat+'&mlon='+k.lon+'#map=17/'+k.lat+'/'+k.lon:'';
  var h='<h3>'+esc(head)+' <span class="rid">row '+k.id+'</span></h3><p><b>'+esc(k.act)+'.</b> '+esc(k.place)+'</p>';
  if(k.say) h+='<blockquote>'+esc(k.say)+'</blockquote>';
  h+='<h3>How sure</h3><dl><dt>Start</dt><dd>'+esc(k.ts)+'</dd><dt>End</dt><dd>'+esc(k.te)+' <span class="meta">('+esc(k.tb)+')</span></dd>';
  h+='<dt>Location</dt><dd>'+esc(CS[k.cs]||k.cs)+(k.prec?', good to about '+k.prec+' m':'')+'. <span class="meta">'+esc(k.cb)+'</span></dd><dt>Overall</dt><dd>'+chip(k.oc)+'</dd></dl>';
  if(k.notes) h+='<h3>Notes</h3><p>'+esc(k.notes)+'</p>';
  var sl=WM.srcList(B.sources,k.src); if(sl) h+='<h3>Sources</h3><ul class="srcs">'+sl+'</ul>';
  if(osm) h+='<p style="margin-top:10px"><a href="'+osm+'" target="_blank" rel="noopener">Open this spot on OpenStreetMap</a></p>';
  return h;
}
function about(){return '<details><summary>About this prototype</summary>'+
 '<p>Unit positions come from the data pilot spreadsheet (61 Trenton rows), built from Washington\'s report, Stryker\'s 1898 history, markers, the current street map and Lt. Wiederhold\'s sketch. Nothing here has been checked by a historian.</p>'+
 '<p>Clock times after the first shots are midpoints of estimated ranges: the sources give almost none.</p>'+
 '<p>The Names button hides the names beside the symbols; tap a symbol to see whose it is.</p>'+
 '<p>Solid symbols are positions a source gives. Dashed symbols are interpolated or the last position on record. A question mark means low confidence.</p>'+
 '<p>Symbols are blue for the Americans and red for the Hessian and British garrison. On his own sketch Wiederhold drew the Hessians in blue and the Americans in orange.</p>'+
 '<p>The current map is a simplified drawing of OpenStreetMap streets, not live map tiles. Satellite and terrain views are not in this prototype.</p>'+
 '<p>The map is drawn with MapLibre GL JS.</p></details>'}
var panelKey='';
function renderPanel(sc){
  var me=sel?sc.filter(function(o){return o.tr.id===sel})[0]:null;
  var key=base+'|'+(sel?sel+'|'+(me?me.s.k.id+me.s.kind:'x'):'now|'+((phase()||{id:0}).id)+'|'+sc.map(function(o){return o.tr.id+(o.drawn?1:0)+o.s.kind+o.s.k.id}).join(','));
  if(key===panelKey) return; panelKey=key; var h='';
  if(sel){
    var tr=byId(sel);
    h+='<button class="back" id="back">&larr; All units</button><div class="who"><div class="side '+tr.side+'">'+(tr.side==='US'?'American':(tr.nation==='Great Britain'?'British':'Hessian'))+'</div><h2>'+esc(tr.name)+'</h2>';
    h+='<div class="meta">'+[tr.cmd,tr.str].filter(Boolean).map(esc).join(' &middot; ')+'</div></div>';
    if(!me){h+='<div class="state unplaced"><b>Not in the data at '+fmt(t)+'</b>Move the time to see this unit.</div>'}
    else{var K=KIND[me.s.kind];
      h+='<div class="state '+(me.s.kind==='offsketch'?'unplaced':me.s.kind)+'"><b>'+K[0]+'</b>'+K[1]+'</div>';
      if(me.s.kind==='moving'){h+=rowHtml(me.s.k,'Heading to');if(me.s.from)h+=rowHtml(me.s.from,'Coming from')}
      else h+=rowHtml(me.s.k,me.s.kind==='after'?'Last record':'Current record');}
  } else {
    var p=phase(); h+='<div class="eyebrow">'+esc(p?'Now: '+p.name:B.opening.label)+'</div><p class="phase">'+esc(p?p.text:B.opening.text)+'</p>';
    [['US',SIDE.US],['CR',SIDE.CR]].forEach(function(sd){var L=sc.filter(function(o){return o.tr.side===sd[0]&&o.drawn});if(!L.length)return;
      h+='<h3>'+sd[1]+' on the map</h3><ul class="ulist">';
      L.forEach(function(o){h+='<li><button data-pick="'+o.tr.id+'"><span class="sd '+sd[0]+'"></span><span class="nm">'+esc(o.tr.label)+'</span><span class="ac">'+esc(o.s.kind==='moving'?'Moving (interpolated)':o.s.kind==='after'?'Last recorded position':o.s.k.act)+'</span></button></li>'});h+='</ul>'});
    var nd=sc.filter(function(o){return !o.drawn});
    if(nd.length){h+='<h3>'+(base==='sk'?'Not on the sketch or not placed':'Not placed right now')+'</h3><ul class="nd">';nd.forEach(function(o){h+='<li><b>'+esc(o.tr.label)+'</b>: '+esc(o.s.k.act)+(o.s.kind==='offsketch'?' (off the sketch)':'. No position on record.')+'</li>'});h+='</ul>'}
    h+='<p class="meta" style="margin-top:14px">Tap a unit for its source and how sure the position is.</p>'+about();
  }
  panel.innerHTML=h; if(sel) panel.scrollTop=0;
}
function select(id){sel=id||null;panelKey='';mv.kick()}

/* ---------- map, time, controls ---------- */
var WORLDS={mod:{toLL:B.toLL,ext:B.ext,mPerUnit:1,maxScale:8,minFactor:0.9},
            sk:{toLL:skLL,ext:[0,0,SK.size[0],SK.size[1]],mPerUnit:SKK*40075016.686/360,maxScale:3,minFactor:0.9}};
var mv,clk;
try{ mv=WM.mapView({container:'map',wrap:wrap,world:'mod',worlds:WORLDS,
  onDraw:draw,onPick:select,onUserMove:function(){if(follow)setFollow(false)},onResize:function(){if(follow)mv.jump(target())},
  onStep:function(ts){var more=clk.step(ts);if(follow&&mv.chase(target(),0.16))more=true;return more}});
}catch(err){WM.noMap(wrap,err);return}
S=mv.S;
function paintTime(v){t=v;var c=WM.calOf(B.cal,t);$('clock').textContent=c.clock;$('clockdate').textContent=c.date;WM.paintDayNumber(c.n);$('clocknote').hidden=t<465;
  $('done').style.width=(t2u(t)*100)+'%'; var p=phase();
  Array.prototype.forEach.call(document.querySelectorAll('.tl .ev'),function(e){e.classList.toggle('on',!!p&&+e.dataset.t===p.t)})}
clk=WM.clock({T0:T0,T1:T1,mv:mv,toRange:function(v){return Math.round(t2u(v)*1000)},fromRange:function(v){return u2t(v/1000)},
  rate:function(v){return v<TM?18:3},onTime:paintTime,   // the march plays six times as fast as the fight
  arrow:function(dir,v){return v+dir*((dir>0?v<TM:v<=TM)?5:1)},wheel:function(dd,v){return u2t(Math.max(0,Math.min(1,t2u(v)+dd*0.00022)))},
  onKey:function(e){if(e.key==='Escape')select(null);else if(e.key==='n'||e.key==='N')setNames(!names)}});

/* timeline furniture */
(function(){var tl=$('tl'),pc=function(m){return (t2u(m)*100)+'%'},h='';
  $('win').style.left=pc(TM);$('win').style.width=((1-UM)*100)+'%';
  [180,240,300,360,420].forEach(function(m){h+='<span class="tick" style="left:'+pc(m)+'"></span>'+(m%120===60?'':'<span class="tk minor" style="left:'+pc(m)+'">'+fmt(m).replace(' a.m.','')+'</span>')});
  for(var m=450;m<=600;m+=15){h+='<span class="tick" style="left:'+pc(m)+'"></span>';if(m%30===0)h+='<span class="tk'+(m%60?' minor':'')+'" style="left:'+pc(m)+'">'+fmt(m).replace(' a.m.','')+'</span>'}
  B.events.forEach(function(e){h+='<button class="ev'+(e.quiet?' mute':'')+'" data-t="'+e.t+'" style="left:'+pc(e.t)+'" title="'+esc(e.name)+'" aria-label="'+esc(e.name)+'">'+esc(e.name)+'</button>'});
  tl.insertAdjacentHTML('afterbegin',h);
  tl.addEventListener('click',function(ev){var b=ev.target.closest('.ev');if(b){clk.setPlaying(false);clk.setTime(+b.dataset.t)}});
})();
$('bFollow').addEventListener('click',function(){setFollow(!follow)});
$('bNames').addEventListener('click',function(){setNames(!names)});
$('bMod').addEventListener('click',function(){setBase('mod')});
$('bSk').addEventListener('click',function(){setBase('sk')});
$('zin').addEventListener('click',function(){setFollow(false);mv.zoomBy(1.5)});
$('zout').addEventListener('click',function(){setFollow(false);mv.zoomBy(1/1.5)});
WM.panelClicks(panel,select);

/* ---------- start ---------- */
try{if(localStorage.getItem('trenton.names')==='0'){names=false;$('bNames').setAttribute('aria-pressed','false')}}catch(_){ }
mv.start(function(){buildBase();paintTime(T0);setBase('mod');clk.setTime(T0);WM.hint(mv)});
window.__tr={setTime:clk.setTime,setBase:setBase,get view(){return {s:mv.scale()}},select:select,setFollow:setFollow,setNames:setNames,mv:mv};
})();
</script>
