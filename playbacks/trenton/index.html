","text":"At Birmingham Greene takes the upper road and Sullivan the River Road.","steps":["T04"],"sources":["S21","S22","S28","S59","S63"]},{"id":"TE06","start":"1776-12-26T07:30","end":"1776-12-26T08:00","at":"1776-12-26T07:45","name":"First shots","text":"Greene's advance drives in Lt. Wiederhold's picket on the Pennington road.","steps":["T19","T06"],"sources":["S20","S21","S36","S59","S22"],"battle":"TREN"},{"id":"TE07","start":"1776-12-26T07:48","end":"1776-12-26T08:03","at":"1776-12-26T07:56","name":"Sullivan's attack","text":"About three minutes later the lower column strikes the jäger picket at the Hermitage.","quiet":true,"steps":["T22","T08"],"sources":["S20","S21"],"battle":"TREN"},{"id":"TE08","start":"1776-12-26T07:50","end":"1776-12-26T08:10","at":"1776-12-26T08:00","name":"Guns open","text":"Forrest's and Hamilton's batteries open from the head of King and Queen Streets.","quiet":true,"steps":["T24","T25"],"sources":["S21","S22","S24"],"battle":"TREN"},{"id":"TE15","start":"1776-12-26T08:05","end":"1776-12-26T08:25","at":"1776-12-26T08:15","name":"Escape over the bridge","text":"The jägers and the twenty British dragoons get away over the Assunpink bridge before Sullivan's men reach it.","quiet":true,"steps":["T23"],"sources":["S59","S61"],"battle":"TREN"},{"id":"TE10","start":"1776-12-26T08:10","end":"1776-12-26T08:25","at":"1776-12-26T08:18","name":"Line of battle","text":"The three Hessian regiments form a line along the east edge of the village.","steps":["T37","T38","T61"],"sources":["S36"],"battle":"TREN"},{"id":"TE09","start":"1776-12-26T08:10","end":"1776-12-26T08:35","at":"1776-12-26T08:23","name":"Hessian guns taken","label":"Guns taken","text":"The Rall regiment's two guns are lost on King Street, just north of the headquarters.","quiet":true,"steps":["T34","T35"],"sources":["S21","S36","S59"],"battle":"TREN"},{"id":"TE11","start":"1776-12-26T08:25","end":"1776-12-26T09:00","at":"1776-12-26T08:38","name":"Rall shot","text":"Rall leads two regiments back into the town and is mortally wounded on Queen Street.","steps":["T39","T40"],"sources":["S21","S22","S36"],"battle":"TREN"},{"id":"TE12","start":"1776-12-26T08:45","end":"1776-12-26T10:00","at":"1776-12-26T08:50","name":"Surrender in the orchard","label":"Surrender","text":"Lt. Col. Scheffer surrenders the Rall and von Lossberg regiments in the orchard east of the town.","steps":["T41","T42","T43"],"sources":["S20","S21","S22","S36","S59"],"battle":"TREN"},{"id":"TE13","start":"1776-12-26T09:00","end":"1776-12-26T10:30","at":"1776-12-26T09:05","name":"Knyphausen surrenders","text":"The Knyphausen regiment, cut off from the bridge, surrenders by the Assunpink a quarter mile away, shortly after the others. About fifty men get over the creek.","quiet":true,"steps":["T50","T51"],"sources":["S21","S33","S36","S59","S61"],"battle":"TREN"},{"id":"TE16","start":"1776-12-26T09:15","end":"1776-12-26T11:30","at":"1776-12-26T10:30","name":"The escapers get away","text":"The British dragoons reach Princeton, the jägers Bordentown, and about fifty men of the Knyphausen regiment, who forded the Assunpink, make for Crosswicks. Some 400 to 600 of the garrison got away in all.","quiet":true,"steps":["T62","T63","T65"],"sources":["S20","S21","S59","S61"],"battle":"TREN"}],"sources":{"S20":{"title":"Washington to John Hancock, 27 December 1776","author":"George Washington","date":"1776-12-27","citation":"Papers of George Washington, Revolutionary War Series, vol. 7; Founders Online","type":"Primary: commander's report","url":"https://founders.archives.gov/documents/Washington/03-07-02-0355","rights":"Letter text public domain. Editors' notes are modern: facts only"},"S21":{"title":"The Battles of Trenton and Princeton","author":"William S. Stryker","date":"1898","citation":"Boston: Houghton, Mifflin, 1898. Pages 84-233 read","type":"Early secondary, printing primary documents","url":"https://archive.org/details/BattlesOfTrentonAndPrinceton","rights":"Public domain"},"S2
