139), Saumarez \"about one o'clock\" (S143), Greene \"about twelve\" (S140): the row keeps half an hour either side (GH01).","location":{"source":"map_read","basis":"Read from Hatch's plan No. 3 (S138), in the pixels of the plate, and laid on the ground by the park boundary of 1971 against today's boundary on the USGS Topo base map (S147): pipeline/guilford_geo.py. Boundaries fit to about 15 m; Hatch's own creeks and road lie up to 70 m from today's survey, so the unit is good to about 75 m and no better than his judgement.","confidence":"low","precision_m":75},"sources":["S138","S144","S139"],"review":"Needs review","battle":"GUIL"},{"id":"GP212","start":["1781-03-15T14:38","1781-03-15T15:38"],"end":["1781-03-15T15:15","1781-03-15T16:15"],"show":["1781-03-15T15:08","1781-03-15T15:45"],"at":[[-79.841608,36.134096]],"activity":"Two 3-pounders on the rise where the road leaves the woods: grapeshot into the melee","place":"The great road, west of the vale","quote":"S139: \"The enemy's cavalry was soon repulsed by a well-directed fire from two three pounders just brought up by Lieutenant MacLeod\". S141: Cornwallis \"ordered his artillery to fire, sacrificing the fugitives to check the pursuit\". S144, p. 107: the story that he fired on his own men by design is doubted.","method":"stated","confidence":"low","time_basis":"Clock from the staff ride's maps and chronology (S144, pp. 89-113, 153): the British advance 1300, the first line breaks 1315, the second line 1330 to 1430, the third line 1445 to 1530. Cornwallis has the action begin \"about half an hour past one\" (S139), Saumarez \"about one o'clock\" (S143), Greene \"about twelve\" (S140): the row keeps half an hour either side (GH01).","location":{"source":"map_read","basis":"Read from Hatch's plan No. 5 (S138), in the pixels of the plate, and laid on the ground by the park boundary of 1971 against today's boundary on the USGS Topo base map (S147): pipeline/guilford_geo.py. Boundaries fit to about 15 m; Hatch's own creeks and road lie up to 70 m from today's survey, so the unit is good to about 75 m and no better than his judgement.","confidence":"low","precision_m":75},"sources":["S138","S144","S139","S141"],"notes":"GH08.","review":"Needs review","battle":"GUIL"}]}],"events":[{"id":"GCE01","start":"1781-03-15T05:30","end":"1781-03-15T08:20","at":"1781-03-15T08:02","name":"Cornwallis marches on Guilford","label":"Cornwallis marches","text":"Cornwallis leaves his camp near Deep River Friends Meeting House at daybreak, sending his baggage away under guard. Tarleton leads with the Legion cavalry, the Guards light infantry and the jägers. Greene's army is at Guilford Courthouse, twelve miles off; Lee's Legion and Campbell's riflemen are out on the road.","steps":["GP100","GP20","GP01"],"sources":["S138","S139","S142","S143"],"battle":"GUIL"},{"id":"GCE02","start":"1781-03-15T06:30","end":"1781-03-15T09:00","at":"1781-03-15T08:40","name":"Lee charges in the lane","label":"The lane","text":"Lee's cavalry, falling back before Tarleton's, turns in a fenced lane and rides down his leading section. Tarleton sounds the retreat and leaves the road. The hour is disputed.","steps":["GP21","GP111"],"sources":["S138","S141","S142","S144"],"battle":"GUIL"},{"id":"GCE03","start":"1781-03-15T06:45","end":"1781-03-15T09:15","at":"1781-03-15T09:00","name":"The Guards fire at New Garden Meeting House","label":"New Garden","text":"Lee, following by the meeting house to cut Tarleton off, rides into the Guards light infantry, who fire a volley; his horse throws him. The Legion infantry and Campbell's riflemen come up and the fight becomes general.","steps":["GP22","GP120","GP125","GP31","GP41","GP112"],"sources":["S138","S141","S142","S144"],"battle":"GUIL"},{"id":"GCE04","start":"1781-03-15T07:15","end":"1781-03-15T10:30","at":"1781-03-15T09:35","name":"The 23rd comes up; Lee draws off","label":"Lee draws off","text":"The head of the British column, the 23rd Foot, arrives. Lee falls back to the cross road, covers his infantry with the cavalry and retires up the great road to the army, unpursued. Each side has lost perhaps 40 men.","steps":["GP23","GP32","GP42","GP130","GP113","GP101"],"sources":["S138","S141","S142","S144"],"battle":"GUIL"},{"id":"GCE05","start":"1781-03-15T06:00","end":"1781-03-15T11:30","at":"1781-03-15T10:45","name":"Greene forms three lines","label":"Three lines","text":"Greene posts the North Carolina militia behind a rail fence at the edge of the woods, the Virginia militia in the woods 300 yards behind, and the Continentals on the high ground west of the courthouse, with riflemen and cavalry on each flank of the first line and two guns in the road.","steps":["GP02","GP03","GP04","GP05","GP06","GP07","GP08","GP09","GP10","GP11","GP12","GP13","GP14","GP15"],"sources":["S138","S140","S143","S144"],"battle":"GUIL"},{"id":"GCE06","start":"1781-03-15T12:00","end":"1781-03-15T13:30","at":"1781-03-15T12:35","name":"Cannonade; the British deploy","label":"Cannonade","text":"As the British column crosses Little Horsepen Creek, Singleton's 6-pounders open on it from the road. Macleod's guns answer for about half an hour while Cornwallis forms line: Webster's brigade left of the road, Leslie's right, the Guards in support, the cavalry in the road.","steps":["GP102","GP210","GP04","GP140","GP150","GP160","GP170","GP180","GP190","GP114"],"sources":["S138","S139","S141","S143","S144"],"battle":"GUIL"},{"id":"GCE07","start":"1781-03-15T12:30","end":"1781-03-15T13:45","at":"1781-03-15T13:13","name":"The first line breaks","label":"First line breaks","text":"The British cross the muddy fields. The North Carolinians fire at 140 yards, some a second time; the British fire once at close range and charge. Most of the militia run. On both flanks the riflemen and light troops hold and fire into the ends of the British line.","steps":["GP141","GP151","GP161","GP171","GP16","GP17"],"sources":["S138","S139","S140","S143","S144"],"battle":"GUIL"},{"id":"GCE08","start":"1781-03-15T13:00","end":"1781-03-15T14:15","at":"1781-03-15T13:32","name":"The flanks pull the British line apart","label":"Flanks","text":"Webster turns the 33rd, the jägers and the Guards light infantry against Lynch, Kirkwood and Washington; Leslie turns von Bose and the 1st Guards against Campbell and Lee. The 2nd Guards and the grenadiers come into the line by the road. Every British foot soldier is now engaged.","steps":["GP142","GP128","GP123","GP172","GP181","GP19","GP50","GP51","GP44","GP34"],"sources":["S138","S139","S144"],"battle":"GUIL"},{"id":"GCE09","start":"1781-03-15T13:15","end":"1781-03-15T14:45","at":"1781-03-15T13:50","name":"The second line: the Virginians hold, then break","label":"Second line","text":"In thick woods the Virginia militia fight for the better part of an hour. Lawson's brigade north of the road gives way first; Stevens's holds against the 71st until he is shot through the thigh and orders it off.","steps":["GP08","GP09","GP152","GP201","GP191","GP162","GP52","GP53"],"sources":["S138","S140","S143","S144"],"battle":"GUIL"},{"id":"GCE10","start":"1781-03-15T13:30","end":"1781-03-15T16:00","at":"1781-03-15T14:20","name":"The separate fight in the south","label":"Fight in the south","text":"Von Bose and the 1st Guards follow Campbell's riflemen and Lee's infantry south-east through the woods, a mile from the road. The Guards battalion is broken on a wooded height and rallies behind the Hessians. Neither commander knows how this fight is going.","steps":["GP173","GP182","GP45","GP35"],"sources":["S138","S142","S143","S144"],"battle":"GUIL"},{"id":"GCE11","start":"1781-03-15T14:15","end":"1781-03-15T15:15","at":"1781-03-15T14:46","name":"Webster attacks the third line and is thrown back","label":"Webster repulsed","text":"Webster, first out of the woods, crosses the vale with the 33rd and the light troops against the Continental right. The 1st Maryland, Hawes's Virginians and Kirkwood meet him with a close volley and drive him back across the vale. He is mortally wounded.","steps":["GP143","GP129","GP124","GP59","GP11","GP55","GP54"],"sources":["S138","S141","S143","S144"],"battle":"GUIL"},{"id":"GCE12","start":"1781-03-15T14:30","end":"1781-03-15T15:30","at":"1781-03-15T15:02","name":"The 2nd Guards break the 2nd Maryland","label":"2nd Maryland breaks","text":"The 2nd Battalion of Guards charges the left of the Continental line. The 2nd Maryland, new levies, gives way almost without firing, and the Guards take Singleton's two guns and press on behind the line. Greene, seeing his left turned, orders the retreat.","steps":["GP193","GP62","GP18","GP64"],"sources":["S138","S139","S140","S144"],"battle":"GUIL"},{"id":"GCE13","start":"1781-03-15T14:40","end":"1781-03-15T15:40","at":"1781-03-15T15:07","name":"Washington and the 1st Maryland strike the Guards","label":"Counterattack","text":"Washington's dragoons ride through the Guards from behind while the 1st Maryland, facing about, fires into their flank and closes with the bayonet. Lt. Col. Stuart is killed, the guns are retaken, and the Guards are driven back into the open field.","steps":["GP57","GP60","GP194"],"sources":["S138","S139","S140","S141","S144"],"battle":"GUIL"},{"id":"GCE14","start":"1781-03-15T14:45","end":"1781-03-15T15:45","at":"1781-03-15T15:14","name":"Cornwallis's guns stop the pursuit","label":"Grapeshot","text":"From the rise where the road leaves the woods Cornwallis has two 3-pounders fire grapeshot into the melee. It checks the Americans. The 23rd and 71st come out of the woods, and O'Hara, though wounded, rallies the Guards on the grenadiers. Whether he fired knowingly into his own Guards, over O'Hara's protest, is disputed (GH08).","steps":["GP212","GP222","GP153","GP163","GP202","GP58","GP61"],"sources":["S138","S139","S141","S144"],"battle":"GUIL"},{"id":"GCE15","start":"1781-03-15T15:00","end":"1781-03-15T16:00","at":"1781-03-15T15:32","name":"Greene retreats by the Reedy Fork road","label":"Retreat","text":"The Continentals go off in good order, Green's regiment and Washington covering. Hawes's regiment, the last engaged, checks the 33rd. The four guns are left, their horses killed. The British follow a short way and stop: Greene halts three miles off at the Reedy Fork, then marches to the iron works on Troublesome Creek.","steps":["GP145","GP154","GP164","GP63","GP72","GP77","GP78"],"sources":["S138","S139","S140","S144"],"battle":"GUIL"},{"id":"GCE16","start":"1781-03-15T15:15","end":"1781-03-15T16:15","at":"1781-03-15T15:52","name":"Tarleton's last charge","label":"Last charge","text":"Hearing fire still on the right, Cornwallis sends Tarleton there with a squadron. Lee has already drawn his Legion off towards the courthouse. Tarleton charges the riflemen who remain and scatters them: the last fight of the day.","steps":["GP117","GP45","GP173","GP182","GP26","GP36"],"sources":["S138","S141","S142","S143","S144"],"battle":"GUIL"}],"sources":{"S135":{"title":"An accurate map of North and South Carolina with their Indian frontiers","author":"Henry Mouzon and others; engraved by Samuel Turner Sparrow; published by Robert Sayer and John Bennett","date":"1775","citation":"Henry Mouzon and others, An Accurate Map of North and South Carolina with Their Indian Frontiers ... London: Robert Sayer and J. Bennett, 30 May 1775. 1 map on 2 sheets, 101 x 142 cm. Library of Congress, Geography and Map Division, G3900 1775 .M61 (LCCN 74692510); the copy scanned is g3900.ar139404 (16,912 x 12,132 pixels).","type":"Period map: printed map of both provinces at about 1:530,000 (69 1/2 miles to a degree), with insets of Port Royal and Charleston harbours","url":"https://www.loc.gov/item/74692510/","rights":"Published 1775. Public domain; the Library of Congress gives its digitized maps as free to use and reuse (\"Library of Congress, Geography and Map Division\")."},"S138":{"title":"Guilford Courthouse National Military Park: The Battle of Guilford Courthouse","author":"Charles E. Hatch, Jr.","date":"1971","citation":"Charles E. Hatch, Jr., The Battle of Guilford Courthouse (Washington: National Park Service, Office of History and Historic Architecture, Eastern Service Center, July 1971), ix + 163 pp., 15 plates and 5 battle plans. Report FNP-HH-72-106; NTIS PB-208 056.","type":"Modern secondary: National Park Service documented narrative with five troop movement plans","url":"https://archive.org/details/guilfordcourthou00hatc","rights":"U.S. government work (National Park Service; the last plan carries a Government Printing Office imprint of 1976). The Internet Archive marks its scan public domain. The five plans are hosted, reduced."},"S139":{"title":"Cornwallis to Lord George Germain, Guilford, 17 March 1781 (dispatch No. 8: report of the battle)","author":"Lt. Gen. Charles, Earl Cornwallis","date":"1781-03-17","citation":"Cornwallis to Germain, 17 March 1781; printed in Tarleton, History of the Campaigns of 1780 and 1781 (London, 1787), pp. 311-320, with the field return. Read as quoted in Hatch (S138), pp. 21, 30, 44, 55-56, 58-59, 73-74, 91-92, 96, and in Skinner (S144), pp. 119-120.","type":"Primary: commander's report, two days after the battle","url":"https://archive.org/details/guilfordcourthou00hatc","rights":"Public domain (1781). Read in U.S. government publications."},"S140":{"title":"Greene to Samuel Huntington, President of Congress, camp at the iron works, 16 March 1781; and his letters of 16 to 20 March","author":"Maj. Gen. Nathanael Greene","date":"1781-03-16","citation":"Greene to Huntington, 16 March 1781 (printed in Tarleton, 1787, pp. 322 ff.); Greene to Jefferson, 16 March; to Nash and to Washington, 18 March; to Morgan, 20 March. Read as quoted in Hatch (S138), pp. 26 n. 15, 29-30, 35, 37, 47, 54-55, 57, 70, 74-75, 83-84.","type":"Primary: commander's report, the day after the battle","url":"https://archive.org/details/guilfordcourthou00hatc","rights":"Public domain (1781). Read in a U.S. government publication."},"S141":{"title":"Memoirs of the War in the Southern Department (the Guilford passages); and The Campaign of 1781 in the Carolinas","author":"Lt. Col. Henry Lee; Henry Lee, Jr.","date":"1812; 1824","citation":"Henry Lee, Memoirs of the War in the Southern Department of the United States (1812; New York, 1869 edition), pp. 270-285; Henry Lee [Jr.], The Campaign of 1781 in the Carolinas (Philadelphia, 1824), pp. 167-196. Read as quoted in Hatch (S138), pp. 22-28, 36-39, 41-43, 50, 59, 66, 75-76, 80, 85-89, 93, and in Skinner (S144), pp. 74-75.","type":"Primary: participant, written thirty years later","url":"https://archive.org/details/guilfordcourthou00hatc","rights":"Public domain."},"S142":{"title":"A History of the Campaigns of 1780 and 1781, in the Southern Provinces of North America (the Guilford passages)","author":"Lt. Col. Banastre Tarleton","date":"1787","citation":"Banastre Tarleton, A History of the Campaigns of 1780 and 1781 (London: T. Cadell, 1787), pp. 277-286. Read as quoted in Hatch (S138), pp. 21-22, 26-27, 34-35, 38, 43, 45-46, 56, 77, 85, 87-88, and in Skinner (S144), p. 76.","type":"Primary: the British cavalry commander's own account, published six years later","url":"https://archive.org/details/bim_eighteenth-century_a-history-of-the-campaig_tarleton-lieutenant-gen_1787","rights":"Public domain (1787)."},"S143":{"title":"Eyewitness accounts of Guilford Courthouse printed in Hatch (1971)","author":"William Seymour; Samuel Houston; St. George Tucker; Roger Lamb; Thomas Saumarez; Dugald Stuart; James Martin; Charles Magill; Charles Stedman; the British orderly book","date":"1781 to 1856","citation":"As quoted in Hatch (S138): Sgt. Maj. William Seymour, Journal of the Southern Expedition (pp. 23-24, 32, 43, 65-66); Samuel Houston, journal, in Foote, Sketches of Virginia, 2nd series, 1856 (pp. 33, 52, 62-63, 89); Lt. Col. St. George Tucker to his wife, 18 March 1781 (pp. 44, 61, 92); Sgt. Roger Lamb, 1809 (pp. 28, 51, 60); Lt. Thomas Saumarez, 23rd Foot (pp. 47-48, 58, 91); Capt. Dugald Stuart, 71st (p. 52); Col. James Martin (pp. 53, 70); Charles Magill to Jefferson, 16 March 1781 (pp. 43, 54, 93); Charles Stedman, History of the American War, 1794 (pp. 49, 59, 63-66, 87, 96-98); \"A British Orderly Book\", N.C. Historical Review 9 (p. 22).","type":"Primary: journals, letters and memoirs of men in both armies, and the British order of march","url":"https://archive.org/details/guilfordcourthou00hatc","rights":"Public domain. Read in a U.S. government publication."},"S144":{"title":"A Game of Hare & Hounds: An Operational-level Command Study of the Guilford Courthouse Campaign, 18 January-15 March 1781","author":"Harold Allen Skinner, Jr.","date":"2021","citation":"Harold Allen Skinner, Jr., A Game of Hare & Hounds (Quantico, Va.: Marine Corps University Press, 2021), xx + 160 pp., 24 maps. ISBN 978-1-7320031-6-3; LCCN 2020057234. Maps by Charles D. Collins, Jr., Army University Press.","type":"Modern secondary: Marine Corps University Press staff ride handbook, with maps by the Army University Press","url":"https://www.usmcu.edu/Outreach/Marine-Corps-University-Press/Books-by-topic/MCUP-Titles-A-Z/A-Game-of-Hare-or-Hounds/","rights":"The press's disclaimer says its works are made by U.S. government employees in their official duties and are not eligible for copyright in the United States, and warns that some may carry other people's material. Cited and linked; no page of it is hosted."},"S145":{"title":"Cultural Landscape Report: Guilford Courthouse National Military Park","author":"John Hiatt","date":"2003","citation":"John Hiatt, Cultural Landscape Report: Guilford Courthouse National Military Park (Atlanta: National Park Service, Southeast Regional Office, Cultural Resources Division, 2003).","type":"Modern secondary: National Park Service landscape study","url":"https://archive.org/details/culturallandscap00hiat","rights":"U.S. government work (National Park Service). The Internet Archive marks its scan public domain. as":[],"credit":""},"links":[{"kind":"previous","playback":"cowpens","title":"Battle of Cowpens, 17 January 1781","label":"Battle of Cowpens","from":"1781-01-17T06:00","to":"1781-01-17T08:30","at":"1781-01-17T08:30","unit":"minute","chapter":"hist-340-sc"}],"reconstructions":[{"id":"sc-1775","title":"The Carolinas, 1775 to 1781: a WarMapper reconstruction","label":"1775 (reconstructed)","about":"This is a WarMapper reconstruction, not a period map. Its lines are those of Henry Mouzon's map of the two Carolinas (1775), laid on today's ground: the rivers and the sea coast fitted to today's courses, which they keep, and the main roads and boundary lines carried with them. Mouzon's map was made for the colonies' trade and land grants, not as a survey: his roads are good to a few kilometres, his up-country less. South Carolina is traced at the level of its main lines; North Carolina (since 27 Nov 2026) only for the ground of the campaign of 1781, from Charlotte and Salisbury to Guilford, Hillsborough, Halifax and the Dan; north of the Dan (36.75 N to 37.6 N) the lines are Fry and Jefferson's map of Virginia (1751): its main rivers and the Great Wagon Road. Nothing here has been checked by a historian.","note":"Rivers and coast good to about 1-2 km where today's river is in Natural Earth; roads and boundaries to 3-5 km; the far north-west to no better than 10 km. In North Carolina nine towns hold the fit, each found again 1.3-6.6 km from its site when left out. Not yet traced: inlets, islands and sounds, swamps, the lesser roads, ferries and fords; in North Carolina the Neuse, the Tar and the sounds (east of 77 W, beyond the sheet), the rivers and roads of the mountains and of the east, and Mouzon's towns other than those named. Guilford Court House is not on Mouzon's map (it was built in 1774): its name is placed where the battle's playback has it. Southern Virginia: Fry and Jefferson's rivers are good to about 1-3 km where today's river is in Natural Earth (the Staunton, Meherrin, Nottoway), the Banister, the Appomattox and the Great Wagon Road to about 5 km; they draw almost no other roads there, and nothing at the Dan ferries of 1781.","credit":"WarMapper reconstruction from Mouzon, 1775 (Library of Congress), fitted with Natural Earth; North Carolina checked against Collet, 1770, and southern Virginia from Fry and Jefferson, 1751 (Library of Congress)","style":"period-1899","made":"2026-11-25","review":"Needs review","file":"data/recon/sc-1775.geojson","sheet":[-83.45,31.95,-77.0,37.6],"layers":[{"id":"rivers","title":"Rivers, as Mouzon draws them (1775), fitted to today's courses","kind":"stream","source":"S135","link":"https://www.loc.gov/item/74692510/","link_label":"Mouzon 1775 (Library of Congress)","method":"traced","confidence":"medium","from":"1775-01-01","to":"1781-12-31","how":"Picked by hand every 50-100 pixels of a half-resolution crop and snapped by program to the engraved line; fitted to the ground by matching them to today's rivers (Natural Earth). Rivers with no line in Natural Earth (Pacolet, Tyger, Enoree, Black, Ashley, Combahee), and since the refit of 26 Nov 2026 the Pee Dee, Little Pee Dee and Waccamaw, follow the fit and are low. Each river is one line, joined across the strips where the scan's mounted sections meet (2-6 km). North Carolina (27 Nov 2026): the Catawba and Broad above the 1772 line, the Yadkin to the Pee Dee, the Haw with Reedy Fork and Troublesome Creek, the Deep, the Cape Fear, the Dan and the Roanoke, picked and snapped the same way and matched to Natural Earth (Reedy Fork and Troublesome Creek, which it lacks, follow the fit and are low). Southern Virginia (27 Nov 2026, evening): the Staunton, Banister, Meherrin, Nottoway and Appomattox from Fry and Jefferson (S152), north of 36.75 N, picked and snapped the same way; the Staunton, Meherrin and Nottoway matched to Natural Earth.","review":"Needs review","features":36},{"id":"coast","title":"The sea coast, as Mouzon draws it, and the sea","kind":"shore","source":"S135","link":"https://www.loc.gov/item/74692510/","link_label":"Mouzon 1775 (Library of Congress)","method":"traced","confidence":"low","from":"1775-01-01","to":"1781-12-31","how":"The outer coast snapped to the engraved line and fitted to today's coast. Inlets, islands and the sounds behind them are not traced yet: the sea is closed across the harbour mouths. North Carolina (27 Nov 2026): the outer coast from Little River past Cape Fear to Bogue, to the sheet's edge at 77 W; the sea is closed across the inlets and the mouth of the Cape Fear.","review":"Needs review","features":7},{"id":"roads","title":"The main roads of 1775, as Mouzon draws them","kind":"road","source":"S135","link":"https://www.loc.gov/item/74692510/","link_label":"Mouzon 1775 (Library of Congress)","method":"traced","confidence":"low","from":"1775-01-01","to":"1781-12-31","how":"Re-traced 26 Nov 2026: snapped by program to the gap between Mouzon's double lines from end to end and checked by eye; ends joined to the road or town where Mouzon has them meet. Within about 1 km at the towns the fit holds (Camden, Orangeburg, Charles Town, Georgetown, Dorchester, Beaufort, Ninety Six, Long Bluff), about 3-5 km between them. North Carolina (27 Nov 2026): ten roads of the 1781 campaign's ground, snapped the same way: Charlotte and Camden to Salisbury, the Trading Path to Hillsborough, the road by the Quaker meeting houses to Guilford and the Haw, Salem towards the Dan, the Shallow Ford road, Hillsborough to Halifax and north towards the Dan, Salisbury to Oliphant's Mill. Checked against Collet 1770 (S151). Southern Virginia (27 Nov 2026, evening): the Great Wagon Road, Fry and Jefferson's \"Road from the Yadkin\" (S152), from Looney's Ferry to 36.75 N.","review":"Needs review","features":24},{"id":"boundaries","title":"The Cherokee boundary (to 20 May 1777) and the lines with North Carolina (1735-72)","kind":"boundary","source":"S135","link":"https://www.loc.gov/item/74692510/",
