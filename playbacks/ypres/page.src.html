<title>First Ypres Playback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="__APP__/vendor/maplibre-gl.css">
<link rel="stylesheet" href="__APP__/core.css">
<style>
/* First Ypres: one step per day; four nations. On a period sketch the unit colours and ink switch to ones that read on paper. */
:root{ --br:#124f93; --fr:#2f86c9; --be:#0f7f86; --ge:#b02a1c; --m-fill-al:#e6f0fb; --m-fill-ge:#fde6e1; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --br:#6ea8ea; --fr:#8fd0ff; --be:#5fd0d0; --ge:#f0897c; } }
:root[data-theme="dark"]{ --br:#6ea8ea; --fr:#8fd0ff; --be:#5fd0d0; --ge:#f0897c; }
.mapwrap.hist{--u-ink:#141a24;--u-halo:#fbf6e6;--br:#124f93;--fr:#1f6fb0;--be:#0f7f86;--ge:#b02a1c}
.mapwrap.hist .hint{display:none}
.ulab{font-size:12px} .ech{font-size:8.5px;letter-spacing:.05em}
.sd.br{background:var(--br)} .sd.fr{background:var(--fr)} .sd.be{background:var(--be)} .sd.ge{background:var(--ge)}
.who .side.br{color:var(--br)} .who .side.fr{color:var(--fr)} .who .side.be{color:var(--be)} .who .side.ge{color:var(--ge)}
.when .t{font-size:22px} .tl .tick{height:4px;opacity:.6} .tl .tick.maj{height:6px;opacity:1}
@media (max-width:860px){ .when .t{font-size:18px} }
</style>
<div class="app">
  <header class="bar gut">
    <div class="ttl">
      <h1>First Ypres, 1914</h1>
      <p>Corps and divisions day by day, from the Yser to the Lys</p>
    </div>
  </header>

  <main class="stage">
    <div class="mapwrap" id="mapwrap" tabindex="0" aria-label="Battle map. Scroll or pinch to zoom, drag to pan. To move through the days, scroll over the timeline or use the arrow keys.">
      <div id="map"></div>
      <svg id="ov" aria-hidden="true"></svg>
      <div class="ctl c-l">
        <div class="seg" role="group" aria-label="Base map">
          <button id="bNow" aria-pressed="true"><span class="lg">Current map</span><span class="sm">Now</span></button>
          <button id="b14" aria-pressed="false"><span class="lg">1914 map</span><span class="sm">1914</span></button>
          <button id="bDay" aria-pressed="false"><span class="lg">Sketch of the day</span><span class="sm">Daily</span></button>
        </div>
        <div class="seg" role="group" aria-label="Map view">
          <button id="vSal" aria-pressed="true"><span class="lg">Ypres salient</span><span class="sm">Salient</span></button>
          <button id="vAll" aria-pressed="false"><span class="lg">Whole front</span><span class="sm">All</span></button>
        </div>
        <button class="chipbtn" id="bNames" aria-pressed="true" title="Show or hide the names beside the unit symbols (N)"><span class="dot"></span><span>Names</span></button>
        <button class="chipbtn" id="bUnits" aria-pressed="true" title="Show or hide the units, to read the map underneath (U)"><span class="dot"></span><span>Units</span></button>
      </div>
      <div class="ctl c-r">
        <button class="sq" id="zin" aria-label="Zoom in">+</button>
        <button class="sq" id="zout" aria-label="Zoom out">&minus;</button>
      </div>
      <div class="when" id="when" aria-live="off"><div class="dayn" id="dayn" hidden></div><div class="t" id="clock">18 October 1914</div><div class="d" id="clocksub">Sunday &middot; at nightfall</div></div>
      <div class="scale" id="scale"></div>
      <div class="hint" id="hint">Scroll or pinch to zoom &middot; drag to pan &middot; scroll over the timeline to move through the days</div>
      <div class="credit" id="credit"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="tlbar gut">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 16 16" id="playico"><path d="M3 1.5v13l11-6.5z"/></svg></button>
    <div class="tl" id="tl">
      <div class="rail"></div><div class="done" id="done"></div>
      <input type="range" id="time" min="0" max="3500" step="1" value="0" aria-label="Day of the battle">
    </div>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>

<script src="__APP__/core.js"></script>
<script>
/* First Ypres, 1914. The shared core (core.js) runs the map, the clock and the controls; this script holds what is particular to this battle:
   where each formation is on a given day, how lines and symbols are laid out and drawn, the period sketches, and the side panel. */
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var $=WM.$,esc=WM.esc,chip=WM.chip,plen=WM.plen;
var T0=0,T1=D.days,HOLD=0.35,LINGER=2; // time is in days from 18 October; a whole number is nightfall on that day. A unit the sources stop following stays on the map, faded, for two days
var MAJOR={YE01:1,YE04:1,YE09:1,YE11:1,YE13:1,YE14:1};
var BEFORE="The Allies are pushing east from Ypres and along the Lys, expecting only cavalry in front of them. Four new German reserve corps are a day's march away.";
var wrap=$('mapwrap'),ov=$('ov'),panel=$('panel');
var target=null,preset='sal',t=T0,sel=null,names=true,units=true,base='now',sNow=0.03;
var HIST=D.hist,OSMC=WM.OSM_CREDIT;
var LODZ=0.05; // below this zoom a German division is hidden while its corps is drawn
function dateOf(n){var d=new Date(Date.UTC(1914,9,18+n));return {day:d.getUTCDate(),mon:WM.MONTHS[d.getUTCMonth()],wd:WM.WEEKDAYS[d.getUTCDay()]}}
function byId(id){for(var i=0;i<D.tracks.length;i++)if(D.tracks[i].id===id)return D.tracks[i]}
function nat(tr){return tr.side==='GE'?'ge':tr.nation==='France'?'fr':tr.nation==='Belgium'?'be':'br'}

/* The frame is metres east and south of the centre of Ypres. */
var F=D.frame;
function toLL(p){return [F.LON0+p[0]/F.KX,F.LAT0-p[1]/F.KY]}

/* ---------- where is a unit at time t ---------- */
function resample(g,n){if(g.length===1){var o=[];for(var i=0;i<n;i++)o.push(g[0]);return o}
  var L=plen(g),out=[g[0]],seg=1,acc=0;if(L<1){for(var j=1;j<n;j++)out.push(g[0]);return out}
  for(var k=1;k<n-1;k++){var want=L*k/(n-1);
    while(seg<g.length){var d=Math.hypot(g[seg][0]-g[seg-1][0],g[seg][1]-g[seg-1][1]);if(acc+d>=want){var f=d?(want-acc)/d:0;out.push([g[seg-1][0]+(g[seg][0]-g[seg-1][0])*f,g[seg-1][1]+(g[seg][1]-g[seg-1][1])*f]);break}acc+=d;seg++}}
  out.push(g[g.length-1]);return out}
function morph(a,b,f){ if(a.length===1&&b.length===1) return [[a[0][0]+(b[0][0]-a[0][0])*f,a[0][1]+(b[0][1]-a[0][1])*f]];

  if(d2<d1) B.reverse(); var o=[];for(var i=0;i<n;i++)o.push([A[i][0]+(B[i][0]-A[i][0])*f,A[i][1]+(B[i][1]-A[i][1])*f]);return o}
function ease(f){return f<0?0:f>1?1:f*f*(3-2*f)}
function stateAt(tr,tt){
  var ks=tr.k,n=ks.length; if(tt<ks[0].t0-HOLD) return null;
  for(var i=0;i<n;i++){
    var k=ks[i],nx=ks[i+1],s=k.t0-HOLD,e=k.t1;
    if(tt>=s&&tt<=e) return {k:k,g:k.g,kind:!k.g?'unplaced':k.method==='inferred'?'inferred':'stated'};
    if(nx&&tt>e&&tt<nx.t0-HOLD){
      var ms=Math.max(e,nx.t0-1),me=nx.t0-HOLD;            // the move takes the last day before the next record
      if(tt<ms) return (k.g&&tt<=e+LINGER)?{k:k,g:k.g,kind:'after'}:{k:k,g:null,kind:k.g?'lost':'unplaced'};
      if(k.g&&nx.g) return {k:nx,from:k,g:morph(k.g,nx.g,ease((tt-ms)/Math.max(0.01,me-ms))),kind:'moving'};
      if(k.g) return {k:k,g:k.g,kind:'after'};
      return {k:nx,g:null,kind:'unplaced'};
    }
  }
  var last=ks[n-1]; if(!last.g) return {k:last,g:null,kind:'unplaced'};
  return tt<=last.t1+LINGER?{k:last,g:last.g,kind:'after'}:{k:last,g:null,kind:'lost'};
}
function parentAt(tr,tt){var p=null,d=Math.ceil(tt-1e-6);tr.par.forEach(function(a){if(d>=a[0]&&d<=a[1])p=a});return p||tr.par[tr.par.length-1]||null}
function scene(){var out=[],drawn={};
  D.tracks.forEach(function(tr){var s=stateAt(tr,t);if(s){var o={tr:tr,s:s,drawn:!!s.g};out.push(o);if(o.drawn)drawn[tr.id]=1}});
  out.forEach(function(o){ if(!o.drawn||o.tr.side!=='GE'||o.tr.ech!=='division'||o.tr.id===sel) return; var p=parentAt(o.tr,t);
    if(p&&drawn[p[2]]&&sNow<LODZ){o.drawn=false;o.folded=p[2]} });
  return out}

/* ---------- view ---------- */
var EXT=[D.ext[0][0],D.ext[0][1],D.ext[1][0],D.ext[1][1]];
var BOX={sal:[-6600,-10600,15800,13800],all:[-13200,-34500,21500,15800]};
function cameraOf(p){return mv.cameraFor(BOX[p],{t:48,b:22,l:14,r:14})}
function setPreset(p,jump){preset=p;$('vSal').setAttribute('aria-pressed',p==='sal'?'true':'false');$('vAll').setAttribute('aria-pressed',p==='all'?'true':'false');
  if(!p){target=null;return} target=cameraOf(p); if(jump){mv.jump(target);target=null} mv.kick()}
function curHist(){ if(base==='m14') return HIST.A; if(base!=='day') return null; var d=Math.max(0,Math.ceil(t-1e-6)),ds=HIST.days;
  for(var i=0;i<ds.length;i++) if(d>=ds[i].d0&&d<=ds[i].d1) return ds[i]; return ds[ds.length-1]}
var lastCredit='';
function paintCredit(H){var c=!H?OSMC:(base==='m14'?'Sketch A, official history (1925) &middot; ':esc(H.sk)+', '+esc(H.label)+(Math.ceil(t-1e-6)>H.d1?' (the last one)':'')+' &middot; official history (1925) &middot; ')+OSMC;
  if(c!==lastCredit){lastCredit=c;$('credit').innerHTML=c}}
function setBase(b){base=b;[['bNow','now'],['b14','m14'],['bDay','day']].forEach(function(p){$(p[0]).setAttribute('aria-pressed',b===p[1]?'true':'false')});
  wrap.classList.toggle('hist',b!=='now'); if(b==='day') HIST.days.forEach(function(h){if(!h.pre){h.pre=new Image();h.pre.src=WM.asset(h.src)}}); panelKey='';mv.kick()}
function setUnits(v){units=v;$('bUnits').setAttribute('aria-pressed',v?'true':'false');mv.kick()}
function setNames(v){names=v;$('bNames').setAttribute('aria-pressed',v?'true':'false');try{localStorage.setItem('ypres.names',v?'1':'0')}catch(_){ }mv.kick()}

/* ---------- base map and period sketches ---------- */
function histBox(H){return [H.x0,H.y0,H.x0+H.w*H.res,H.y0+H.h*H.res]}
var histShown=null; // the sketch now on the map: one picture layer, re-pointed when the date calls for another sketch
function buildBase(){
  var W={m:[3.4,2.2],r:[2.9,1.7],s:[2.2,1.1]},f=[];
  D.woods.forEach(function(w){f.push(mv.poly(w[1],{k:'wood'}))});
  D.ways.forEach(function(w){var c=w[0];
    if(c==='w'){f.push(mv.line(w[2],{k:'water',w:(w[1]==='IJzer'||w[1]==='Lys')?3.6:2.6}));return}
    if(c==='x'){f.push(mv.line(w[2],{k:'oldcanal'}));return}
    var k=W[c]||W.s;f.push(mv.line(w[2],{k:'road',e:k[0],w:k[1]}))});
  mv.geo('base',f);
  var is=function(k){return ['==',['get','k'],k]},round={'line-cap':'round','line-join':'round'};
  mv.layer({id:'b-wood',type:'fill',source:'base',filter:is('wood'),paint:{'fill-color':'var(--wood)'}});
  mv.layer({id:'b-edge',type:'line',source:'base',filter:is('road'),layout:round,paint:{'line-color':'var(--road-edge)','line-width':['get','e']}});
  mv.layer({id:'b-road',type:'line',source:'base',filter:is('road'),layout:round,paint:{'line-color':'var(--road)','line-width':['get','w']}});
  mv.layer({id:'b-water',type:'line',source:'base',filter:is('water'),layout:round,paint:{'line-color':'var(--water)','line-width':['get','w']}});
  mv.layer({id:'b-oldcanal',type:'line',source:'base',filter:is('oldcanal'),paint:{'line-color':'var(--water)','line-width':2,'line-dasharray':[2.5,2]}});
  mv.image('hist',WM.asset(HIST.A.src),histBox(HIST.A)); mv.show('hist',false);
}
function showHist(H){ if(H===histShown) return; if(H){mv.moveImage('hist',WM.asset(H.src),histBox(H));if(!histShown)mv.show('hist',true)} else mv.show('hist',false); histShown=H }

/* ---------- drawing ---------- */
var S;
var ECH={army:'XXXX',corps:'XXX',division:'XX',brigade:'X'};
var REAR=[-12000,1500]; // the Allied rear, roughly Poperinghe: symbols sit behind their own line
function layout(sc){
  var L=[],Z=mv.size(),rr=S(REAR);
  sc.forEach(function(o){ if(!o.drawn) return; var tr=o.tr,pts=o.s.g.map(S),len=WM.plen(pts),m=WM.along(pts,0.5),c=m.p,x=c[0],y=c[1];
    if(len>7){var px=-m.v[1],py=m.v[0],dot=px*(rr[0]-c[0])+py*(rr[1]-c[1]);if((dot<0)===(tr.side!=='GE')){px=-px;py=-py}x+=px*21;y+=py*17}
    var low=(o.s.k.oc==='low'&&o.s.kind!=='moving'),txt=tr.label;
    var pr=(tr.id===sel?0:tr.ech==='corps'||tr.ech==='army'?1:tr.ech==='division'?2:3);
    L.push({o:o,pts:pts,len:len,c:c,x:x,y:y,low:low,txt:txt,w:txt.length*6.7+6,pr:pr,nudged:false,line:len>7})});
  L.sort(function(a,b){return a.pr-b.pr});
  // spread symbols that land on the same spot
  for(var i=0;i<L.length;i++)for(var pass=0;pass<4;pass++){var moved=false;for(var j=0;j<i;j++){var a=L[i],b=L[j];if(Math.abs(a.x-b.x)<27&&Math.abs(a.y-b.y)<21){var sx=a.x>=b.x?1:-1,sy=a.y>=b.y?1:-1;if(Math.abs(a.x-b.x)>Math.abs(a.y-b.y))a.x=b.x+sx*28;else a.y=b.y+sy*22;a.nudged=true;moved=true}}if(!moved)break}
  var R=[]; function hit(r){for(var i=0;i<R.length;i++){var q=R[i];if(r[0]<q[2]&&r[2]>q[0]&&r[1]<q[3]&&r[3]>q[1])return true}return false}
  L.forEach(function(u){R.push([u.x-14,u.y-18,u.x+14,u.y+10])});
  L.forEach(function(u){
    u.lab=null; if(!names&&!(sel&&u.o.tr.id===sel)) return;
    var x=u.x,y=u.y,w=u.w,C=[[x+16,y-8,x+16+w,y+8,'start',x+17,y+4.5],[x-16-w,y-8,x-16,y+8,'end',x-17,y+4.5],[x-w/2,y+11,x+w/2,y+26,'middle',x,y+23],[x-w/2,y-35,x+w/2,y-20,'middle',x,y-23]];
    for(var i=0;i<C.length;i++){ if(C[i][0]>=3&&C[i][2]<=Z.w-3&&!hit(C[i])){u.lab=C[i];break} }
    if(!u.lab&&u.pr===0) u.lab=C[0];
    if(u.lab) R.push(u.lab) });
  L.hit=hit; L.add=function(r){R.push(r)};
  return L;
}
function unitSvg(u,part){
  var o=u.o,tr=o.tr,s=o.s,pts=u.pts,n=nat(tr),col='var(--'+n+')',fill=tr.side==='GE'?'var(--m-fill-ge)':'var(--m-fill-al)';
  var soft=(s.kind==='moving'||s.kind==='after'),low=u.low,op=(s.kind==='after')?0.5:1,isSel=sel===tr.id,h='',x=u.x,y=u.y,c=u.c;
  if(part==='line'){ if(!u.line) return '';
    var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(''),w=tr.ech==='corps'||tr.ech==='army'?5:tr.ech==='division'?4:3;
    h+='<g opacity="'+op+'">'; mv.hits.push({id:tr.id,pts:pts,tol:7});
    if(isSel) h+='<path d="'+d+'" fill="none" stroke="var(--m-sel)" stroke-width="'+(w+9)+'" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>';
    h+='<path d="'+d+'" fill="none" stroke="var(--u-halo)" stroke-width="'+(w+3)+'" stroke-linejoin="round" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round"'+((soft||s.kind==='inferred')?' stroke-dasharray="8 6"':'')+'/>';
    return h+'</g>'; }
  h+='<g opacity="'+op+'">'; mv.hits.push({id:tr.id,r:[x-16,y-19,x+16,y+12]});
  if(u.line||u.nudged) h+='<line x1="'+c[0].toFixed(1)+'" y1="'+c[1].toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+col+'" stroke-width="1.2"/>';
  if(!u.line&&u.nudged) h+='<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="2.5" fill="'+col+'"/>';
  h+='<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+')">';
  if(isSel) h+='<rect x="-17" y="-13" width="34" height="26" rx="4" fill="none" stroke="var(--m-sel)" stroke-width="4"/>';
  h+='<rect x="-12" y="-8" width="24" height="16" fill="'+fill+'" stroke="'+col+'" stroke-width="1.8"'+((soft||low)?' stroke-dasharray="3 2.5"':'')+'/>';
  if(tr.branch==='inf') h+='<path d="M-12 -8L12 8M-12 8L12 -8" stroke="'+col+'" stroke-width="1.3"/>';
  else h+='<path d="M-12 8L12 -8" stroke="'+col+'" stroke-width="1.3"/>';
  h+='<text class="ech" text-anchor="middle" y="-11">'+(ECH[tr.ech]||'')+'</text></g>';
  if(u.lab){h+='<text class="ulab" text-anchor="'+u.lab[4]+'" x="'+u.lab[5].toFixed(1)+'" y="'+u.lab[6].toFixed(1)+'">'+esc(u.txt)+'</text>';mv.hits.push({id:tr.id,r:[u.lab[0],u.lab[1],u.lab[0]+u.w,u.lab[1]+16]})}
  return h+'</g>';
}
function draw(){
  sNow=mv.scale(); mv.hits.length=0; var z=mv.size(),h='';
  var H=curHist(),hb=H?histBox(H):null; showHist(H); paintCredit(H);
  var sc=scene(),L=layout(units?sc:[]),lvl=sNow>=0.034?1:0,full=sNow>=0.062;
  D.labels.forEach(function(l){ if(l.l===1&&!lvl) return; if(l.l===2&&sNow<0.02) return; if(hb&&l.p[0]>hb[0]&&l.p[0]<hb[2]&&l.p[1]>hb[1]&&l.p[1]<hb[3]) return; var q=S(l.p); if(q[0]<-40||q[1]<-10||q[0]>z.w+40||q[1]>z.h+10) return;
    var txt=l.t+(full&&l.o?' ('+l.o+')':''),w=txt.length*(l.l===0?6.6:5.7)+4;
    if(l.l===2){var r2=[q[0]-w/2,q[1]-7,q[0]+w/2,q[1]+7]; if(L.hit(r2)) return; L.add(r2); h+='<text class="wl" text-anchor="middle" x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'">'+esc(txt)+'</text>'; return}
    var r=[q[0]+5,q[1]-15,q[0]+8+w,q[1]-1],hid=L.hit(r);
    h+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(l.l===0?3:2.2)+'" fill="var(--map-text)" opacity="'+(l.l===0?1:.7)+'"/>'; if(hid) return; L.add(r);
    h+='<text class="pl'+(l.l===0?' big':'')+'" x="'+(q[0]+7).toFixed(1)+'" y="'+(q[1]-4).toFixed(1)+'">'+esc(l.t)+(full&&l.o?' <tspan class="old">('+esc(l.o)+')</tspan>':'')+'</text>'});
  L.sort(function(a,b){return (a.o.tr.id===sel)-(b.o.tr.id===sel)});
  L.forEach(function(u){h+=unitSvg(u,'line')}); L.forEach(function(u){h+=unitSvg(u,'sym')}); ov.innerHTML=h;
  WM.scaleBar($('scale'),mv.mPerPx(),'km');
  renderPanel(sc);
}

/* ---------- panel ---------- */
function phase(){var p=null,d=Math.ceil(t-1e-6);D.events.forEach(function(e){if(d>=e.t0)p=e});return p}
var CS={map_read:'read from the 1925 official-history map',modern_map:'at a village centre on the current map',derived:'offset from a village',estimate:'placed from memory or a description'};
var NAT={br:'British',fr:'French',be:'Belgian',ge:'German'};
var KIND={stated:['Placed by a source','A history or official account names the unit at these places. The line between them is drawn straight.'],
  inferred:['Inferred position','Worked out from other units or from the order of events; the sources do not give this line.'],
  moving:['Moving: interpolated','The sources give positions at nightfall. The path between two nights is not recorded.'],
  after:['Last recorded position','The sources read do not follow this unit here. It is shown where they last put it.'],
  unplaced:['No position recorded','The sources read do not say where the unit was.'],
  lost:['Not followed','The sources read stop following this unit after the record below. It is taken off the map two days later.']};
function rowHtml(k,head){
  var h='<h3>'+esc(head)+' <span class="rid">row '+k.id+'</span></h3><p><b>'+esc(k.act)+'.</b> '+esc(k.place)+'</p>';
  if(k.say) h+='<blockquote>'+esc(k.say)+'</blockquote>';
  h+='<h3>How sure</h3><dl><dt>From</dt><dd>'+esc(k.ts)+'</dd><dt>To</dt><dd>'+esc(k.te)+'</dd>';
  if(k.basis){h+='<dt>Location</dt><dd>'+esc(k.basis)+'</dd>';}
  else if(k.pl&&k.pl.length){var n={};k.pl.forEach(function(p){n[p[2]]=(n[p[2]]||0)+1});var parts=[];['modern_map','map_read','derived','estimate'].forEach(function(c){if(n[c])parts.push((k.pl.length>1?n[c]+' ':'')+CS[c])});
    h+='<dt>Location</dt><dd>'+(k.pl.length>1?'A line through '+k.pl.length+' places: ':'A point ')+parts.join(', ')+'. Good to about '+(k.prec>=1000?(k.prec/1000)+' km':k.prec+' m')+'.</dd>';}
  h+='<dt>Overall</dt><dd>'+chip(k.oc)+'</dd></dl>';
  if(k.notes) h+='<h3>Notes</h3><p>'+esc(k.notes)+'</p>';
  var sl=WM.srcList(D.sources,k.src); if(sl) h+='<h3>Sources</h3><ul class="srcs">'+sl+'</ul>';
  if(k.lat!=null) h+='<p style="margin-top:10px"><a href="https://www.openstreetmap.org/?mlat='+k.lat+'&mlon='+k.lon+'#map=14/'+k.lat+'/'+k.lon+'" target="_blank" rel="noopener">Open this area on OpenStreetMap</a></p>';
  return h;
}
var NROWS=0;D.tracks.forEach(function(tr){NROWS+=tr.k.length});
function about(){return '<details><summary>About this prototype</summary>'+
 '<p>Positions come from the data pilot spreadsheet ('+NROWS+' Ypres rows). British and French lines on 21, 23, 25, 29 and 31 October and 4, 9 and 11 November are read from the sketch maps of the British official history (1925); each holds until the next sketch or the next change in the text. Everything else, and every German position, comes from text: the first four days of the official history, the German General Staff account of 1917, two British histories of 1916 and encyclopedia articles. No French source was read. Nothing here has been checked by a historian.</p>'+
 '<p>A line read from a sketch follows the drawn line to about 250 m. A line from text runs straight through the centres of the villages the sources name. The sketches show the Germans only as arrows, so German lines are text, moved where needed to stand 500 m clear of the Allied line. The sources give positions by day, taken here as nightfall.</p>'+
 '<p>Solid lines are positions a source gives. Dashed lines are inferred, interpolated or the last position on record; faded symbols are units the sources stop following.</p>'+
 '<p>Dark blue is British, light blue French, teal Belgian, red German. Zoomed out, German divisions fold into their corps; zoom in to see them.</p>'+
 '<p>The current map is a simplified drawing of today\'s roads, canals and villages from OpenStreetMap, with 1914 spellings in brackets when you zoom in. The woods and the old Ypres-Comines canal are approximate.</p>'+
 '<p>The map is drawn with MapLibre GL JS.</p>'+
 '<p>The 1914 map is Sketch A of the British official history (1925). It is bound across two pages and about a kilometre is lost in the fold, so the current map shows through the gap. Sketch of the day puts the official history\'s own sketch for the date under the units, with its British (red), French (blue) and German (green) lines; there are eight, from 18 October to 11 November. Both are placed to within about 150 m. Use the Units button to read the sketch on its own. On a sketch\'s last date the British and French units should sit on its solid line. The sketches also draw the lines of the days before; those are not in the data.</p></details>'}
var panelKey='';
function renderPanel(sc){
  var me=sel?sc.filter(function(o){return o.tr.id===sel})[0]:null,d=Math.ceil(t-1e-6);
  var key=(sel?sel+'|'+(me?me.s.k.id+me.s.kind+d:'x'):'now|'+((phase()||{id:0}).id)+'|'+sc.map(function(o){return o.tr.id+(o.drawn?1:0)+o.s.kind+o.s.k.id}).join(','));
  if(key===panelKey) return; panelKey=key; var h='';
  if(sel){
    var tr=byId(sel),n=nat(tr),p=parentAt(tr,t);
    h+='<button class="back" id="back">&larr; All units</button><div class="who"><div class="side '+n+'">'+NAT[n]+'</div><h2>'+esc(tr.name)+'</h2>';
    if(p) h+='<div class="meta">'+[p[3],p[2]?'under '+(D.un[p[2]]||p[2]):'',p[4]].filter(Boolean).map(esc).join(' &middot; ')+'</div>';
    h+='</div>';
    if(!me){h+='<div class="state unplaced"><b>Not in the data on this day</b>Move the time to see this unit.</div>'}
    else{var K=KIND[me.s.kind];
      h+='<div class="state '+(me.s.kind==='lost'?'unplaced':me.s.kind)+'"><b>'+K[0]+'</b>'+K[1]+'</div>';
      if(me.s.kind==='moving'){h+=rowHtml(me.s.k,'Heading to');if(me.s.from)h+=rowHtml(me.s.from,'Coming from')}
      else h+=rowHtml(me.s.k,(me.s.kind==='after'||me.s.kind==='lost')?'Last record':'Record');}
    if(tr.notes) h+='<p class="meta" style="margin-top:12px">'+esc(tr.notes)+'</p>';
  } else {
    var ph=phase(); h+='<div class="eyebrow">'+(ph?esc(ph.name):'Before the battle')+'</div><p class="phase">'+esc(ph?ph.text:BEFORE)+'</p>';
    [['br','British'],['fr','French'],['be','Belgian'],['ge','German']].forEach(function(sd){var Ls=sc.filter(function(o){return nat(o.tr)===sd[0]&&(o.drawn||o.folded)});if(!Ls.length)return;
      h+='<h3><span class="sd '+sd[0]+'"></span>'+sd[1]+'</h3><ul class="ulist">';
      Ls.forEach(function(o){h+='<li><button data-pick="'+o.tr.id+'"><span class="nm">'+esc(o.tr.label)+'</span><span class="ac">'+esc(o.s.kind==='moving'?'Moving':o.s.kind==='after'?'Last recorded position':o.s.k.act)+'</span></button></li>'});h+='</ul>'});
    var nd=sc.filter(function(o){return !o.drawn&&!o.folded&&o.s.kind!=='lost'});
    if(nd.length){h+='<h3>Not placed</h3><ul class="nd">';nd.forEach(function(o){h+='<li><b>'+esc(o.tr.label)+'</b>: '+esc(o.s.k.act)+'</li>'});h+='</ul>'}
    var lo=sc.filter(function(o){return o.s.kind==='lost'});
    if(lo.length){h+='<h3>No longer followed by the sources</h3><ul class="ulist">';lo.forEach(function(o){h+='<li><button data-pick="'+o.tr.id+'"><span class="sd '+nat(o.tr)+'"></span><span class="nm">'+esc(o.tr.label)+'</span><span class="ac">last placed '+esc(o.s.k.te.split(' or later')[0].split(' to ').pop())+'</span></button></li>'});h+='</ul>'}
    h+='<p class="meta" style="margin-top:14px">Tap a unit for its source and how sure the position is.</p>'+about();
  }
  panel.innerHTML=h; if(sel) panel.scrollTop=0;
}

function select(id){sel=id||null;panelKey='';mv.kick()}

/* ---------- map, time, controls ---------- */
var mv,clk;
try{ mv=WM.mapView({container:'map',wrap:wrap,world:'front',worlds:{front:{toLL:toLL,ext:EXT,mPerUnit:1,maxScale:0.6,minFactor:0.85}},
  onDraw:draw,onPick:select,onUserMove:function(){if(preset||target)setPreset(null)},onResize:function(){if(preset){mv.jump(cameraOf(preset));target=null}},
  onStep:function(ts){var more=clk.step(ts);if(target){if(mv.chase(target,0.2))more=true;else target=null}return more}});
}catch(err){WM.noMap(wrap,err);return}
S=mv.S;
function paintTime(v){t=v;var n=Math.ceil(t-1e-6),d=dateOf(n),night=Math.abs(t-Math.round(t))<0.02;
  $('clock').textContent=d.day+' '+d.mon+' 1914'; WM.paintDayNumber(D.cal.numbered?n+1:0); // a day number only where the battle's data says its days are numbered
  $('clocksub').textContent=d.wd+' \u00b7 '+(night?'at nightfall':'during the day');
  $('done').style.width=(t/T1*100)+'%'; var p=phase();
  Array.prototype.forEach.call(document.querySelectorAll('.tl .ev'),function(e){e.classList.toggle('on',!!p&&e.dataset.id===p.id)})}
clk=WM.clock({T0:T0,T1:T1,mv:mv,toRange:function(v){return Math.round(v*100)},fromRange:function(v){return v/100},rate:function(){return 0.85},onTime:paintTime,
  snap:function(v){return Math.round(v)},   // the sources give one position a day, so time settles on nightfall
  arrow:function(dir,v){return dir>0?Math.floor(v+1e-6)+1:Math.ceil(v-1e-6)-1},wheel:function(dd,v){return v+dd*0.007},
  onKey:function(e){if(e.key==='Escape')select(null);else if(e.key==='n'||e.key==='N')setNames(!names);else if(e.key==='u'||e.key==='U')setUnits(!units)}});

/* timeline furniture */
(function(){var tl=$('tl'),pc=function(m){return (m/T1*100)+'%'},h='';
  for(var m=0;m<=T1;m++){var maj=(m-2)%5===0;h+='<span class="tick'+(maj?' maj':'')+'" style="left:'+pc(m)+'"></span>';
    if(maj){var d=dateOf(m);h+='<span class="tk'+((m-2)%10?' minor':'')+'" style="left:'+pc(m)+'">'+d.day+' '+d.mon.slice(0,3)+'</span>'}}
  D.events.forEach(function(e){h+='<button class="ev'+(MAJOR[e.id]?'':' mute')+'" data-id="'+e.id+'" data-t="'+e.t0+'" style="left:'+pc(e.t0)+'" title="'+esc(e.name)+'" aria-label="'+esc(e.name)+'">'+esc(e.name)+'</button>'});
  tl.insertAdjacentHTML('afterbegin',h);
  tl.addEventListener('click',function(ev){var b=ev.target.closest('.ev');if(b){clk.setPlaying(false);clk.setTime(+b.dataset.t)}});
})();
$('bNames').addEventListener('click',function(){setNames(!names)});
$('bUnits').addEventListener('click',function(){setUnits(!units)});
$('bNow').addEventListener('click',function(){setBase('now')});$('b14').addEventListener('click',function(){setBase('m14')});$('bDay').addEventListener('click',function(){setBase('day')});
$('vSal').addEventListener('click',function(){setPreset('sal')});
$('vAll').addEventListener('click',function(){setPreset('all')});
$('zin').addEventListener('click',function(){setPreset(null);mv.zoomBy(1.5)});
$('zout').addEventListener('click',function(){setPreset(null);mv.zoomBy(1/1.5)});
WM.panelClicks(panel,select);

/* ---------- start ---------- */
try{if(localStorage.getItem('ypres.names')==='0'){names=false;$('bNames').setAttribute('aria-pressed','false')}}catch(_){ }
mv.start(function(){buildBase();setPreset('sal',true);clk.setTime(T0);WM.hint(mv)});
window.__yp={setBase:setBase,setUnits:setUnits,setTime:clk.setTime,setPreset:setPreset,get view(){return {s:mv.scale()}},select:select,setNames:setNames,mv:mv};
})();
</script>
