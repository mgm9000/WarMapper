<title>First Ypres Playback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen map table. Header (title + date), map with a source panel beside it (below it on a phone), timeline along the bottom edge. One step per day. */
:root{
  --bg:#e9edf2; --surface:#ffffff; --surface-2:#f3f5f8; --fg:#17202f; --muted:#566275; --line:#d3d9e2;
  --accent:#8a5a10; --accent-fg:#ffffff; --accent-soft:#f4ead6;
  --good:#2f7a45; --good-soft:#dff1e3; --warn:#96690a; --warn-soft:#fbefcc; --bad:#ab3a2c; --bad-soft:#f9dfda;
  --land:#e6e9e0; --road:#ffffff; --road-edge:#bcc3b6; --water:#9cc6e2; --wood:#cfdcc0; --map-text:#3b4654; --map-halo:#eef1ea;
  --br:#124f93; --fr:#2f86c9; --be:#0f7f86; --ge:#b02a1c;
  --m-fill-al:#e6f0fb; --m-fill-ge:#fde6e1; --m-ink:#141a24; --m-sel:#f2a900;
  --display:"Zilla Slab",Rockwell,Georgia,serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141b; --surface:#191f29; --surface-2:#212936; --fg:#e7ebf1; --muted:#9ba6b7; --line:#2f3847;
  --accent:#e2b45a; --accent-fg:#1a1405; --accent-soft:#3a2f17;
  --good:#7ccf93; --good-soft:#1c3a25; --warn:#e6c063; --warn-soft:#3d3113; --bad:#f0897c; --bad-soft:#4a211c;
  --land:#1b232d; --road:#465366; --road-edge:#11161d; --water:#22506f; --wood:#22322a; --map-text:#b9c3d1; --map-halo:#1b232d;
  --br:#6ea8ea; --fr:#8fd0ff; --be:#5fd0d0; --ge:#f0897c; --hist-filter:brightness(.9);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#191f29; --surface-2:#212936; --fg:#e7ebf1; --muted:#9ba6b7; --line:#2f3847;
  --accent:#e2b45a; --accent-fg:#1a1405; --accent-soft:#3a2f17;
  --good:#7ccf93; --good-soft:#1c3a25; --warn:#e6c063; --warn-soft:#3d3113; --bad:#f0897c; --bad-soft:#4a211c;
  --land:#1b232d; --road:#465366; --road-edge:#11161d; --water:#22506f; --wood:#22322a; --map-text:#b9c3d1; --map-halo:#1b232d;
  --br:#6ea8ea; --fr:#8fd0ff; --be:#5fd0d0; --ge:#f0897c; --hist-filter:brightness(.9);
  color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

.bar{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ttl{min-width:0;flex:1 1 200px}
.ttl h1{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;margin:0;text-wrap:balance}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.clock{text-align:right;flex:0 0 auto;min-width:176px}
.clock .t{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}

.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px}
.mapwrap{position:relative;overflow:hidden;background:var(--land);touch-action:none;cursor:grab;min-height:0;user-select:none;-webkit-user-select:none}
.mapwrap.drag{cursor:grabbing}
.mapwrap{--u-ink:var(--fg);--u-halo:var(--land)}
.mapwrap.hist{--u-ink:#141a24;--u-halo:#fbf6e6;--br:#124f93;--fr:#1f6fb0;--be:#0f7f86;--ge:#b02a1c}
.mapwrap.hist .hint{display:none}
#hist{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;-webkit-user-drag:none;filter:var(--hist-filter,none)}
#base,#ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#base{pointer-events:none}
#base path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#base .wd{fill:var(--wood);stroke:none}
#base .wt{stroke:var(--water)}
#base .wx{stroke:var(--water);stroke-dasharray:5 4}
#base .edge{stroke:var(--road-edge)} #base .rd{stroke:var(--road)}
#ov text{font-family:var(--body);paint-order:stroke;stroke-linejoin:round}
#ov .u{cursor:pointer}
.pl{font-size:11px;fill:var(--map-text);stroke:var(--map-halo);stroke-width:3px}
.pl.big{font-size:12.5px;font-weight:600}
.pl .old{font-style:italic}
.wl{font-size:10.5px;font-style:italic;fill:var(--map-text);stroke:var(--map-halo);stroke-width:3px;opacity:.85}
.ulab{font-size:12px;font-weight:600;fill:var(--u-ink);stroke:var(--u-halo);stroke-width:3.5px}
.ech{font-size:8.5px;font-weight:700;fill:var(--u-ink);stroke:var(--u-halo);stroke-width:2.5px;letter-spacing:.05em}

.ctl{position:absolute;display:flex;gap:6px;z-index:3}
.ctl.c-l{top:10px;left:max(10px,env(safe-area-inset-left,0px));flex-wrap:wrap;max-width:calc(100% - 70px);align-items:center}
.ctl.c-r{top:10px;right:max(10px,env(safe-area-inset-right,0px));flex-direction:column}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:500;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.chipbtn,.sq{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer}
.chipbtn{padding:6px 10px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chipbtn .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.chipbtn[aria-pressed="true"]{border-color:var(--accent)}
.chipbtn[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}
.seg .sm{display:none}
.sq{width:34px;height:34px;font-size:18px;line-height:1;display:grid;place-items:center}
.scale{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;z-index:3;font-size:11px;color:var(--map-text);pointer-events:none}
.scale i{display:block;height:6px;border:1.5px solid var(--map-text);border-top:0;margin-top:2px}
.credit{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:6px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:10.5px;color:var(--muted);max-width:70%}
.credit a{color:inherit}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11.5px;color:var(--muted);pointer-events:none;white-space:nowrap}

.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;min-height:0;min-width:0;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.panel h2{font-family:var(--display);font-size:18px;font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
.panel h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.panel p{margin:0 0 8px}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.phase{font-size:14.5px}
.ulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ulist button{width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:5px 6px;display:flex;gap:8px;align-items:baseline;cursor:pointer;min-width:0}
.ulist button:hover{background:var(--surface-2)}
.ulist .nm{font-weight:600;flex:none}
.ulist .ac{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:9px;height:9px;border-radius:2px;flex:none;align-self:center;display:inline-block}
.sd.br{background:var(--br)} .sd.fr{background:var(--fr)} .sd.be{background:var(--be)} .sd.ge{background:var(--ge)}
.nd{color:var(--muted);font-size:12.5px;margin:0;padding-left:16px}
.nd li{margin-bottom:4px}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:12.5px;margin-bottom:10px}
.who .side{font-size:12px;font-weight:600}
.who .side.br{color:var(--br)} .who .side.fr{color:var(--fr)} .who .side.be{color:var(--be)} .who .side.ge{color:var(--ge)}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.state{margin:12px 0 0;padding:9px 11px;border-radius:6px;font-size:13px;border:1px solid var(--line);background:var(--surface-2)}
.state b{display:block;font-size:13px}
.state.stated{border-color:var(--good);background:var(--good-soft)}
.state.inferred{border-color:var(--warn);background:var(--warn-soft)}
.state.moving,.state.after,.state.unplaced{border-style:dashed;border-color:var(--muted)}
blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-family:var(--display);font-size:15px;line-height:1.4;border-radius:0 6px 6px 0;overflow-wrap:anywhere}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.chip.high{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.chip.medium{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.na{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.srcs{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.srcs code,.rid{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
a{color:var(--accent)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--fg)}
details p{margin:8px 0 0}

.tlbar{background:var(--surface);border-top:1px solid var(--line);padding-block:8px 10px;display:flex;gap:12px;align-items:center}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:grid;place-items:center}
.play svg{width:16px;height:16px;fill:currentColor}
.tl{flex:1;min-width:0;position:relative;height:54px}
.tl .rail{position:absolute;left:0;right:0;top:22px;height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}
.tl .ph{position:absolute;top:22px;height:10px;background:var(--accent-soft);border:1px solid var(--line)}
.tl .done{position:absolute;left:0;top:22px;height:10px;border-radius:5px 0 0 5px;background:var(--accent);opacity:.55}
.tl .tick{position:absolute;top:34px;width:1px;height:4px;background:var(--muted);opacity:.6}
.tl .tick.maj{height:6px;opacity:1}
.tl .tk{position:absolute;top:40px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .ev{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;font-weight:600;white-space:nowrap;color:var(--muted);background:none;border:0;padding:0 2px;cursor:pointer;height:22px;min-width:10px}
.tl .ev::after{content:"";position:absolute;left:50%;top:15px;width:1.5px;height:9px;background:var(--muted)}
.tl .ev.on{color:var(--fg)}
.tl .ev.mute{font-size:0}
.tl input{position:absolute;left:-10px;width:calc(100% + 20px);top:14px;height:26px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.tl input::-webkit-slider-runnable-track{height:26px;background:transparent}
.tl input::-moz-range-track{height:26px;background:transparent}
.tl input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:26px;border-radius:5px;background:var(--fg);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tl input::-moz-range-thumb{width:16px;height:22px;border-radius:5px;background:var(--fg);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}

@media (max-width:1180px){ .hint{display:none} }
@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .ttl h1{font-size:16.5px} .ttl p{display:none} .clock .t{font-size:22px} .bar{padding-block:8px;gap:10px}
  .ttl{flex:1 1 120px} .clock{min-width:150px}
  .seg .lg{display:none} .seg .sm{display:inline}
  .tl .ev{font-size:0}
  .tl .tk.minor{display:none}
  .chipbtn,.seg button{padding:5px 8px;font-size:12px}
  .sq{width:32px;height:32px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app">
  <header class="bar gut">
    <div class="ttl">
      <h1>First Ypres, 1914</h1>
      <p>Corps and divisions day by day, from the Yser to the Lys</p>
    </div>
    <div class="clock">
      <div class="t" id="clock">18 October</div>
      <div class="d" id="clocksub">Sunday &middot; at nightfall</div>
    </div>
  </header>

  <main class="stage">
    <div class="mapwrap" id="mapwrap" tabindex="0" aria-label="Battle map. Scroll or pinch to zoom, drag to pan. To move through the days, scroll over the timeline or use the arrow keys.">
      <svg id="base" aria-hidden="true"><g id="baseg"></g></svg>
      <img id="hist" alt="" draggable="false" hidden>
      <svg id="ov" aria-hidden="true"></svg>
      <div class="ctl c-l">
        <div class="seg" role="group" aria-label="Base map">
          <button id="bNow" aria-pressed="true"><span class="lg">Current map</span><span class="sm">Now</span></button>
          <button id="b14" aria-pressed="false"><span class="lg">1914 map</span><span class="sm">1914</span></button>
          <button id="bDay" aria-pressed="false"><span class="lg">Sketch of the day</span><span class="sm">Daily</span></button>
        </div>
        <div class="seg" role="group" aria-label="Map view">
          <button id="vSal" aria-pressed="true"><span class="lg">Ypres salient</span><span class="sm">Salient</span></button>
          <button id="vAll" aria-pressed="false"><span class="lg">Whole front</span><span class="sm">All</span></button>
        </div>
        <button class="chipbtn" id="bNames" aria-pressed="true" title="Show or hide the names beside the unit symbols (N)"><span class="dot"></span><span>Names</span></button>
        <button class="chipbtn" id="bUnits" aria-pressed="true" title="Show or hide the units, to read the map underneath (U)"><span class="dot"></span><span>Units</span></button>
      </div>
      <div class="ctl c-r">
        <button class="sq" id="zin" aria-label="Zoom in">+</button>
        <button class="sq" id="zout" aria-label="Zoom out">&minus;</button>
      </div>
      <div class="scale" id="scale"></div>
      <div class="hint" id="hint">Scroll or pinch to zoom &middot; drag to pan &middot; scroll over the timeline to move through the days</div>
      <div class="credit" id="credit"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="tlbar gut">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 16 16" id="playico"><path d="M3 1.5v13l11-6.5z"/></svg></button>
    <div class="tl" id="tl">
      <div class="rail"></div><div class="done" id="done"></div>
      <input type="range" id="time" min="0" max="3500" step="1" value="0" aria-label="Day of the battle">
    </div>
  </footer>
</div>

var T0=0,T1=D.days,HOLD=0.35,LINGER=2; // a unit the sources stop following stays on the map, faded, for two days           // time is in days from 18 October; a whole number is nightfall on that day

function plen(g){var L=0;for(var i=1;i<g.length;i++)L+=Math.hypot(g[i][0]-g[i-1][0],g[i][1]-g[i-1][1]);return L}

      Ls.forEach(function(o){h+='<li><button data-pick="'+o.tr.id+'"><span class="nm">'+esc(o.tr.label)+'</span><span class="ac">'+esc(o.s.kind==='moving'?'Moving':o.s.kind==='after'?'Last recorded position':o.s.k.act)+'</span></button></li>'});h+='</ul>'});

    if(nd.length){h+='<h3>Not placed</h3><ul class="nd">';nd.forEach(function(o){h+='<li><b>'+esc(o.tr.label)+'</b>: '+esc(o.s.k.act)+'</li>'});h+='</ul>'}
    var lo=sc.filter(function(o){return o.s.kind==='lost'});
    if(lo.length){h+='<h3>No longer followed by the sources</h3><ul class="ulist">';lo.forEach(function(o){h+='<li><button data-pick="'+o.tr.id+'"><span class="sd '+nat(o.tr)+'"></span><span class="nm">'+esc(o.tr.label)+'</span><span class="ac">last placed '+esc(o.s.k.te.split(' or later')[0].split(' to ').pop())+'</span></button></li>'});h+='</ul>'}
    h+='<p class="meta" style="margin-top:14px">Tap a unit for its source and how sure the position is.</p>'+about();
  }
  panel.innerHTML=h; if(sel) panel.scrollTop=0;
}

/* ---------- time ---------- */
function paintTime(){ var n=Math.ceil(t-1e-6),d=dateOf(n),night=Math.abs(t-Math.round(t))<0.02;
  $('clock').textContent=d.day+' '+d.mon; $('clocksub').textContent=d.wd+' · '+(night?'at nightfall':'during the day');
  $('done').style.width=(t/T1*100)+'%'; var p=phase();
  Array.prototype.forEach.call(document.querySelectorAll('.tl .ev'),function(e){e.classList.toggle('on',!!p&&e.dataset.id===p.id)}) }
function setTime(v,fromRange){t=Math.max(T0,Math.min(T1,v));if(!fromRange)range.value=Math.round(t*100);paintTime();kick()}
function frame(ts){raf=0;var more=false;
  if(playing){var dt=lastTs?Math.min(0.1,(ts-lastTs)/1000):0;lastTs=ts;var nt=t+dt*0.85;if(nt>=T1){nt=T1;setPlaying(false)}t=nt;range.value=Math.round(t*100);paintTime();more=playing}
  if(chase()) more=true;
  renderPanel(draw());
  if(more) raf=requestAnimationFrame(frame);}
function kick(){if(!raf)raf=requestAnimationFrame(frame)}
function setPlaying(v){playing=v;lastTs=0;$('play').setAttribute('aria-label',v?'Pause':'Play');
  $('playico').innerHTML=v?'<path d="M3 1.5h3.5v13H3zM9.5 1.5H13v13H9.5z"/>':'<path d="M3 1.5v13l11-6.5z"/>';
  if(v){if(t>=T1-0.01)setTime(T0);kick()} else if(Math.abs(t-Math.round(t))>0.001&&t<T1) setTime(Math.round(t))}

/* ---------- timeline furniture ---------- */
(function(){var tl=$('tl'),pc=function(m){return (m/T1*100)+'%'},h='';
  for(var m=0;m<=T1;m++){var maj=(m-2)%5===0;h+='<span class="tick'+(maj?' maj':'')+'" style="left:'+pc(m)+'"></span>';
    if(maj){var d=dateOf(m);h+='<span class="tk'+((m-2)%10?' minor':'')+'" style="left:'+pc(m)+'">'+d.day+' '+d.mon.slice(0,3)+'</span>'}}
  D.events.forEach(function(e){h+='<button class="ev'+(MAJOR[e.id]?'':' mute')+'" data-id="'+e.id+'" data-t="'+e.t0+'" style="left:'+pc(e.t0)+'" title="'+esc(e.name)+'" aria-label="'+esc(e.name)+'">'+esc(e.name)+'</button>'});
  tl.insertAdjacentHTML('afterbegin',h);
  tl.addEventListener('click',function(ev){var b=ev.target.closest('.ev');if(b){setPlaying(false);setTime(+b.dataset.t)}});
})();

/* ---------- input ---------- */
range.addEventListener('input',function(){if(playing)setPlaying(false);setTime(+range.value/100,true)});
range.addEventListener('change',function(){setTime(Math.round(t))});
$('play').addEventListener('click',function(){setPlaying(!playing)});
$('bNames').addEventListener('click',function(){setNames(!names)});
$('bUnits').addEventListener('click',function(){setUnits(!units)});
$('bNow').addEventListener('click',function(){setBase('now')});$('b14').addEventListener('click',function(){setBase('m14')});$('bDay').addEventListener('click',function(){setBase('day')});
$('vSal').addEventListener('click',function(){setPreset('sal')});
$('vAll').addEventListener('click',function(){setPreset('all')});
$('zin').addEventListener('click',function(){var z=size();setPreset(null);zoomAt(1.5,z.w/2,z.h/2);kick()});
$('zout').addEventListener('click',function(){var z=size();setPreset(null);zoomAt(1/1.5,z.w/2,z.h/2);kick()});
var wheelT=0;
/* Over the map, scrolling or pinching zooms. Over the timeline bar, scrolling moves time. */
function wheelY(e){return e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?400:1)}
wrap.addEventListener('wheel',function(e){e.preventDefault();var r=wrap.getBoundingClientRect(),dy=wheelY(e),a=Math.abs(dy),pinch=e.ctrlKey||e.metaKey;
  setPreset(null);zoomAt(Math.exp(-dy*(pinch?(a<40?0.01:0.002):(a<40?0.006:0.003))),e.clientX-r.left,e.clientY-r.top);kick()},{passive:false});
document.querySelector('.tlbar').addEventListener('wheel',function(e){e.preventDefault();var dy=wheelY(e),dd=Math.abs(e.deltaX)>Math.abs(dy)?e.deltaX:dy;
  if(playing)setPlaying(false);setTime(t+dd*0.007);clearTimeout(wheelT);wheelT=setTimeout(function(){setTime(Math.round(t))},350)},{passive:false});
function seen(){$('hint').hidden=true}
wrap.addEventListener('wheel',seen,{passive:true,once:true});wrap.addEventListener('pointerdown',seen,{once:true});
var ptrs={},pn=0,downId=null,moved=false,pinch0=0;
function pts2(){return Object.keys(ptrs).map(function(k){return ptrs[k]})}
wrap.addEventListener('pointerdown',function(e){if(e.target.closest('.ctl')||e.target.closest('.credit'))return;var u=e.target.closest('[data-id]');
  if(pn===0){downId=u?u.getAttribute('data-id'):null;moved=false}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};pn=Object.keys(ptrs).length;try{wrap.setPointerCapture(e.pointerId)}catch(_){ }
  if(pn===2){var a=pts2();pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);moved=true}
  wrap.classList.add('drag')});
wrap.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(pn===1){if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;if(preset||target)setPreset(null);view.x+=dx;view.y+=dy;p.x=e.clientX;p.y=e.clientY;kick()}
  else if(pn===2){p.x=e.clientX;p.y=e.clientY;var a=pts2(),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=wrap.getBoundingClientRect();
    if(pinch0>0){if(preset||target)setPreset(null);zoomAt(d/pinch0,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top);view.x+=dx/2;view.y+=dy/2;kick()}pinch0=d}});
function up(e){if(!ptrs[e.pointerId])return;delete ptrs[e.pointerId];pn=Object.keys(ptrs).length;
  if(pn===0){wrap.classList.remove('drag');if(!moved){sel=downId;panelKey='';kick()}}}
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('dblclick',function(e){if(e.target.closest('.ctl'))return;var r=wrap.getBoundingClientRect();setPreset(null);zoomAt(1.6,e.clientX-r.left,e.clientY-r.top);kick()});
panel.addEventListener('click',function(e){var b=e.target.closest('[data-pick]');if(b){sel=b.getAttribute('data-pick');panelKey='';kick();return}
  if(e.target.id==='back'){sel=null;panelKey='';kick()}});
document.addEventListener('keydown',function(e){if(e.target.tagName==='BUTTON'||e.target.tagName==='SUMMARY')return;
  if(e.key==='ArrowRight'){if(playing)setPlaying(false);setTime(Math.floor(t+1e-6)+1);e.preventDefault()} else if(e.key==='ArrowLeft'){if(playing)setPlaying(false);setTime(Math.ceil(t-1e-6)-1);e.preventDefault()}
  else if(e.target.tagName==='INPUT') return;
  else if(e.key===' '){setPlaying(!playing);e.preventDefault()} else if(e.key==='Escape'){sel=null;panelKey='';kick()} else if(e.key==='n'||e.key==='N'){setNames(!names)} else if(e.key==='u'||e.key==='U'){setUnits(!units)}});
if(window.ResizeObserver) new ResizeObserver(function(){if(preset){var tg=fitBox(BOX[preset]);view.s=tg.s;view.x=tg.x;view.y=tg.y;target=null}kick()}).observe(wrap);
if(matchMedia('(pointer:coarse)').matches) $('hint').hidden=true;

/* ---------- start ---------- */
try{if(localStorage.getItem('ypres.names')==='0')setNames(false)}catch(_){ }
setPreset('sal',true); setTime(T0);
window.__yp={setBase:setBase,setUnits:setUnits,setTime:setTime,setPreset:setPreset,get view(){return view},select:function(id){sel=id;panelKey='';kick()},setNames:setNames};
})();
</script>
