285730,5082830;-3510,-1120;-570,-710;-1520,-930"],["road","s","N375","285760,5082850;760,750;20,330;1310,740"],["road","s","N322","282310,5074520;-120,210;-1560,440;-1990,1410;-340,10"],["road","s","N314","293050,5076730;-1130,-330;-1930,300;-3900,-890;-850,200;-390,-450;-1070,-320;-920,-500"],["road","s","N336","289160,5081050;20,720;-510,1290;280,1210"],["road","s","N336","289200,5081020;750,-1410;1100,-820;890,-370;1110,-1690;1230,-830"],["road","s","N301","294790,5096970;-310,-1700;-320,-280;-200,-1100;1690,-2120"],["road","s","N333","281350,5088630;-1820,-90;-570,-150;-880,-500"],["road","s","N308","287530,5085090;-1000,-200;-3760,420;-700,190;-1170,-100"],["road","s","N345","291300,5085990;390,-410;-30,-660"],["former-water","canal","Former Ypres-Comines canal (approximate)","287930,5083670;3740,-2280;830,-290;1200,-800;2930,-1630"]],"areas":[["wood","Ploegsteert Wood","290260,5074130;60,-140;490,-60;80,-530;160,-180;-870,-190;-130,290;-1260,-80;-100,250;-490,-40;80,340;820,80;-70,160;250,70;80,-90;190,20;-40,-80;320,170;430,10"],["wood","Houthulst Forest","298466,5096135;-87,-538;-254,-501;-405,-430;-527,-330;-614,-208;-659,-70;-659,70;-614,208;-527,330;-405,430;-254,501;-87,538;87,538;254,501;405,430;527,330;614,208;659,70;659,-70;614,-208;527,-330;405,-430;254,-501"],["wood","Polygon Wood","299520,5085320;-28,-122;-84,-113;-133,-97;-173,-75;-201,-47;-216,-16;-216,16;-201,47;-173,75;-133,97;-84,113;-28,122;28,122;84,113;133,97;173,75;201,47;216,16;216,-16;201,-47;173,-75;133,-97;84,-113"],["wood","Nonne Bosschen","297490,5084970;-17,-96;-50,-89;-79,-77;-104,-58;-121,-37;-129,-13;-129,13;-121,37;-104,58;-79,77;-50,89;-17,96;17,96;50,89;79,77;104,58;121,37;129,13;129,-13;121,-37;104,-58;79,-77;50,-89"]],"credit":"© OpenStreetMap contributors","source":"S39"},"summaries":[{"kind":"day","from":"1914-10-18","to":"1914-10-18","title":"The Allies push east","text":"The British 7th Division wheels forward towards Menin, and the British cavalry probe the Lys crossings without getting over. French cavalry push out to Roulers. On the coast the German III Reserve Corps attacks the Belgian line on the Yser, while two new German reserve corps march up behind it.","sources":["S40","S41","S45"]},{"kind":"week","from":"1914-10-18","to":"1914-10-24","title":"Week 1: the encounter battle","text":"Both sides try to go round the other's open flank and meet head on. New German reserve corps drive in the Allied cavalry, take Roulers, Passchendaele and Becelaere, and stop the British advance on Menin. Haig's I Corps arrives and is halted north-east of Ypres; Langemarck holds. By the end of the week the French are taking over the north of the salient, and on the coast the Germans are over the Yser.","sources":["S40","S41","S42","S44","S45","S47"]},{"kind":"day","from":"1914-10-19","to":"1914-10-19","title":"The encounter","text":"Four new German reserve corps strike the Allied cavalry screen. Roulers falls, the French cavalry are driven back towards Passchendaele and Houthulst, and the British 3rd Cavalry Division takes Ledeghem but falls back. The 7th Division gives up its attack on Menin, falls back and digs in from Zandvoorde to Zonnebeke.","sources":["S40","S41"]},{"kind":"day","from":"1914-10-20","to":"1914-10-20","title":"The ridge lost","text":"The Germans take Passchendaele and Becelaere and clear Houthulst Forest, and the French cavalry are forced back behind it. The British I Corps arrives: the 2nd Division puts out outposts north-east of Ypres and the 1st Division marches up. French Territorials hold Bixschoote and the canal. In the north, the XXII Reserve Corps closes round Dixmude.","sources":["S40","S41"]},{"kind":"day","from":"1914-10-21","to":"1914-10-21","title":"I Corps halted","text":"Haig's attack towards Poelcappelle and Langemarck is stopped in the afternoon; the 1st and 2nd Divisions entrench north and north-east of Ypres. The 7th Division draws its left back from Zonnebeke. In the south, dismounted German cavalry take Kortewilde from the British cavalry, who hold from Messines to the canal; the 4th Division extends its line to the Douve. The French cavalry withdraw behind the canal.","sources":["S40","S41","S42","S43","S44","S47"]},{"kind":"day","from":"1914-10-22","to":"1914-10-22","title":"Kortekeer Cabaret","text":"The German 46th Reserve Division attacks the line from Bixschoote to Langemarck and breaks in at Kortekeer Cabaret. Mass attacks on Langemarck fail.","sources":["S40","S41"]},{"kind":"day","from":"1914-10-23","to":"1914-10-23","title":"The French come in","text":"The British retake Kortekeer Cabaret. The French 17th Division takes over from the British 2nd Division east of Langemarck, and the 2nd Division moves south to hold Polygon Wood and the Zonnebeke road.","sources":["S40","S42","S44","S47"]},{"kind":"day","from":"1914-10-24","to":"1914-10-24","title":"Across the Yser","text":"French Territorials relieve the British 1st Division, which goes into reserve. On the coast the German III Reserve Corps crosses the Yser between St. Georges and Tervaete; the Belgians fall back to the railway embankment, and the French 42nd Division is sent to the centre of their line.","sources":["S40","S41","S42","S44","S47"]},{"kind":"day","from":"1914-10-25","to":"1914-10-25","title":"The Kruiseik salient","text":"The British 1st Division comes back into line between the 2nd and 7th Divisions, astride the Menin road. The 7th Division holds the salient at Kruiseik. North of Ypres the French 17th Division, the Territorials and the French cavalry hold the line from the canal to Zonnebeke.","sources":["S40","S42","S44","S47"]},{"kind":"week","from":"1914-10-25","to":"1914-10-31","title":"Week 2: Gheluvelt","text":"The pressure moves to the Menin road. Kruiseik falls on the 26th and the cross-roads on the 29th. From the 30th the new German army group attacks south of the road: Zandvoorde, Hollebeke and then Gheluvelt fall, and Gheluvelt is retaken the same afternoon. Messines is stormed. On the coast the Belgian floods stop the Germans on the Yser.","sources":["S40","S41","S42","S43","S44"]},{"kind":"day","from":"1914-10-26","to":"1914-10-26","title":"Kruiseik taken","text":"German cavalry and the XXVII Reserve Corps take Kruiseik from the 7th Division.","sources":["S40","S41"]},{"kind":"day","from":"1914-10-27","to":"1914-10-27","title":"A line west of Kruiseik","text":"The 7th Division re-forms on a line west of Kruiseik, from the Menin road cross-roads to north of Zandvoorde.","sources":["S41","S42"]},{"kind":"day","from":"1914-10-28","to":"1914-10-28","title":"Reserves gather","text":"No change of position on record. Behind the German line the 6th Bavarian Reserve Division is held as army reserve at Dadizeele.","sources":["S41"]},{"kind":"day","from":"1914-10-29","to":"1914-10-29","title":"Cross-roads lost","text":"A dawn attack in fog takes the cross-roads south-east of Gheluvelt; the 1st Division forms a new line across the Menin road east of the village and the 7th Division is driven back on Gheluvelt. The new German XV Corps assembles behind the cavalry. In the north, the French IX Corps holds from Poelcappelle to the Broodseinde cross-roads.","sources":["S40","S41","S42","S43","S44"]},{"kind":"day","from":"1914-10-30","to":"1914-10-30","title":"Fabeck attacks","text":"The new German army group attacks south of the Menin road. Zandvoorde falls and the British cavalry are driven off its ridge; the 7th Division turns its right back, and Bulfin's force fills the gap at Klein Zillebeke. The Bavarians take Hollebeke and the Germans close on Messines. On the coast the Belgians flood the Yser plain.","sources":["S41","S42","S43","S44"]},{"kind":"day","from":"1914-10-31","to":"1914-10-31","title":"Gheluvelt","text":"Gheluvelt falls about 1.30 p.m. The 2nd Worcestershire retake it, and the line is re-formed in front of Veldhoek. Messines is stormed, and the British cavalry hold on in the village and at Wytschaete. French detachments take over between the canal and St. Eloi. On the coast the German III Reserve Corps withdraws behind the Yser as the floods rise.","sources":["S40","S41","S42","S43","S44","S45"]},{"kind":"day","from":"1914-11-01","to":"1914-11-01","title":"Messines ridge lost","text":"Messines and Wytschaete pass to the Germans; the British cavalry are withdrawn behind the French, and the French XVI Corps takes over west of the ridge. Cavan's force holds at Klein Zillebeke with the French on its right.","sources":["S41","S42","S43"]},{"kind":"week","from":"1914-11-01","to":"1914-11-07","title":"Week 3: the ridge lost, the line holds","text":"Messines and Wytschaete are lost and the French take over the south. The British line round the east of Ypres holds, worn thin. The 7th Division is relieved, and the Germans take Klein Zillebeke but are checked at Zwarteleen.","sources":["S40","S41","S42","S43","S44"]},{"kind":"day","from":"1914-11-02","to":"1914-11-02","title":"Wytschaete","text":"The 6th Bavarian Reserve Division takes Wytschaete, and the German 3rd Division comes into line between Wytschaete and Messines. The XV Corps makes slow progress in the woods south of the Menin road.","sources":["S40","S41"]},{"kind":"day","from":"1914-11-03","to":"1914-11-03","title":"Attacks at Langemarck","text":"The German III Reserve Corps opens its main attack on either side of Langemarck.","sources":["S40","S41","S44"]},{"kind":"day","from":"1914-11-04","to":"1914-11-04","title":"The line holds","text":"The Allied line stands from the canal north of Ypres, round the east of the town past Polygon Wood and Veldhoek, to Klein Zillebeke, and on through French-held St. Eloi and west of Wytschaete to the Douve.","sources":["S40","S41","S42","S43","S44"]},{"kind":"day","from":"1914-11-05","to":"1914-11-05","title":"7th Division relieved","text":"Brigades of the British II Corps take over from the worn-out 7th Division south of the Menin road; the 7th goes back to rest. A German attack on Langemarck fails.","sources":["S40","S41","S42","S43"]},{"kind":"day","from":"1914-11-06","to":"1914-11-06","title":"Klein Zillebeke","text":"The Germans take Klein Zillebeke. The French give way on Cavan's right; the British 3rd Cavalry Division counter-attacks at Zwarteleen and the line is restored west of Klein Zillebeke.","sources":["S41","S42","S43"]},{"kind":"day","from":"1914-11-07","to":"1914-11-07","title":"Reforming","text":"The French detachment that gave way the day before re-forms on the right of the British, from Hill 60 to the canal bank.","sources":["S42"]},{"kind":"day","from":"1914-11-08","to":"1914-11-08","title":"Quiet on record","text":"No change of position on record."},{"kind":"week","from":"1914-11-08","to":"1914-11-14","title":"Week 4: Dixmude, St. Eloi and the Guard","text":"The Germans bring the Guard into line for one more attack. Dixmude and St. Eloi fall on the 10th. On the 11th the Prussian Guard breaks through north of the Menin road to Nonne Bosschen and is thrown out. After that, no change of position is on record.","sources":["S40","S41","S42","S43"]},{"kind":"day","from":"1914-11-09","to":"1914-11-09","title":"The Guard comes in","text":"The German line is reorganised for a new attack: Winckler's Guard Division comes into line north of the Menin road, the 4th Division south of it, and the XXVII Reserve Corps shortens its front. The French 31st Division is in line north of the canal on Cavan's right.","sources":["S40","S41"]},{"kind":"day","from":"1914-11-10","to":"1914-11-10","title":"Dixmude and St. Eloi","text":"Dixmude falls and the French naval brigade is driven across the Yser. North of Ypres the Germans reach the canal, and the Bavarians take St. Eloi.","sources":["S40","S41"]},{"kind":"day","from":"1914-11-11","to":"1914-11-11","title":"Nonne Bosschen","text":"The Prussian Guard breaks through north of the Menin road, reaches Nonne Bosschen and is driven out; the 1st Division's line is restored a little further back. The II Corps brigades are pressed back in Herenthage wood, and an attack on Polygon Wood fails.","sources":["S40","S41","S42","S43"]},{"kind":"day","from":"1914-11-12","to":"1914-11-12","title":"After the Guard","text":"No change of position on record; the line stands where the Guard's attack left it."},{"kind":"day","from":"1914-11-13","to":"1914-11-13","title":"No change on record","text":"No change of position on record."},{"kind":"day","from":"1914-11-14","to":"1914-11-14","title":"No change on record","text":"No change of position on record."},{"kind":"day","from":"1914-11-15","to":"1914-11-15","title":"No change on record","text":"No change of position on record."},{"kind":"week","from":"1914-11-15","to":"1914-11-22","title":"Last days: the offensive ends","text":"The French relieve the British I Corps. A last German attack south of the Menin road fails on the 17th and the offensive is given up. The line that will form the Ypres salient for the rest of the war is set.","sources":["S40","S41","S44"]},{"kind":"day","from":"1914-11-16","to":"1914-11-16","title":"The French relieve I Corps","text":"The French begin relieving the British 1st and 2nd Divisions.","sources":["S44"]},{"kind":"day","from":"1914-11-17","to":"1914-11-17","title":"Offensive called off","text":"A last German attack south of the Menin road fails, and the Fourth Army gives up the offensive.","sources":["S40","S41"]},{"kind":"day","from":"1914-11-18","to":"1914-11-18","title":"No change on record","text":"No change of position on record."},{"kind":"day","from":"1914-11-19","to":"1914-11-19","title":"No change on record","text":"No change of position on record."},{"kind":"day","from":"1914-11-20","to":"1914-11-20","title":"No change on record","text":"No change of position on record."},{"kind":"day","from":"1914-11-21","to":"1914-11-21","title":"No change on record","text":"No change of position on record."},{"kind":"day","from":"1914-11-22","to":"1914-11-22","title":"End of the battle","text":"The French have taken over the salient from the British I Corps. The British official history ends the battle here.","sources":["S40"]}]}</script>
