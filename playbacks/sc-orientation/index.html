an in their valleys.","beyond":"Beyond the dotted line Mouzon's South Carolina stops: only today's relief and sea are drawn there, so the map fills the window.","doubt":false,"extent":[-84.9,30.9,-77.0,36.2],"open_m":300,"relief":6,"smooth_m":400,"spots_from":9.6,"steps":[[0,200,1000],[8.6,100,500],[10.2,50,250],[11.6,20,100]],"zoom":9}},{"current":true,"id":"mod","label":"Current map","short":"Modern"},{"backdrop":"current","hidden":true,"id":"mz75","label":"Mouzon 1775, fitted","map":"mouzon-1775-fitted","note":"Henry Mouzon's map of the two Carolinas (1775), which the reconstruction is traced from, resampled onto the ground. Good to a few kilometres; stretched at the edges of the sections it was mounted in.","short":"Mouzon"}],"clock_title":"South Carolina 1775-81","day_pause":false,"event_dim":0.7,"modern":{"about":"Today's ground: the US Geological Survey's topographic base map, with roads, towns, streams, contours and hill shading. It is streamed from the USGS while it is on screen, so it needs a connection.","credit":"USGS The National Map","link":"https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer","max_zoom":16,"name":"USGS Topo base map","rights":"Public domain (US government work)","tiles":"https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}"},"opening_ease":0.006,"orientation":{"event_seconds":0.5,"gaps":[{"from":"1777-01-01","text":"1777: no actions in the South Carolina Archives list. A gap in the list, not proof of a quiet year; the Cherokee cession of 20 May 1777 is the one event read for it.","to":"1777-12-31"},{"from":"1778-01-01","text":"1778: one entry only (the capture of privateers at Charleston, 19 Jun). The sources read do not say who took them, so no clash is drawn.","to":"1778-12-31"}],"month_seconds":1,"phases":[{"event_seconds":0.5,"title":"Where things stood at the end of 1777","until":"1777-12-31"}],"speeds":[2,1,0.5]},"page_title":"South Carolina, 1775 to Cowpens: an orientation","scale_bar":"km","start_base":"r75t","style":"orientation","trails":{"fade_after":4,"fade_over":4,"on":true,"opacity":0.55},"zoom":{"max":0.3,"min_factor":0.85}},"opening":{"label":"Before the first shots","text":"South Carolina, early 1775: the royal government still stands. Press play and the fights come onto the map month by month, each drawn for the side that won it."},"sides":[{"id":"ARW-US","code":"US","name":"United States (Continental Army and militia)","short":"American","colour":"blue"},{"id":"ARW-CR","code":"CR","name":"British Crown forces (British and German troops)","short":"Hessian and British","colour":"red"},{"id":"ARW-CH","code":"CH","name":"Cherokee Nation","short":"Cherokee","colour":"black"}],"units":[],"tracks":[],"events":[{"id":"SCE01","start":"1775-04-21","end":"1775-04-21","at":"1775-04-21","name":"Charleston: arms and powder seized","text":"Patriot leaders carry off the arms stored in the State House attic and powder from two outlying magazines, without a fight. [T01]","sources":["S116","S117","S127"]},{"id":"SCE02","start":"1775-07-12","end":"1775-07-12","at":"1775-07-12","name":"Fort Charlotte surrenders","text":"Major James Mayson takes the royal fort on the Savannah River in the Council of Safety's name; the garrison gives it up. [T02]","sources":["S116","S122","S126","S127"]},{"id":"SCE03","start":"1775-09-15","end":"1775-09-15","at":"1775-09-15","name":"Fort Johnson taken","text":"South Carolina troops under Colonel Isaac Motte walk into Fort Johnson, whose guns the royal navy had just disabled. [T03]","sources":["S116","S117","S120","S127"]},{"id":"SCE04","start":"1775-11-19","end":"1775-11-21","at":"1775-11-19","name":"Ninety Six: Savage's Old Field","text":"Loyalists surround Major Williamson's Patriot stockade near Ninety Six. Neither side wins; a truce ends the first bloodshed in the state. [T04]","sources":["S116","S118","S121","S128","S127"]},{"id":"SCE05","start":"1775-12-22","end":"1775-12-22","at":"1775-12-22","name":"Great Cane Brake","text":"Colonel Thomson's rangers and militia surprise a Loyalist camp on the Reedy River and take over a hundred prisoners. [T05]","sources":["S116","S118","S121","S122","S124","S125"]},{"id":"SCE06","start":"1775-12-23","end":"1775-12-30","at":"1775-12-23","name":"Snow Campaign","text":"Richardson's militia, thousands strong, march through the backcountry; the Loyalist leaders are seized or scattered and snow ends the campaign. [T06]","sources":["S118","S121","S123","S125","S127"]},{"id":"SCE07","start":"1776-06-28","end":"1776-06-28","at":"1776-06-28","name":"Sullivan's Island (Fort Sullivan)","text":"The unfinished palmetto fort at the harbour mouth drives off the British fleet. [T07]","sources":["S116","S117","S118","S119","S120"]},{"id":"SCE08","start":"1776-06-28","end":"1776-06-29","at":"1776-06-28","name":"Breach Inlet","text":"Clinton's troops on Long Island find the inlet too deep to wade and cannot cross to Sullivan's Island. [T08]","sources":["S116","S117","S119","S120","S122"]},{"id":"SCE09","start":"1776-07-01","end":"1776-07-01","at":"1776-07-01","name":"Cherokee War begins","text":"The Cherokee strike the western settlements; the war runs to the treaty of 20 May 1777. [T09]","sources":["S118","S123","S127"]},{"id":"SCE10","start":"1776-08-01","end":"1776-08-01","at":"1776-08-01","name":"Esseneca (Seneca Old Town)","text":"A Loyalist and Cherokee force ambushes Williamson's column near the Cherokee town of Esseneca; Pickens arrives and the Patriots recover. [T10]","sources":["S118","S120","S123","S130","S127"]},{"id":"SCE11","start":"1776-08-12","end":"1776-08-12","at":"1776-08-12","name":"Tamassee and the Ring Fight","text":"Pickens and 25 men form a ring against a Cherokee attack near Tamassee until relief arrives; Williamson then burns the town. [T11]","sources":["S116","S118","S120","S123","S130","S122"]},{"id":"SCE12","start":"1778-06-19","end":"1778-06-19","at":"1778-06-19","name":"Capture of privateers, Charleston","text":"The only action the Archives list gives for 1778. Neither the list nor any source read says who took which ships. [T12]","sources":["S116","S127"]},{"id":"SCE13","start":"1779-02-03","end":"1779-02-03","at":"1779-02-03","name":"Port Royal Island (Beaufort)","text":"Moultrie's Continentals and militia beat a British detachment under Major Gardiner near Gray's Hill. [T13]","sources":["S116","S118","S120","S121","S122","S123"]},{"id":"SCE14","start":"1779-05-11","end":"1779-05-13","at":"1779-05-11","name":"Prevost before Charleston","text":"Prevost's army reaches the Charleston lines, then breaks off and withdraws when it learns Lincoln is hurrying back. [T14]","sources":["S116","S118","S121","S124"]},{"id":"SCE15","start":"1779-06-20","end":"1779-06-20","at":"1779-06-20","name":"Stono Ferry","text":"Lincoln attacks the British rear guard at the ferry and is repulsed; both sides lose heavily. [T15]","sources":["S116","S118","S120","S121","S124"]},{"id":"SCE16","start":"1780-03-29","end":"1780-05-12","at":"1780-03-29","name":"Siege of Charleston","text":"Clinton's army and fleet besiege the city; on 12 May Lincoln surrenders the army. [T16]","sources":["S116","S118","S120","S121","S129","S127"]},{"id":"SCE17","start":"1780-04-14","end":"1780-04-14","at":"1780-04-14","name":"Monck's Corner","text":"Tarleton's dragoons surprise Huger's cavalry and militia before dawn, taking horses and wagons and cutting Charleston off. [T17]","sources":["S116","S118","S120","S121"]},{"id":"SCE18","start":"1780-05-06","end":"1780-05-06","at":"1780-05-06","name":"Lenud's Ferry","text":"Tarleton surprises the American cavalry at the Santee crossing and scatters it. [T18]","sources":["S116","S118","S120","S121"]},{"id":"SCE19","start":"1780-05-29","end":"1780-05-29","at":"1780-05-29","name":"Waxhaws (Buford's defeat)","text":"Tarleton's Legion overtakes Buford's Virginians and cuts them down as they try to surrender. [T19]","sources":["S116","S118","S121"]},{"id":"SCE20","start":"1780-06-06","end":"1780-06-06","at":"1780-06-06","name":"Alexander's Old Field (Beckhamville)","text":"Local Patriots beat a Loyalist party at Alexander's Old Field. Read in Morgan's list and the Archives list only. [T20]","sources":["S116","S127"]},{"id":"SCE21","start":"1780-07-12","end":"1780-07-12","at":"1780-07-12","name":"Huck's Defeat (Williamson's Plantation)","text":"Patriot militia surprise Captain Huck's Loyalist and British detachment; Huck is killed. [T21]","sources":["S116","S118","S121"]},{"id":"SCE22","start":"1780-07-30","end":"1780-07-30","at":"1780-07-30","name":"Rocky Mount","text":"Sumter attacks the Loyalist post but cannot take it and withdraws. [T22]","sources":["S116","S118","S121","S127"]},{"id":"SCE23","start":"1780-07-30","end":"1780-07-30","at":"1780-07-30","name":"Hanging Rock I (Davie's raid)","text":"Davie's North Carolinians ambush a Loyalist party near Hanging Rock and take horses and arms. [T23]","sources":["S116","S118","S120","S121","S127"]},{"id":"SCE24","start":"1780-08-06","end":"1780-08-06","at":"1780-08-06","name":"Hanging Rock II","text":"Sumter attacks the Loyalist camp at Hanging Rock; heavy losses on both sides, and the Americans leave without holding the post. [T24]","sources":["S116","S118","S120","S121"]},{"id":"SCE26","start":"1780-08-15","end":"1780-08-17","at":"1780-08-15","name":"Cary's Fort (Sumter's raid)","text":"Sumter's raid takes a post and a British supply convoy near the Wateree. Date uncertain: 15 Aug in the Archives list and NPS, 16-17 Aug in the ABT Fishing Creek page as Morgan read it. [T26]","sources":["S116","S118","S127"]},{"id":"SCE25","start":"1780-08-16","end":"1780-08-16","at":"1780-08-16","name":"Camden","text":"Cornwallis routs Gates's army north of Camden and takes its guns and wagons. [T25]","sources":["S116","S118","S120","S121"]},{"id":"SCE27","start":"1780-08-18","end":"1780-08-18","at":"1780-08-18","name":"Fishing Creek","text":"Tarleton surprises Sumter's camp, scatters his command and retakes the convoy and prisoners. [T27]","sources":["S116","S118","S121","S127"]},{"id":"SCE28","start":"1780-08-18","end":"1780-08-19","at":"1780-08-18","name":"Musgrove Mill","text":"Patriot militia ambush and beat a Loyalist and British force at the Enoree. [T28]","sources":["S116","S118","S121","S127"]},{"id":"SCE29","start":"1780-08-25","end":"1780-08-25","at":"1780-08-25","name":"Nelson's Ferry","text":"Marion ambushes a British convoy and frees about 150 prisoners taken at Camden. Read in Morgan's list, the NPS timeline and the Archives list only. [T29]","sources":["S116","S118","S127"]},{"id":"SCE30","start":"1780-09-04","end":"1780-09-04","at":"1780-09-04","name":"Blue Savannah","text":"Marion ambushes Loyalists at Blue Savannah. Read in Morgan's list, the NPS timeline and the Archives list only. [T30]","sources":["S116","S118","S127"]},{"id":"SCE31","start":"1780-09-28","end":"1780-09-29","at":"1780-09-28","name":"Black Mingo","text":"Marion attacks a Loyalist camp near midnight and drives it into the swamp. [T31]","sources":["S116","S118","S121","S127"]},{"id":"SCE32","start":"1780-10-07","end":"1780-10-07","at":"1780-10-07","name":"Kings Mountain","text":"Frontier militia surround and destroy Ferguson's Loyalist force on the ridge. [T32]","sources":["S116","S118","S121","S127"]},{"id":"SCE33","start":"1780-10-25","end":"1780-10-25","at":"1780-10-25","name":"Tearcoat Swamp","text":"Marion's midnight attack routs Tynes's Loyalist camp. [T33]","sources":["S116","S118","S120","S122","S124","S125","S126"]},{"id":"SCE34","start":"1780-11-09","end":"1780-11-09","at":"1780-11-09","name":"Fish Dam Ford","text":"Wemyss's night attack on Sumter's camp fails; Wemyss is wounded and taken. [T34]","sources":["S116","S118","S121","S122","S124","S125"]},{"id":"SCE35","start":"1780-11-20","end":"1780-11-20","at":"1780-11-20","name":"Blackstock's","text":"Tarleton attacks Sumter's position and is beaten back with heavy loss; Sumter is badly wounded. [T35]","sources":["S116","S118","S121","S127"]},{"id":"SCE36","start":"1780-12-04","end":"1780-12-04","at":"1780-12-04","name":"Rugeley's Mill","text":"Colonel Rugeley's Loyalists surrender to Washington's dragoons. Read in Morgan's list and the Archives list only (Archives dates it 1 Dec). [T36]","sources":["S116","S127"]},{"id":"SCE37","start":"1780-12-12","end":"1780-12-12","at":"1780-12-12","name":"Halfway Swamp","text":"Marion's men meet a large Loyalist and British party. Accounts differ on whether a fight took place. [T37]","sources":["S116","S118","S122"]},{"id":"SCE38","start":"1780-12-30","end":"1780-12-30","at":"1780-12-30","name":"Hammond's Store","text":"Washington's dragoons ride down a Loyalist force sent from Georgia. [T38]","sources":["S116","S118","S121","S127"]},{"id":"SCE39","start":"1781-01-17","end":"1781-01-17","at":"1781-01-17","name":"Cowpens","text":"Morgan defeats Tarleton's British regulars. [T39]","sources":["S116","S118","S121","S127","S96"]}],"sources":{"S116":{"title":"Battles, Skirmishes, and Actions of the American Revolution in South Carolina (list of 182 actions)","author":"Terry W. Lipscomb (South Carolina Department of Archives and History, for the SC American Revolution Bicentennial Commission)","date":"1976","citation":"Lipscomb, Terry W. Battles, Skirmishes, and Actions of the American Revolution in South Carolina. Columbia: SC Department of Archives and History, 1976 (reprint). List numbers 1-84 cover April 1775 to 17 January 1781.","type":"Reference list: dates, names, counties","url":"https://scdah.sc.gov/sites/scdah/files/Documents/Research%20and%20Genealogy/Resources/Military%20Records/BattlesSkirmishes.pdf","rights":"State publication, copyrighted: read for dates and names; nothing copied or hosted."},"S117":{"title":"South Carolina Revolutionary War Battles, part 1: The Carolina lowcountry, April 1775 to June 1776, and the Battle of Fort Moultrie","author":"Terry W. Lipscomb (SC Department of Archives and History)","date":"1994 (2nd ed.)","citation":"Lipsco .578474],"angle":19,"level":1,"kind":"water","show":"recon"}],"maps":[{"id":"mouzon-1775-fitted","title":"Mouzon, An accurate map of North and South Carolina (1775), South Carolina, fitted to the ground","short":"Mouzon 1775","label":"Mouzon 1775, fitted","credit":"Mouzon, 1775 · Library of Congress","source":"S135","fit":{"method":"thin-plate spline with a plane for each section of the cloth-mounted copy, from 14 point controls and the rivers, coast and North Carolina line matched to Natural Earth (pipeline/georef/sc_mouzon_fit.py); the picture is the scan resampled onto the ground (Web Mercator)","controls":14,"loo_km":{"median":1.1,"max_inland":4.4,"north_west":26.4}},"note":"Resampled from a half-resolution crop of the Library of Congress scan. The white bands are the gaps between the sections of the cloth-mounted copy; at the edges of the sections, and in the north-west and north-east corners, the picture is stretched.","images":[{"file":"mouzon-1775-fitted.webp","corners":[[-83.45,35.3],[-78.45,35.3],[-78.45,31.95],[-83.45,31.95]]}]}],"base":{"lines":[],"areas":[],"credit":""},"summaries":[{"kind":"year","from":"1775-01-01","to":"1775-12-31","title":"1775: the Patriots take the forts","text":"The royal government loses its grip. Patriot leaders carry off the arms in Charleston, the Crown's forts at Charlotte and Johnson are given up without a fight, and in the backcountry the first bloodshed ends in a truce and then a Patriot march that breaks the Loyalist camps.","sources":["S116","S117","S118","S120"]},{"kind":"year","from":"1776-01-01","to":"1776-12-31","title":"1776: the fort holds, the Cherokee war","text":"The palmetto fort on Sullivan's Island drives off the British fleet in June, and Breach Inlet stops the landing. The Cherokee war opens on the western frontier in July; results of the August fights are disputed.","sources":["S117","S118","S119","S123"]},{"kind":"year","from":"1777-01-01","to":"1777-12-31","title":"1777: a gap in the list","text":"The Archives list has no action for 1777. The one thing read for the year is the end of the Cherokee war: the treaty of 20 May 1777 gives up the Lower Towns' lands.","sources":["S116","S130"]},{"kind":"year","from":"1778-01-01","to":"1778-12-31","title":"1778: one entry","text":"The list has one entry for the year, the capture of privateers at Charleston on 19 Jun. Nothing read says who took them.","sources":["S116"]},{"kind":"year","from":"1779-01-01","to":"1779-12-31","title":"1779: Prevost's move","text":"Moultrie beats a British detachment on Port Royal Island in February. In May Prevost's army reaches the Charleston lines and withdraws when Lincoln hurries back. In June Lincoln's attack at Stono Ferry is repulsed; the sources differ on how to score it.","sources":["S116","S118","S120","S121"]},{"kind":"year","from":"1780-01-01","to":"1780-12-31","title":"1780: Charleston falls, then the partisan war","text":"The British besiege Charleston and Lincoln surrenders on 12 May. Tarleton wins at Monck's Corner, Lenud's Ferry and the Waxhaws, and Cornwallis routs Gates at Camden in August. Local Patriot partisans (Sumter, Marion, the Over-Mountain men) win at Huck's Defeat, Musgrove Mill, Black Mingo, Kings Mountain, Tearcoat Swamp and Fish Dam Ford; Sumter is beaten at Fishing Creek.","sources":["S116","S118","S120","S121","S129"]},{"kind":"year","from":"1781-01-01","to":"1781-01-17","title":"1781: Cowpens","text":"On 17 Jan Morgan beats Tarleton at Cowpens. Playback ends here; the later actions are loaded as data only.","sources":["S118","S121"]},{"kind":"end","from":"1781-01-17","to":"1781-01-17","title":"Where things stood on 17 January 1781","text":"The British hold Charleston and the posts inland; Patriot partisans hold the swamps and the backcountry, and Morgan's win at Cowpens has opened Greene's campaign. Who held which place is drawn from the control rows, several of them low confidence.","sources":["S116","S118","S121"]}],"clashes":[{"id":"SCC01","event":"SCE01","kind":"capture","won_by":"US","at":[-79.94194,32.79417],"place":"Charleston (State House, Broad and Meeting Streets)","result":"Arms and powder taken from the State House and two magazines, no fight","captured":"About 800 muskets and other arms from the State House attic; about 1,600 lb of powder from the Hobcaw and Cochran's magazines","captured_by":"US","method":"stated","confidence":"high","location":{"source":"derived","basis":"Taken at town level from the infobox coordinate of the Siege of Charleston article (S121); the State House stood at the northwest corner of Broad and Meeting Streets (S117), about 2 km south-southeast of that point, and the powder magazines lay across the Cooper River (Hobcaw) and north of the town (Cochran's). To be read from a modern map.","confidence":"low","precision_m":3000},"sources":["S116","S117","S121"],"notes":"Cross-checked: S116 (list no. 1) and S117 (place, quantities). No second source gives the quantities.","review":"Needs review"},{"id":"SCC02","event":"SCE02","kind":"capture","won_by":"US","at":[-82.539924,33.952711],"place":"Fort Charlotte (now under Lake Thurmond)","result":"Fort surrendered without a fight","captured":"The fort","captured_by":"US","method":"stated","confidence":"high","location":{"source":"marker","basis":"Taken from the GPS of the Fort Charlotte memorial site on the lake shore (S126); the marker on Route 81 at Mt. Carmel (34.0059, -82.5072) says the ruins lie 6.6 miles southwest of it (HMdb 9185, S122). The ruins lie under the lake, so the true point is within about 2 km.","confidence":"low","precision_m":2000},"sources":["S116","S122","S126"],"notes":"Cross-checked: S116 (list no. 3), HMdb marker 9185 (Mayson seized it 12 Jul 1775; Whitfield surrendered it) (peaceful surrender).","review":"Needs review"},{"id":"SCC03","event":"SCE03","kind":"capture","won_by":"US","at":[-79.933145,32.730326],"place":"Fort Johnson, James Island","result":"Fort taken without a fight after the navy disabled its guns","captured":"The fort (the British had disabled its guns)","captured_by":"US","method":"stated","confidence":"high","location":{"source":"marker","basis":"The coordinates ABT gives for Fort Johnson (Fort Johnson Rd, northeast point of James Island, S120); Lipscomb places the fort on Windmill Point (S117).","confidence":"medium","precision_m":300},"sources":["S116","S117","S120"],"notes":"Cross-checked: S117 (the navy disabled the guns; Motte entered; three privates left; no fighting) and the ABT heritage-site page (Motte took it with little resistance). The ABT page gives no day; The Archives list gives 15 Sep.","review":"Needs review"},{"id":"SCC04","event":"SCE04","kind":"fight","won_by":"indecisive","at":[-82.02444,34.14694],"place":"Savage's Old Field / Williamson's fort, Ninety Six","result":"Loyalists besiege Williamson's camp; a truce ends it","disputed":true,"other":{"text":"The NPS timeline dates the siege 10-21 Nov 1775 and the park brochure puts the first attack on 18 Nov; the Archives list, Wikipedia and the NPS anniversary page say 19-21 Nov. All sources read agree on the result: no winner and a truce.","sources":["S118","S128"]},"hypothesis":"SCH01","method":"stated","confidence":"medium","location":{"source":"marker","basis":"The knoll in Ninety Six National Historic Site where the 1775 stockade stood (NPS online tour stop 16 and the Colonials and Patriots survey, S128); Wikipedia's infobox coordinate for the site (S121); HMdb 30623 marker at 34.1469, -82.0232 (S122).","confidence":"medium","precision_m":400},"sources":["S116","S118","S121","S128"],"notes":"Loss: Patriots 1 killed 12 wounded, Loyalists 4 killed 20 wounded (S121, citing Cann, SCHM 76, pp. 207-214). Date disagreement only; result agreed. Dagger on the date.","review":"Needs Opus"},{"id":"SCC05","event":"SCE05","kind":"fight","won_by":"US","at":[-82.316383,34.656117],"place":"Great Cane Brake (Reedy River, near Simpsonville)","result":"Loyalist camp surprised; about 130 taken","captured":"
