,35.127],[-81.788,35.126],[-81.7885,35.1251],[-81.7892,35.1242],[-81.79,35.1234],[-81.7905,35.12294],[-81.78966,35.12153],[-81.7892,35.12083],[-81.78881,35.12036],[-81.78809,35.11965],[-81.78522,35.11735],[-81.78496,35.11705],[-81.78463,35.1165],[-81.78412,35.11533]],"leaving":true}]}],"events":[{"id":"CE01","start":"1781-01-17T06:00","end":"1781-01-17T06:30","at":"1781-01-17T06:05","name":"Morgan forms for battle","text":"About an hour before daylight a scout reports Tarleton within five miles. Morgan turns his men out and puts them in three lines across the Green River Road: riflemen in front, Pickens's militia behind them, and Howard's Continentals and Virginians on the rise behind, with Washington's cavalry in reserve.","steps":["CP01"],"sources":["S95","S96","S100"],"battle":"COWP"},{"id":"CE02","start":"1781-01-17T06:30","end":"1781-01-17T07:00","at":"1781-01-17T06:46","name":"The pickets are driven in","label":"Pickets driven in","text":"About day, Tarleton's advance guard of Legion dragoons drives in Capt. Inman's mounted pickets on the Green River Road and finds the Americans drawn up to fight.","steps":["CP41"],"sources":["S95","S97","S101","S104"],"battle":"COWP"},{"id":"CE03","start":"1781-01-17T06:50","end":"1781-01-17T08:00","at":"1781-01-17T06:58","name":"Tarleton deploys","text":"The British come out of the woods and form one line in sight of the Americans: light infantry on the right, the Legion infantry in the centre, the 7th Fusiliers on the left, a 3-pounder in each gap and fifty dragoons on each flank. The 71st Highlanders and about 200 Legion cavalry stand in reserve 150 yards back.","steps":["CP51","CP61","CP71","CP81","CP91","CP101","CP111","CP121","CP131"],"sources":["S95","S96","S97","S100"],"battle":"COWP"},{"id":"CE04","start":"1781-01-17T07:00","end":"1781-01-17T08:05","at":"1781-01-17T07:03","name":"First shots","text":"Tarleton sends Ogilvie's Legion dragoons to drive in the riflemen in front. The riflemen fire from behind the trees and the dragoons come back with empty saddles. Militia veterans gave John Savage of Brandon's regiment the first shot.","steps":["CP42","CP05","CP06"],"sources":["S95","S101","S104","S105","S106"],"battle":"COWP"},{"id":"CE05","start":"1781-01-17T07:10","end":"1781-01-17T08:10","at":"1781-01-17T07:12","name":"The British line advances","label":"The line advances","text":"About sunrise the two guns open and the whole line comes on with three cheers. Morgan answers along the militia line: \"They gave us the British halloo, boys, give them the Indian halloo.\"","steps":["CP52","CP62","CP72","CP82","CP92"],"sources":["S95","S96","S100","S101"],"battle":"COWP"},{"id":"CE06","start":"1781-01-17T07:20","end":"1781-01-17T08:20","at":"1781-01-17T07:21","name":"The skirmishers fall back","text":"McDowell's and Cunningham's riflemen, having picked off officers at long range, fall back on Pickens's line.","steps":["CP07","CP08","CP52","CP62","CP72"],"sources":["S95","S96","S100"],"battle":"COWP"},{"id":"CE07","start":"1781-01-17T07:28","end":"1781-01-17T08:30","at":"1781-01-17T07:29","name":"The militia volleys","text":"Pickens's militia hold their fire until the British are within killing distance, then fire by regiments: \"pop, pop, pop, and then a whole volley\". The British line halts to dress and comes on again.","steps":["CP10","CP53","CP63","CP73"],"sources":["S95","S96","S100","S101","S105"],"battle":"COWP"},{"id":"CE08","start":"1781-01-17T07:31","end":"1781-01-17T08:36","at":"1781-01-17T07:34","name":"The militia withdraw; dragoons ride them down","label":"Militia withdraw","text":"As ordered, the militia file off round Howard's line, most of them round its left, to re-form in rear. The 17th Light Dragoons on Tarleton's right charge after them towards their horses; Washington's cavalry strikes the dragoons and drives them back.","steps":["CP15","CP124","CP33"],"sources":["S95","S96","S98","S101","S104"],"battle":"COWP"},{"id":"CE09","start":"1781-01-17T07:37","end":"1781-01-17T08:41","at":"1781-01-17T07:38","name":"Line against line","text":"The British infantry close on Howard's line and the two fire at close range, neither giving way. Tarleton orders up the 71st on his left to turn Howard's right, and the reserve cavalry to follow it; the cavalry does not come.","steps":["CP20","CP54","CP64","CP74","CP102"],"sources":["S95","S97","S98","S100"],"battle":"COWP"},{"id":"CE10","start":"1781-01-17T07:39","end":"1781-01-17T08:42","at":"1781-01-17T07:40","name":"Howard's line falls back","label":"Howard falls back","text":"Howard orders his right company to face the Highlanders. The order goes wrong; the company faces about, and the rest of the line, taking it for a retreat, marches to the rear in good order. Morgan picks the ground for it to halt, about 80 to 100 yards back.","steps":["CP24","CP03","CP103"],"sources":["S95","S96","S98","S101"],"battle":"COWP"},{"id":"CE11","start":"1781-01-17T07:45","end":"1781-01-17T08:46","at":"1781-01-17T07:45","name":"Face about: volley and bayonet","label":"Volley and bayonet","text":"The British, sure the day is won, rush on out of order. At 10 to 30 yards Howard's line faces about and fires; then it charges with the bayonet. The British line stops, breaks and runs.","steps":["CP24","CP55","CP65","CP75","CP103"],"sources":["S95","S96","S97","S98","S100"],"battle":"COWP"},{"id":"CE12","start":"1781-01-17T07:50","end":"1781-01-17T08:52","at":"1781-01-17T07:50","name":"Double envelopment","text":"Washington's cavalry rides round the British right and into their rear; Pickens's militia come back into the fight round the American right, onto the 71st. The infantry throw down their arms. The gunners fight to the last by their two 3-pounders, which are taken.","steps":["CP28","CP35","CP16","CP56","CP66","CP76","CP104","CP85","CP95"],"sources":["S95","S96","S98","S101","S105"],"battle":"COWP"},{"id":"CE13","start":"1781-01-17T07:54","end":"1781-01-17T09:00","at":"1781-01-17T07:55","name":"Tarleton's last charge","text":"The Legion cavalry will not charge and about 200 of them leave the field. Tarleton leads some fifty horsemen, most of them of the 17th Light Dragoons, at the American cavalry and is beaten off; he and Washington cross swords before he rides away down the Green River Road.","steps":["CP136","CP126","CP36","CP112"],"sources":["S95","S96","S97","S98","S105"],"battle":"COWP"},{"id":"CE14","start":"1781-01-17T08:00","end":"1781-01-17T09:00","at":"1781-01-17T08:08","name":"Pursuit","text":"Washington and Pickens follow Tarleton for 22 to 24 miles without catching him; the British burn most of their baggage. Morgan counts over 500 prisoners, two guns and two colours for 12 killed and about 60 wounded, and marches off the field the same day to get the prisoners away from Cornwallis.","steps":["CP37","CP137","CP04"],"sources":["S95","S96","S104"],"battle":"COWP"}],"sources":{"S100":{"title":"Journals of the Delaware Regiment: Lt. Thomas Anderson and Sgt. Maj. William Seymour","author":"Thomas Anderson; William Seymour","date":"1781","citation":"Thomas Anderson, journal, entry for 17 January 1781, and William Seymour, journal, the same day; as printed in Moncure (S95), appendix C, pp. 139-142.","type":"Primary: two journals kept in the Continental line","url":"https://archive.org/details/DTIC_ADA530379","rights":"Public domain. Read in a U.S. Army publication."},"S101":{"title":"Memoirs and pension statements of the militia and the dragoons at the Cowpens","author":"Joseph McJunkin; Thomas Young; James Collins; John Thomas; William Neel; Henry Connally; John Baldwin; James Simmons; James Kelley","date":"1803 to the 1840s","citation":"As printed in Moncure (S95), appendix C: McJunkin, pp. 133-135; Young, pp. 135-138; Connally, pp. 138-139; Kelley, pp. 142-143; Simmons, pp. 143-144; Baldwin, p. 144; Neel, pp. 144-145; Thomas, p. 145; Collins, pp. 145-146.","type":"Primary: participants, written or sworn long afterwards","url":"https://archive.org/details/DTIC_ADA530379","rights":"Public domain. Read in a U.S. Army publication."},"S102":{"title":"Strictures on Lt. Col. Tarleton's History (the Cowpens letter)","author":"Lt. Roderick Mackenzie, 71st Regiment","date":"1787","citation":"Roderick Mackenzie, Strictures on Lt. Col. Tarleton's History (London, 1787); the Cowpens letter as printed in Moncure (S95), appendix C, pp. 151-153, with Moncure's notes 32-34 (p. 68) on Hanger's reply.","type":"Primary: British participant, written against Tarleton","url":"https://archive.org/details/DTIC_ADA530379","rights":"Public domain (1787). Read in a U.S. Army publication."},"S103":{"title":"Historical Statements Concerning the Battle of Kings Mountain and the Battle of the Cowpens, South Carolina","author":"Historical Section, Army War College (Lt. Col. H. L. Landers, F.A.)","date":"1928","citation":"70th Congress, 1st Session, House Document No. 328 (Washington: Government Printing Office, 1928). The Battle of the Cowpens, pp. 46-78 and the plates facing p. 78.","type":"Early secondary: Army War College study printed for Congress, with sketch maps and photographs of the ground","url":"https://archive.org/details/historicalstatem00army","rights":"U.S. government publication of 1928: public domain."},"S104":{"title":"Cowpens: \"Downright Fighting\", The Story of Cowpens (National Park Handbook 135)","author":"Thomas J. Fleming","date":"1988","citation":"Thomas J. Fleming, Cowpens: \"Downright Fighting\" (Washington, D.C.: Division of Publications, National Park Service, 1988), 96 pp. ISBN 0-912627-33-6.","type":"Modern secondary: National Park Service handbook","url":"https://archive.org/details/cowpens00nati","rights":"National Park Service publication (Government Printing Office, 1988). The Internet Archive marks it public domain and Project Gutenberg carries it (ebook 62413). Its paintings and maps may carry their own credits. Cited and linked, not hosted."},"S105":{"title":"Wayside exhibits on the battlefield, Cowpens National Ba ements of Phases I to IV.","type":"Modern secondary: National Park Service study, with four troop movement maps on a surveyed base","url":"https://dc.statelibrary.sc.gov/items/ef5e6740-8015-4647-88b3-9820a8382285","rights":"National Park Service study of 1967 by an NPS historian: a U.S. government work, public domain. Morgan's copy carries no copyright notice. The 1996 Overmountain Press reprint is a separate edition and is not the copy used. 24 Nov 2026: the title page reads Office of Archeology and Historic Preservation, National Park Service, U.S. Department of the Interior, and the copy has no copyright notice or reprint imprint: the four plates are hosted."},"S108":{"title":"Cowpens, S.C., 15-minute series topographic map, 1:62,500","author":"U.S. Geological Survey","date":"1959","citation":"U.S. Geological Survey, Cowpens, S.C., 15-minute series (topographic), 1:62,500 (1959). Historical Topographic Map Collection, GeoTIFF SC_Cowpens_261816_1959_62500_geo.","type":"Survey map: USGS topographic quadrangle","url":"https://prd-tnm.s3.amazonaws.com/StagedProducts/Maps/HistoricalTopo/GeoTIFF/SC/SC_Cowpens_261816_1959_62500_geo.tif","rights":"U.S. government work: public domain."},"S109":{"title":"Cowpens NE, S.C., 7.5-minute series orthophoto map, 1:24,000","author":"U.S. Geological Survey","date":"1975","citation":"U.S. Geological Survey, Cowpens NE, S.C., 7.5-minute series (orthophotomap), 1:24,000 (1975). Historical Topographic Map Collection, GeoTIFF SC_Cowpens NE_260906_1975_24000_geo.","type":"Survey map: USGS orthophoto quadrangle (an aerial photograph drawn to scale)","url":"https://prd-tnm.s3.amazonaws.com/StagedProducts/Maps/HistoricalTopo/GeoTIFF/SC/SC_Cowpens%20NE_260906_1975_24000_geo.tif","rights":"U.S. government work: public domain."},"S110":{"title":"Spartanburgh District, South Carolina (Mills's Atlas)","author":"Robert Mills; surveyed by J. Whitten, 1820; engraved by H. S. Tanner","date":"1825","citation":"Robert Mills, Spartanburgh District, South Carolina. Surveyed by J. Whitten, 1820. Improved for Mills' Atlas, 1825. Scale 2 miles to an inch. Library of Congress, Geography and Map Division, G3913.S7 1820 .M5 (LC Civil War maps, 2nd ed., S153: a tracing, \"Approved Chas. R. Suter\", Sherman #153).","type":"Period map: district map of the state atlas, here in a pen-and-ink tracing made for the Union army (1865)","url":"https://www.loc.gov/item/2007627909/","rights":"Published 1825; the tracing is a U.S. Army work of 1865. Public domain; the Library of Congress gives it as free to use."},"S111":{"title":"Park Map - Cowpens National Battlefield","author":"National Park Service","date":"2020s","citation":"National Park Service, Harpers Ferry Center, Park Map - Cowpens National Battlefield (NPGallery asset ad1a1112-bd76-4068-bba9-6e7232890013).","type":"Modern map: the park's own map","url":"https://www.nps.gov/npgallery/AssetDetail/ad1a1112-bd76-4068-bba9-6e7232890013","rights":"National Park Service map: public domain (NPGallery: \"government produced and in the public domain\")."},"S39":{"title":"OpenStreetMap: place coordinates and the current maps under each battle","author":"OpenStreetMap contributors","date":"2026-11-13","citation":"OpenStreetMap contributors. Extracts taken for each battle in November 2026 (data/osm/); the Trenton extract is from the Overpass API, 13 Nov 2026 (UTC), 188 ways, simplified","type":"Current map data","url":"https://www.openstreetmap.org/copyright","rights":"Open Database License: credit \"© OpenStreetMap contributors\""},"S95":{"title":"The Cowpens Staff Ride and Battlefield Tour","author":"Lt. Col. John Moncure","date":"1996","citation":"John Moncure, The Cowpens Staff Ride and Battlefield Tour (Fort Leavenworth, Kans.: Combat Studies Institute, U.S. Army Command and General Staff College, 1996), x + 208 pp., 15 maps. DTIC ADA530379.","type":"Modern secondary: Army staff ride handbook, with the eyewitness documents in its appendixes","url":"https://archive.org/details/DTI
