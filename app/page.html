<title>__PAGETITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="__APP__/vendor/maplibre-gl.css">
<link rel="stylesheet" href="__APP__/core.css">
<div class="app">
  <header class="bar gut">
    <div class="ttl">
      <a class="home" href="__HOME__">&larr; WarMapper: all battles</a>
      <h1>__HEADING__</h1>
      <p>__TAGLINE__</p>
    </div>
  </header>

  <main class="stage">
    <div class="mapwrap" id="mapwrap" tabindex="0" aria-label="Battle map. Scroll or pinch to zoom, drag to pan. To move time, scroll over the timeline or use the arrow keys; [ and ] jump between key events.">
      <div id="map"></div>
      <svg id="ov" aria-hidden="true"></svg>
      <div class="ctl c-l" id="ctl"></div>
      <div class="ctl c-r">
        <button class="sq" id="zin" aria-label="Zoom in">+</button>
        <button class="sq" id="zout" aria-label="Zoom out">&minus;</button>
        <button class="sq one" id="z11" aria-label="Full detail: one pixel of the scan to one pixel of the screen" title="Full detail: one pixel of the scan to one pixel of the screen" hidden>1:1</button>
        <button class="sq" id="zfit" aria-label="Fit the whole battle on screen" title="Fit the whole battle on screen"><svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.8" y="3.3" width="12.4" height="9.4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="6" width="6" height="4" fill="currentColor"/></svg></button>
        <button class="sq" id="zfull" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <button class="sq info" id="binfo" aria-label="About the map on screen" title="About the map on screen">i</button>
        <button class="sq pane" id="bpane" aria-label="Hide the text" title="Hide the text" aria-pressed="false"><svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="9.5" y="3.5" width="4" height="9" fill="currentColor"/></svg></button>
      </div>
      <div class="pop" id="pType" hidden></div>
      <div class="pop" id="layers" hidden></div>
      <div class="pop" id="pBattle" hidden></div>
      <button class="cont" id="cont" hidden><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg><span id="contTx">Continue</span></button>
      <div class="ask" id="ask" role="dialog" aria-labelledby="askq" hidden><p id="askq"></p><div class="askb"><button id="ask-day">Each day</button><button id="ask-week">Each week</button><button id="ask-off">Play straight through</button></div><p class="gn">You can change this later in Battle options.</p></div>
      <button class="rcnote" id="rcnote" title="This map is a WarMapper reconstruction, not a period map. Tap for what it was drawn from." hidden></button>
      <div class="offnote" id="offnote" hidden></div>
      <div class="narr" id="narr" hidden></div>
      <div class="bl"><div class="when" id="when" aria-live="off"><div class="bn" id="clockbattle"></div><div class="dayn" id="dayn" hidden></div><div class="t" id="clock"></div><div class="d" id="clockdate"></div><div class="n" id="clocknote" hidden></div></div>
      <div class="scale" id="scale" aria-label="Map scale"></div></div>
      <div class="hint" id="hint">Scroll or pinch to zoom &middot; drag to pan &middot; scroll over the timeline to move time</div>
      <div class="credit" id="credit"></div>
    </div>
    <div class="sheetbar" id="sheetbar"><button class="grab" id="grab" aria-label="Show more of the text" title="Drag or tap to show more or less text"><span></span></button></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="tlbar gut">
    <button class="tb rs" id="restart" aria-label="Start over" title="Start over: back to the beginning, on the opening map and view"><svg viewBox="0 0 16 16"><path d="M2.5 2.5v11" fill="none"/><path d="M14 2.5v11L5 8z"/></svg></button>
    <button class="tb" id="evprev" aria-label="Back one step" title="Back one step"><svg viewBox="0 0 16 16"><path d="M8 3L1.5 8 8 13zM15 3L8.5 8 15 13z"/></svg></button>
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 16 16" id="playico"><path d="M3 1.5v13l11-6.5z"/></svg></button>
    <button class="tb" id="evnext" aria-label="Forward one step" title="Forward one step"><svg viewBox="0 0 16 16"><path d="M8 3l6.5 5L8 13zM1 3l6.5 5L1 13z"/></svg></button>
    <button class="stepb" id="step" title="How far the back and forward buttons, arrow keys and scroll move time, and how fast it plays. Click to change."></button>
    <div class="tl" id="tl">
      <div class="rail"></div><div class="win" id="win"></div><div class="done" id="done"></div>
      <input type="range" id="time" min="0" max="4000" step="1" value="0" aria-label="Time">
    </div>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script src="__APP__/vendor/maplibre-gl.js"></script>
<script src="__APP__/core.js"></script>
<script src="__APP__/player.js"></script>
<script>WM.play(JSON.parse(document.getElementById('data').textContent));</script>
